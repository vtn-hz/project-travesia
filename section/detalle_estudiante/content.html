      // DATOS DEL PERFIL DEL CURSO: NOMBRE Y LISTA dt/dd (ROLES, GRUPO, ÚLTIMO ACCESO…)
      function leerPerfilMoodle(usuario) {
        var url = M.cfg.wwwroot + '/user/view.php?id=' + encodeURIComponent(usuario) + '&course=' + CURSO;
        return fetch(url, { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var nombre = doc.querySelector('.page-context-header .page-header-headings h2');
            var campos = [];
            doc.querySelectorAll('li.contentnode').forEach(function(li) {
              var dt = li.querySelector('dt');
              var dd = li.querySelector('dd');
              if (dt && dd) campos.push({ etiqueta: dt.textContent.trim(), valor: dd.textContent.replace(/\s+/g, ' ').trim() });
            });
            return { nombre: nombre ? nombre.textContent.trim() : '', campos: campos };
          });
      }

        fd.append('field_' + CAMPOS_ASIGNACIONES.usuario, usuario);
        fd.append('field_' + CAMPOS_ASIGNACIONES.nivel, nivel);
        fd.append('field_' + CAMPOS_ASIGNACIONES.motivo, motivo);
        return fetch(M.cfg.wwwroot + '/mod/data/edit.php', { method: 'POST', body: fd, credentials: 'same-origin' })
          .then(function(r) {
            if (!r.ok) throw new Error('Moodle respondió ' + r.status);
            return { local: false };
          });
      }

      // ---------------------------------------------------------
      // ESTADO EN MEMORIA
      // ---------------------------------------------------------
      var rolActual = ROL_INICIAL;
      var usuario = null;
      var est = null;
      var asignaciones = [];
      var perfil = null; // datos del campus (Moodle) o null en local
      var filtroActividad = '';

      // ---------------------------------------------------------
      // UTILIDADES
      // ---------------------------------------------------------
      function escapar(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
          return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
        });
      }

      function fechaCorta(iso) {
        var p = iso.split('-');
        return p[2] + '/' + p[1] + '/' + p[0];
      }

      function hoyIso() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function chipNivel(nivel) {
        var n = NIVELES[nivel];
        return '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important; height: 24px !important; padding: 0 8px !important; border-radius: 999px !important; border: 1px solid ' + n.borde +
          ' !important; background-color: ' + n.fondo + ' !important; color: ' + n.color + ' !important; font-size: 12px !important; font-weight: 600 !important; white-space: nowrap !important; box-sizing: border-box !important;">' +
          '<span style="width: 8px !important; height: 8px !important; border-radius: 50% !important; background-color: ' + n.punto + ' !important;"></span>' + n.texto + '</span>';
      }

      function chipNeutro(texto) {
        return '<span style="font-size: 11px !important; font-weight: 600 !important; color: #47536b !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 1px 8px !important; line-height: 18px !important; white-space: nowrap !important;">' +
          escapar(texto) + '</span>';
      }

      function tarjeta(titulo, contenido, extra) {
        return '<div style="background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; padding: 16px !important; box-sizing: border-box !important; ' + (extra || '') + '">' +
          '<div style="font-size: 14px !important; font-weight: 600 !important; color: #0b0e14 !important; margin-bottom: 12px !important;">' + titulo + '</div>' + contenido + '</div>';
      }

      // ESTADO VIGENTE: EL ÚLTIMO ASIGNADO (SI NO FUE QUITADO) O EL ÚLTIMO CALCULADO
      function estados() {
        var ultimoCalc = est.calculados[est.calculados.length - 1];
        var calculado = ultimoCalc ? nivelDeValor(ultimoCalc.valor) : 'sin_datos';
        var ultimaAsig = asignaciones[asignaciones.length - 1];
        var asignado = ultimaAsig && ultimaAsig.nivel !== 'auto' ? ultimaAsig : null;
        return { calculado: calculado, ultimoCalc: ultimoCalc, asignado: asignado, vigente: asignado ? asignado.nivel : calculado };
      }

      // ---------------------------------------------------------
      // COLUMNA IZQUIERDA: FOTO Y DATOS DEL CAMPUS
      // ---------------------------------------------------------
      function iniciales(nombre) {
        return nombre.split(/\s+/).filter(Boolean).slice(0, 2).map(function(p) { return p.charAt(0).toUpperCase(); }).join('');
      }

      function columnaPerfil(e) {
        var avatar = '<div style="width: 128px !important; height: 128px !important; border-radius: 50% !important; background-color: #ebeef4 !important; border: 1px solid #dadee7 !important; color: #47536b !important; font-size: 40px !important; font-weight: 600 !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; margin: 0 auto 12px auto !important;">' +
          (perfil ? '<img id="foto-perfil" src="' + escapar(urlFoto(usuario)) + '" alt="Foto de perfil de ' + escapar(e.nombre) + '" style="width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important;">' : '<span aria-hidden="true">' + escapar(iniciales(e.nombre)) + '</span>') + '</div>';
        var est_ = estados();
        var cabecera = avatar +
          '<div style="text-align: center !important; font-size: 18px !important; font-weight: 600 !important;">' + escapar(perfil && perfil.nombre ? perfil.nombre : e.nombre) + '</div>' +
          '<div style="text-align: center !important; color: #47536b !important; margin-bottom: 8px !important;">' + (e.etapa === 1 ? '1.er año' : '2.º año en adelante') + ' · Cohorte ' + escapar(e.cohorte) + '</div>' +
          '<div style="display: flex !important; justify-content: center !important; margin-bottom: 16px !important;">' + chipNivel(est_.vigente) + '</div>';
        var campos = perfil && perfil.campos.length ? perfil.campos : [
          { etiqueta: 'Roles', valor: e.campus.roles },
          { etiqueta: 'Grupo', valor: e.campus.grupo },
          { etiqueta: 'Último acceso al curso', valor: e.campus.ultimoAcceso },
          { etiqueta: 'País', valor: e.campus.pais }
        ];
        campos = [{ etiqueta: 'Id de usuario (Moodle)', valor: usuario }, { etiqueta: 'DNI', valor: e.dni + (perfil ? '' : ' (ficticio)') }].concat(campos);
        var lista = campos.map(function(c) {
          return '<div style="padding: 8px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +
            '<div style="font-size: 12px !important; color: #47536b !important;">' + escapar(c.etiqueta) + '</div>' +
            '<div style="font-weight: 500 !important; overflow-wrap: anywhere !important;">' + escapar(c.valor) + '</div></div>';
        }).join('');
        return tarjeta('Perfil del campus', cabecera + lista);
      }

      // ---------------------------------------------------------
      // GRÁFICO: EVOLUCIÓN DE LA CRITICIDAD (SVG, 0 A 100)
      // ---------------------------------------------------------
      function graficoCriticidad(anchoDisponible) {
        var puntos = est.calculados.filter(function(c) { return c.valor !== null; }).map(function(c) {
          return { fecha: c.fecha, valor: c.valor, origen: 'calculado', texto: c.motivo };
        });
        var marcas = asignaciones.filter(function(a) { return a.nivel !== 'auto'; }).map(function(a) {
          return { fecha: a.fecha, valor: VALOR_ASIGNADO[a.nivel], nivel: a.nivel, origen: 'asignado', texto: a.motivo + ' (' + a.autor + ')' };
        });
        var todas = puntos.concat(marcas);
        if (!todas.length) {
          return '<div style="height: 220px !important; border: 1px dashed #c2c9d6 !important; border-radius: 8px !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 8px !important; color: #47536b !important; text-align: center !important; padding: 16px !important;">' +
            '<span style="color: #94a0b8 !important;">' + icono('tablero', 32) + '</span>Todavía no hay criticidad calculada: faltan notas de parciales.</div>';
        }
        // Se dibuja al ancho real del contenedor para que el texto no se achique en pantallas angostas
        var W = Math.max(280, Math.round(anchoDisponible || 640)), H = W < 480 ? 220 : 260, m = { i: 36, d: 16, a: 12, b: 32 };
        var ancho = W - m.i - m.d, alto = H - m.a - m.b;
        var tiempos = todas.map(function(p) { return Date.parse(p.fecha); });
        var t0 = Math.min.apply(null, tiempos), t1 = Math.max.apply(null, tiempos);
        if (t0 === t1) { t0 -= 15 * 864e5; t1 += 15 * 864e5; }
        var x = function(f) { return m.i + (Date.parse(f) - t0) / (t1 - t0) * ancho; };
        var y = function(v) { return m.a + (100 - v) / 100 * alto; };
        var svg = '<svg id="grafico-criticidad" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Evolución de la criticidad de 0 a 100" style="display: block !important; overflow: visible !important; font-family: inherit !important;">';
        // Bandas del semáforo
        [[100, BANDAS.alto, 'rojo'], [BANDAS.alto, BANDAS.medio, 'amarillo'], [BANDAS.medio, 0, 'verde']].forEach(function(b) {
          svg += '<rect x="' + m.i + '" y="' + y(b[0]) + '" width="' + ancho + '" height="' + (y(b[1]) - y(b[0])) + '" fill="' + NIVELES[b[2]].fondo + '"/>';
        });
        // Grilla y eje Y
        [0, 20, 40, 60, 80, 100].forEach(function(v) {
          svg += '<line x1="' + m.i + '" x2="' + (W - m.d) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(194, 201, 214, 0.6)" stroke-dasharray="' + (v === BANDAS.alto || v === BANDAS.medio ? '0' : '3 3') + '"/>' +
            '<text x="' + (m.i - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#47536b">' + v + '</text>';
        });
        // Eje X: una etiqueta por punto, salteando las que se pisarían con la anterior
        var ultimaX = -Infinity;
        todas.slice().sort(function(a, b) { return a.fecha < b.fecha ? -1 : 1; }).forEach(function(p) {
          var px = x(p.fecha);
          if (px - ultimaX < 56) return;
          ultimaX = px;
          var etiqueta = fechaCorta(p.fecha).slice(0, 5) + '/' + p.fecha.slice(2, 4);
          var ancla = px - m.i < 24 ? 'start' : W - m.d - px < 24 ? 'end' : 'middle';
          svg += '<text x="' + px + '" y="' + (H - 10) + '" text-anchor="' + ancla + '" font-size="11" fill="#47536b">' + etiqueta + '</text>';
        });
        // Línea del estado calculado
        if (puntos.length > 1) {
          svg += '<polyline fill="none" stroke="#026bd4" stroke-width="2.5" stroke-linejoin="round" points="' +
            puntos.map(function(p) { return x(p.fecha) + ',' + y(p.valor); }).join(' ') + '"/>';
        }
        puntos.forEach(function(p) {
          svg += '<g data-punto><title>' + escapar(fechaCorta(p.fecha) + ' · Calculado: ' + p.valor + ' · ' + p.texto) + '</title>' +
            '<circle cx="' + x(p.fecha) + '" cy="' + y(p.valor) + '" r="5" fill="#ffffff" stroke="#026bd4" stroke-width="2.5"/></g>';
        });
        // Marcas de los estados asignados (rombo oscuro en el centro de su banda)
        marcas.forEach(function(p) {
          var cx = x(p.fecha), cy = y(p.valor);
          svg += '<g data-punto><title>' + escapar(fechaCorta(p.fecha) + ' · Asignado: ' + NIVELES[p.nivel].texto + ' · ' + p.texto) + '</title>' +
            '<line x1="' + cx + '" x2="' + cx + '" y1="' + m.a + '" y2="' + (H - m.b) + '" stroke="#0b0e14" stroke-width="1" stroke-dasharray="2 3"/>' +
            '<rect x="' + (cx - 6) + '" y="' + (cy - 6) + '" width="12" height="12" transform="rotate(45 ' + cx + ' ' + cy + ')" fill="' + NIVELES[p.nivel].punto + '" stroke="#0b0e14" stroke-width="2"/></g>';
        });
        svg += '<\/svg>';
        var leyenda = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 8px 16px !important; font-size: 12px !important; color: #47536b !important; margin-top: 8px !important;">' +
          '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important;"><span style="width: 18px !important; height: 3px !important; background-color: #026bd4 !important; border-radius: 2px !important;"></span>Calculada por el sistema</span>' +
          '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important;"><span style="width: 10px !important; height: 10px !important; background-color: #ffffff !important; border: 2px solid #0b0e14 !important; transform: rotate(45deg) !important; box-sizing: border-box !important;"></span>Asignada por un tutor</span>' +
          '<span>Bandas: ' + BANDAS.alto + ' o más riesgo alto · ' + BANDAS.medio + ' a ' + (BANDAS.alto - 1) + ' riesgo medio · menos de ' + BANDAS.medio + ' sin riesgo</span></div>';
        return svg + leyenda;
      }

      // ---------------------------------------------------------
      // REGISTRO DE ACTIVIDADES (HISTORIAL DE CRITICIDAD)
      // ---------------------------------------------------------
      function registroActividades() {
        var items = est.actividades.map(function(a) { return { fecha: a.fecha, tipo: a.tipo, texto: a.texto }; })
          .concat(est.calculados.map(function(c) { return { fecha: c.fecha, tipo: 'calculado', texto: c.motivo, valor: c.valor }; }))
          .concat(asignaciones.map(function(a) { return { fecha: a.fecha, tipo: 'asignado', texto: a.nivel === 'auto' ? 'Quitó el estado asignado: ' + a.motivo : a.motivo, autor: a.autor, nivel: a.nivel }; }))
          .sort(function(a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
        var tipos = Object.keys(ACTIVIDADES).filter(function(k) { return items.some(function(i) { return i.tipo === k; }); });
        var filtros = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 6px !important; margin-bottom: 12px !important;">' +
          [''].concat(tipos).map(function(k) {
            var activo = filtroActividad === k;
            return '<span role="button" tabindex="0" data-filtro-actividad="' + k + '" aria-pressed="' + activo + '" style="display: inline-flex !important; align-items: center !important; height: 28px !important; padding: 0 10px !important; border-radius: 999px !important; font-size: 12px !important; font-weight: 500 !important; cursor: pointer !important; border: 1px solid ' + (activo ? '#026bd4' : '#dadee7') + ' !important; background-color: ' + (activo ? '#e5f2ff' : '#ffffff') + ' !important; color: ' + (activo ? '#024a92' : '#47536b') + ' !important; box-sizing: border-box !important;">' +
              (k ? ACTIVIDADES[k].texto : 'Todo') + '</span>';
          }).join('') + '</div>';
        var lista = items.filter(function(i) { return !filtroActividad || i.tipo === filtroActividad; }).map(function(i) {
          var extra = '';
          if (i.tipo === 'calculado') extra = chipNivel(nivelDeValor(i.valor)) + (i.valor === null ? '' : chipNeutro('Criticidad ' + i.valor));
          if (i.tipo === 'asignado') extra = (i.nivel === 'auto' ? chipNeutro('Vuelve el calculado') : chipNivel(i.nivel)) + chipNeutro(i.autor);
          return '<div style="display: flex !important; gap: 12px !important; padding: 10px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +
            '<span style="width: 32px !important; height: 32px !important; border-radius: 8px !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; flex: 0 0 auto !important;">' + icono(ACTIVIDADES[i.tipo].icono, 18) + '</span>' +
            '<div style="flex: 1 1 auto !important; min-width: 0 !important;">' +
            '<div style="display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 6px 8px !important;"><span style="font-weight: 500 !important;">' + ACTIVIDADES[i.tipo].texto + '</span>' + extra + '</div>' +
            '<div>' + escapar(i.texto) + '</div></div>' +
            '<div style="flex: 0 0 auto !important; font-size: 12px !important; color: #47536b !important; font-variant-numeric: tabular-nums !important;">' + fechaCorta(i.fecha) + '</div></div>';
        }).join('');
        return filtros + (lista || '<div style="color: #47536b !important;">Sin actividades de este tipo.</div>');
      }

      // ---------------------------------------------------------
      // HISTORIAL DE CAMBIOS DE ESTADO (CALCULADO Y ASIGNADO)
      // ---------------------------------------------------------
      function historialEstados() {
        var cambios = [];
        var anterior = null;
        est.calculados.forEach(function(c) {
          var nivel = nivelDeValor(c.valor);
          if (nivel !== anterior) cambios.push({ fecha: c.fecha, origen: 'Calculado', desde: anterior, hasta: nivel, quien: 'Sistema', motivo: c.motivo });
          anterior = nivel;
        });
        var previoAsig = null;
        asignaciones.forEach(function(a) {
          cambios.push({ fecha: a.fecha, origen: 'Asignado', desde: previoAsig, hasta: a.nivel === 'auto' ? null : a.nivel, quien: a.autor, motivo: a.motivo, quitado: a.nivel === 'auto' });
          previoAsig = a.nivel === 'auto' ? null : a.nivel;
        });
        cambios.sort(function(a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
        if (!cambios.length) return '<div style="color: #47536b !important;">Sin cambios de estado.</div>';
        var th = 'border: 0 !important; height: 44px !important; text-align: left !important; padding: 0 8px !important; font-size: 13px !important; font-weight: 500 !important; color: #47536b !important; background-color: #f5f6fa !important;';
        var td = 'border: 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important; padding: 8px !important; vertical-align: top !important;';
        return '<div style="overflow-x: auto !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important;"><table style="width: 100% !important; border-collapse: collapse !important; min-width: 560px !important; margin: 0 !important; font-size: 13px !important;">' +
          '<thead><tr><th style="' + th + ' padding-left: 12px !important;">Fecha</th><th style="' + th + '">Origen</th><th style="' + th + '">Cambio</th><th style="' + th + '">Quién y por qué</th></tr></thead><tbody>' +
          cambios.map(function(c) {
            var cambio = c.quitado ? '<span style="font-weight: 500 !important;">Quitado</span>' :
              (c.desde ? '<span style="opacity: 0.6 !important;">' + chipNivel(c.desde) + '</span>' : '') +
              (c.desde ? '<span style="color: #47536b !important; display: inline-flex !important; vertical-align: middle !important; margin: 0 2px !important;">' + icono('flecha', 16) + '</span>' : '') + chipNivel(c.hasta);
            return '<tr><td style="' + td + ' padding-left: 12px !important; white-space: nowrap !important; font-variant-numeric: tabular-nums !important;">' + fechaCorta(c.fecha) + '</td>' +
              '<td style="' + td + '">' + chipNeutro(c.origen) + '</td>' +
              '<td style="' + td + ' white-space: nowrap !important;"><span style="display: inline-flex !important; align-items: center !important; gap: 4px !important;">' + cambio + '</span></td>' +
              '<td style="' + td + '"><div style="font-weight: 500 !important;">' + escapar(c.quien) + '</div><div style="color: #47536b !important;">' + escapar(c.motivo) + '</div></td></tr>';
          }).join('') + '</tbody></table></div>';
      }

      // ---------------------------------------------------------
      // ASIGNAR ESTADO (REQ 10)
      // ---------------------------------------------------------
      function formularioAsignacion(e) {
        if (!ROLES[rolActual].puedeAsignar) {
          return '<div style="display: flex !important; gap: 8px !important; align-items: center !important; padding: 8px 12px !important; border-radius: 8px !important; background-color: #e5f2ff !important; border: 1px solid rgba(77, 166, 255, 0.4) !important;"><span style="color: #026bd4 !important;">' + icono('info', 18) + '</span>Solo tutores y administradores pueden asignar estados.</div>';
        }
        var campo = 'padding: 8px 12px !important; border-radius: 8px !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; background-color: #fcfcfc !important; color: #0b0e14 !important; font-family: inherit !important; font-size: 14px !important; box-sizing: border-box !important; width: 100% !important; margin: 0 !important;';
        return '<div style="display: flex !important; flex-direction: column !important; gap: 8px !important;">' +
          '<select id="campo-nivel-asignado" aria-label="Estado a asignar" style="height: 40px !important; ' + campo + '">' +
          '<option value="">Elegí el estado…</option><option value="rojo">Riesgo alto</option><option value="amarillo">Riesgo medio</option><option value="verde">Sin riesgo</option>' +
          (e.asignado ? '<option value="auto">Quitar el estado asignado (vuelve a mandar el calculado)</option>' : '') + '</select>' +
          '<textarea id="campo-motivo-asignado" rows="2" aria-label="Motivo" placeholder="Motivo (obligatorio): por ejemplo, resultado de la entrevista" style="resize: vertical !important; ' + campo + '"></textarea>' +
          '<div id="txt-error-asignacion" style="display: none; color: #910808 !important; font-size: 13px !important;"></div>' +
          '<div id="btn-guardar-asignacion" role="button" tabindex="0" style="align-self: flex-end !important; height: 40px !important; padding: 0 16px !important; border-radius: 8px !important; border: 1px solid #333c4d !important; background-image: linear-gradient(to bottom, #333c4d, #0b0e14) !important; color: #ffffff !important; font-size: 14px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; gap: 8px !important; cursor: pointer !important; box-sizing: border-box !important;">' +
          icono('guardar', 18) + '<span>Guardar</span></div></div>';
      }

      function guardarAsignacion() {
        var nivel = document.getElementById('campo-nivel-asignado').value;
        var motivo = document.getElementById('campo-motivo-asignado').value.trim();
        var error = document.getElementById('txt-error-asignacion');
        if (!nivel || !motivo) {
          error.textContent = 'Elegí un estado y escribí el motivo.';
          error.style.setProperty('display', 'block', 'important');
          return;
        }
        var btn = document.getElementById('btn-guardar-asignacion');
        btn.lastChild.textContent = 'Guardando…';
        guardarAsignacionMoodle(usuario, nivel, motivo).then(function(res) {
          var autor = window.M && M.cfg && M.cfg.fullname ? M.cfg.fullname : (res.local ? 'Vista previa local' : 'Usuario actual');
          asignaciones.push({ usuario: usuario, nivel: nivel, motivo: motivo, autor: autor, fecha: hoyIso() });
          renderizar();
        }).catch(function(err) {
          btn.lastChild.textContent = 'Guardar';
          error.textContent = 'No se pudo guardar: ' + err.message;
          error.style.setProperty('display', 'block', 'important');
        });
      }

      // ---------------------------------------------------------
      // RENDERIZADO
      // ---------------------------------------------------------
      function renderizar() {
        var cont = document.getElementById('contenido-detalle');
        if (!est) {
          cont.innerHTML = '<div style="padding: 32px !important; text-align: center !important; color: #47536b !important; background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important;">No se encontró el estudiante. Abrí esta pantalla desde el Tablero de Criticidad.</div>';
          return;
        }
        var e = estados();
        var resumen = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 12px !important; margin-bottom: 16px !important;">' +
          [['Criticidad actual', e.ultimoCalc && e.ultimoCalc.valor !== null ? e.ultimoCalc.valor + '<span style="font-size: 14px !important; color: #47536b !important; font-weight: 400 !important; margin-left: 4px !important;">/ 100</span>' : '—', e.ultimoCalc ? 'calculada el ' + fechaCorta(e.ultimoCalc.fecha) : 'sin datos'],
           ['Estado calculado', chipNivel(e.calculado), 'lo genera el sistema'],
           ['Estado asignado', e.asignado ? chipNivel(e.asignado.nivel) : '<span style="color: #94a0b8 !important;">—</span>', e.asignado ? 'por ' + escapar(e.asignado.autor) : 'manda el calculado']].map(function(k) {
            return '<div style="flex: 1 1 160px !important; background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; padding: 12px 14px !important; box-sizing: border-box !important; display: flex !important; flex-direction: column !important; gap: 4px !important;">' +
              '<div style="font-size: 14px !important; font-weight: 500 !important;">' + k[0] + '</div>' +
              '<div style="font-size: 24px !important; font-weight: 600 !important; line-height: 1.2 !important; min-height: 29px !important; display: flex !important; align-items: center !important;">' + k[1] + '</div>' +
              '<div style="font-size: 12px !important; color: #47536b !important;">' + k[2] + '</div></div>';
          }).join('') + '</div>';
        cont.innerHTML =
          '<div style="display: flex !important; flex-wrap: wrap !important; gap: 16px !important; align-items: flex-start !important;">' +
          '<div style="flex: 1 1 240px !important; max-width: 300px !important; min-width: 0 !important;">' + columnaPerfil(est) + '</div>' +
          '<div style="flex: 999 1 420px !important; min-width: 0 !important; display: flex !important; flex-direction: column !important; gap: 16px !important;">' +
          '<div>' + resumen + tarjeta('Evolución de la criticidad <span style="font-weight: 400 !important; color: #47536b !important;">(0 sin riesgo · 100 máximo riesgo)</span>', '<div id="contenedor-grafico"></div>') + '</div>' +
          tarjeta('Historial de criticidad <span style="font-weight: 400 !important; color: #47536b !important;">(todas las actividades)</span>', registroActividades()) +
          tarjeta('Historial de cambios de estado', historialEstados()) +
          tarjeta('Asignar estado (Req 10)', formularioAsignacion(e)) +
          '</div></div>';
        dibujarGrafico();
        var foto = document.getElementById('foto-perfil');
        if (foto) foto.onerror = function() { foto.parentNode.innerHTML = '<span aria-hidden="true">' + escapar(iniciales(est.nombre)) + '</span>'; };
      }

      // DIBUJAR EL GRÁFICO AL ANCHO DE SU CONTENEDOR (TAMBIÉN AL CAMBIAR EL TAMAÑO DE LA VENTANA)
      var anchoGrafico = 0;
      function dibujarGrafico() {
        var c = document.getElementById('contenedor-grafico');
        if (!c || !est) return;
        anchoGrafico = c.clientWidth;
        c.innerHTML = graficoCriticidad(anchoGrafico);
      }

      window.addEventListener('resize', function() {
        var c = document.getElementById('contenedor-grafico');
        if (c && Math.abs(c.clientWidth - anchoGrafico) > 8) dibujarGrafico();
      });

      // ---------------------------------------------------------
      // ROL Y VISTA PREVIA LOCAL
      // ---------------------------------------------------------
      function aplicarRol(rol) {
        rolActual = rol;
        var botones = document.querySelectorAll('[data-preview-rol]');
        for (var i = 0; i < botones.length; i++) {
          var activo = botones[i].getAttribute('data-preview-rol') === rol;
          botones[i].style.backgroundColor = activo ? '#ffffff' : 'transparent';
          botones[i].style.color = activo ? '#0b0e14' : '#c2c9d6';
        }
        renderizar();
      }

      function crearBarraPreview() {
        var barra = document.createElement('div');
        barra.id = 'barra-preview-detalle';
        barra.setAttribute('style', 'display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 8px !important; padding: 8px 12px !important; margin: 0 0 20px 0 !important; background-color: #0b0e14 !important; color: #ffffff !important; border-radius: 8px !important; font-size: 13px !important;');
        barra.innerHTML = '<span style="display: inline-flex !important; align-items: center !important; gap: 8px !important; font-weight: 500 !important; margin-right: 4px !important;">' +
          icono('ver', 18) + 'Vista previa local · ver como</span>' +
          Object.keys(ROLES).map(function(rol) {
            return '<button data-preview-rol="' + rol + '" style="cursor: pointer; border: 1px solid #333c4d; border-radius: 6px; padding: 3px 10px; font-family: inherit; font-weight: 600; font-size: 12px;">' + rol + '</button>';
          }).join('') +
          '<select id="selector-estudiante-prueba" aria-label="Estudiante de prueba" style="margin-left: auto; height: 28px; border-radius: 6px; border: 1px solid #333c4d; background: #0b0e14; color: #ffffff; font-family: inherit; font-size: 12px;">' +
          Object.keys(ESTUDIANTES_PRUEBA).map(function(k) { return '<option value="' + k + '">' + escapar(ESTUDIANTES_PRUEBA[k].nombre) + '</option>'; }).join('') + '</select>';
        var aviso = document.getElementById('aviso-datos-detalle');
        aviso.parentNode.insertBefore(barra, aviso.nextSibling);
      }

      // ---------------------------------------------------------
      // CARGA SEGÚN #usuario
      // ---------------------------------------------------------
      function usuarioDeUrl() {
        var m = window.location.hash.match(/usuario=(\d+)/) || window.location.search.match(/[?&]usuario=(\d+)/);
        return m ? m[1] : null;
      }

      function cargar() {
        usuario = usuarioDeUrl() || (ES_VISTA_LOCAL ? '3773' : null);
        filtroActividad = '';
        // Datos académicos y de seguimiento: de prueba hasta que existan las bases de Zhakyz
        est = ESTUDIANTES_PRUEBA[usuario] || null;
        asignaciones = ASIGNACIONES_PRUEBA.filter(function(a) { return a.usuario === usuario; });
        var selector = document.getElementById('selector-estudiante-prueba');
        if (selector && usuario) selector.value = usuario;
        document.getElementById('aviso-datos-detalle').style.setProperty('display', ES_VISTA_LOCAL || !CMID_ESTUDIANTES ? 'flex' : 'none', 'important');
        perfil = null;
        renderizar();
        // En el campus: foto y datos reales del perfil del curso
        if (!ES_VISTA_LOCAL && window.M && usuario) {
          leerPerfilMoodle(usuario).then(function(p) {
            perfil = p;
            renderizar();
          }).catch(function() { /* sin perfil: quedan los datos de la base */ });
        }
      }

      function volverAlTablero() {
        if (ES_VISTA_LOCAL) window.location.href = URL_TABLERO_LOCAL;
        else if (CMID_TABLERO) window.location.href = M.cfg.wwwroot + '/mod/page/view.php?id=' + CMID_TABLERO;
        else window.history.back();
      }

      // ---------------------------------------------------------
      // DELEGACIÓN DE EVENTOS
      // ---------------------------------------------------------
      document.addEventListener('click', function(e) {
        var t = e.target;
        if (!t.closest || !t.closest('#detalle-estudiante')) return;
        var btnRol = t.closest('[data-preview-rol]');
        if (btnRol) return aplicarRol(btnRol.getAttribute('data-preview-rol'));
        if (t.closest('#btn-volver-tablero')) return volverAlTablero();
        if (t.closest('#btn-guardar-asignacion')) return guardarAsignacion();
        var filtro = t.closest('[data-filtro-actividad]');
        if (filtro) {
          filtroActividad = filtro.getAttribute('data-filtro-actividad');
          renderizar();
          var nuevo = document.querySelector('[data-filtro-actividad="' + filtroActividad + '"]');
          if (nuevo) nuevo.focus();
        }
      });

      document.addEventListener('change', function(e) {
        if (e.target.id === 'selector-estudiante-prueba') window.location.hash = 'usuario=' + e.target.value;
      });

      document.addEventListener('keydown', function(e) {
        var t = e.target;
        if ((e.key === 'Enter' || e.key === ' ') && t.closest && t.closest('#detalle-estudiante') && t.getAttribute('role') === 'button') {
          e.preventDefault();
          t.click();
        }
      });

      window.addEventListener('hashchange', cargar);

      // ---------------------------------------------------------
      // INICIO
      // ---------------------------------------------------------
      var huecos = document.querySelectorAll('#detalle-estudiante [data-icono]');
      for (var h = 0; h < huecos.length; h++) huecos[h].innerHTML = icono(huecos[h].getAttribute('data-icono'), 20);
      if (ES_VISTA_LOCAL) crearBarraPreview();
      cargar();
      aplicarRol(ROL_INICIAL);
    })();
  </script>
  </nolink>
</div>
