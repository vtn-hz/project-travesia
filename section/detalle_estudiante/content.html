      }

        try { var v = window.localStorage.getItem(clave); return v ? JSON.parse(v) : defecto; } catch (e) { return defecto; }
      }

      // ESTADOS ASIGNADOS EN LA VISTA PREVIA: SOLO UNA LISTA DE ENTRADAS CON id_usuario (UN VALOR CORRUPTO NO ROMPE LA PANTALLA)
      function asignadosPreview() {
        var v = leerAlmacen(CLAVE_PREVIEW, []);
        return Array.isArray(v) ? v.filter(function(c) { return c && typeof c === 'object' && c.id_usuario; }) : [];
      }

      // OMISIONES QUE AGREGÓ LA VISTA PREVIA DE LA PÁGINA CONFIGURACIÓN DEL SISTEMA
      function cierrePreview() {
        var v = leerAlmacen(CLAVE_PREVIEW_CIERRE, []);
        return Array.isArray(v) ? v.filter(function(c) { return c && typeof c === 'object' && c.id_usuario; }) : [];
      }

      // ---------------------------------------------------------
      // PERÍODO VIGENTE
      // ---------------------------------------------------------
      // 2026-2 → 2026-1; 2027-1 → 2026-2
      function periodoAnterior(p) {
        var x = String(p).split('-');
        return x[1] === '2' ? x[0] + '-1' : (Number(x[0]) - 1) + '-2';
      }

      // VISTA PREVIA: LA MISMA REGLA QUE PeriodoVigente (LA ENTRADA DE rid MAYOR)
      function periodoDePrueba() {
        var agregados = leerAlmacen(CLAVE_PREVIEW_PERIODOS, []);
        var lista = PERIODOS_PRUEBA.concat(Array.isArray(agregados) ? agregados : []).filter(function(p) { return p && /^\d{4}-[12]$/.test(String(p.periodo)); })
          .sort(function(a, b) { return (Number(a.rid) || 0) - (Number(b.rid) || 0); });
        return lista[lista.length - 1] || null;
      }

      function fijarPeriodo(p) {
        PERIODO_ACTUAL = p && p.periodo ? String(p.periodo) : PERIODO_POR_DEFECTO;
        PERIODO_ANTERIOR = periodoAnterior(PERIODO_ACTUAL);
      }

      // EN MOODLE: EL PERÍODO VIGENTE DE LA BASE PERÍODOS (leerPeriodoVigente, del bloque COPIA DE TOOLS)
      function leerPeriodo() {
        return leerPeriodoVigente().then(fijarPeriodo);
      }

      function escribirAlmacen(clave, valor) {
        try { window.localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento: queda en memoria */ }
      }

      // ---------------------------------------------------------
      // CRITICIDAD DE UN ESTUDIANTE (MISMA REGLA QUE section/tablero_estudiantes)
      // ---------------------------------------------------------
      function numero(v) {
        if (v === null || v === undefined || String(v).trim() === '') return null;
        var n = Number(String(v).replace(',', '.'));
        return isFinite(n) ? n : null;
      }

      function nivelDeIndice(indice) {
        if (indice === null) return 'sin_datos';
        return indice >= CORTES.rojo ? 'rojo' : indice >= CORTES.amarillo ? 'amarillo' : 'verde';
      }

      function tiempoDe(c) {
        var t = Date.parse(c.created_at);
        if (isFinite(t)) return t;
        var a = Number(c.alta);
        return isFinite(a) ? a * 1000 : 0;
      }

      function masReciente(lista) {
        return lista.slice().sort(function(a, b) { return tiempoDe(a) - tiempoDe(b) || (Number(a.rid) || 0) - (Number(b.rid) || 0); }).pop() || null;
      }

      function tipoDeEntrada(c, encuestas) {
        if (c.fuente === 'notas_1ro' || c.fuente === 'materias') return 'notas';
        if (c.fuente === 'omision') return 'omision';
        if (c.fuente === 'respuestas') return encuestas[String(c.rid_fuente)] || 'encuesta';
        return null;
      }

      // FUENTES (ADR-010): parciales y Encuesta Cuatrimestral por separado. El calculado es la del año de la carrera y solo esa,
      // sin entradas en el período, toma la del anterior (ADR-009)
      var FUENTES = {
        parciales: { titulo: 'Parciales', tipos: ['notas'], sinDatos: 'Sin notas de parciales en ' },
        cuatrimestral: { titulo: 'Encuesta', tipos: ['cuatrimestral', 'omision'], sinDatos: 'Sin encuesta en ' }
      };

      function fuenteDe(clave, entradas, encuestas, conAnterior) {
        var delPeriodo = function(periodo) {
          return entradas.filter(function(c) {
            if (c.origen !== 'automatica' || String(c.periodo) !== periodo || numero(c.indice) === null) return false;
            return FUENTES[clave].tipos.indexOf(tipoDeEntrada(c, encuestas)) !== -1;
          });
        };
        var ultima = masReciente(delPeriodo(PERIODO_ACTUAL)) || (conAnterior ? masReciente(delPeriodo(PERIODO_ANTERIOR)) : null);
        if (!ultima) {
          return { nivel: 'sin_datos', indice: null, tipo: null, fecha: null, entrada: null, periodo: PERIODO_ACTUAL, anterior: false,
            motivo: FUENTES[clave].sinDatos + PERIODO_ACTUAL + '.' };
        }
        var indice = numero(ultima.indice);
        var tipo = tipoDeEntrada(ultima, encuestas);
        var anterior = String(ultima.periodo) !== PERIODO_ACTUAL;
        return { nivel: nivelDeIndice(indice), indice: indice, tipo: tipo, fecha: ultima.created_at, entrada: ultima,
          periodo: String(ultima.periodo), anterior: anterior,
          motivo: TIPOS[tipo] + (anterior ? ' (período ' + ultima.periodo + ')' : '') + ' del ' + fechaVisible(ultima.created_at) + ': índice ' + indice + (ultima.motivo ? ' (' + ultima.motivo + ')' : '') };
      }

      function criticidadDe(tramo, entradas, encuestas) {
        var principal = tramo === 'primero' ? 'parciales' : 'cuatrimestral';
        var fuentes = {
          parciales: fuenteDe('parciales', entradas, encuestas, principal === 'parciales'),
          cuatrimestral: fuenteDe('cuatrimestral', entradas, encuestas, principal === 'cuatrimestral')
        };
        var calculado = fuentes[principal];
        var ultimaManual = masReciente(entradas.filter(function(c) { return c.origen === 'manual'; }));
        var asignado = ultimaManual && ASIGNABLES.indexOf(ultimaManual.semaforo) !== -1 ? ultimaManual : null;
        return { calculado: calculado, fuentes: fuentes, principal: principal, asignado: asignado, vigente: asignado ? asignado.semaforo : calculado.nivel };
      }

      // ---------------------------------------------------------
      // ACCESO A DATOS EN MOODLE
      // ---------------------------------------------------------
      // ---------------------------------------------------------
      // COPIA DE TOOLS: INICIO (bloque idéntico en section/tablero_estudiantes y section/detalle_estudiante)
      // ---------------------------------------------------------
      // LeerBase y la regla de PeriodoVigente de section/utils/tools, copiadas para no esperar la carga de la Página Tools (0,4 a 2,4 s)
      // antes de leer las bases. Si cambian en Tools, actualizar este bloque en las DOS secciones y correr
      // `node .skills/publicar-seccion/verificar_copias_tools.js` (ver RULES.md, "Código copiado de Tools"). Necesita DATAID_PERIODOS.
      var LEER_BASE_MAXIMO = 20000;
      // El período vigente se guarda 12 horas (localStorage; no es un dato personal) y lo comparten el Tablero y el Detalle
      var CLAVE_PERIODO_GUARDADO = 'zk-periodo-vigente';
      var VIGENCIA_PERIODO = 12 * 60 * 60 * 1000;

      // TEXTO DE UNA CELDA, CON LOS SALTOS DE LÍNEA DE LOS <br> Y DE LOS PÁRRAFOS
      function textoCelda(el) {
        var c = el.cloneNode(true);
        c.querySelectorAll('br').forEach(function(br) { br.replaceWith('\n'); });
        c.querySelectorAll('p, div').forEach(function(x) { x.append('\n'); });
        return c.textContent.replace(/ +\n/g, '\n').trim();
      }

      // rid DE UNA ENTRADA: data-rid, o el de un enlace de la entrada (Mostrar más, Editar o Borrar)
      function ridDe(el) {
        if (el.getAttribute('data-rid')) return el.getAttribute('data-rid');
        var a = el.querySelector('a[href*="rid="], a[href*="delete="]');
        var m = a ? (a.getAttribute('href') || '').match(/[?&](?:rid|delete)=(\d+)/) : null;
        return m ? m[1] : null;
      }

      // ENTRADAS DE UNA PÁGINA DEL LISTADO: { formato, entradas: [{ rid, campos, alta }] }
      function entradasDePagina(doc, o) {
        var zona = doc.querySelector('#region-main') || doc.querySelector('[role="main"]') || doc.body;
        var lista = function(nodos, leer) { return Array.prototype.map.call(nodos, leer); };
        if (o.filas) {
          return { formato: 'columnas', entradas: lista(zona.querySelectorAll(o.filas), function(f) {
            var campos = {};
            var celdas = f.querySelectorAll(':scope > td');
            o.columnas.forEach(function(nombre, i) { if (nombre && celdas[i]) campos[nombre] = textoCelda(celdas[i]); });
            return { rid: ridDe(f), campos: campos };
          }) };
        }
        var propias = zona.querySelectorAll('.zk-registro');
        if (propias.length) {
          return { formato: 'propio', entradas: lista(propias, function(f) {
            var campos = {};
            f.querySelectorAll('[data-campo]').forEach(function(c) { campos[c.getAttribute('data-campo')] = textoCelda(c); });
            var e = { rid: ridDe(f), campos: campos };
            if (f.hasAttribute('data-alta')) e.alta = Number(f.getAttribute('data-alta')) || f.getAttribute('data-alta');
            return e;
          }) };
        }
        var defecto = zona.querySelectorAll('.defaulttemplate-listentry');
        return { formato: defecto.length ? 'defecto' : null, entradas: lista(defecto, function(e) {
          var campos = {};
          e.querySelectorAll('.defaulttemplate-list-body .row').forEach(function(fila) {
            if (fila.children.length >= 2) campos[fila.children[0].textContent.trim()] = textoCelda(fila.children[1]);
          });
          return { rid: ridDe(e), campos: campos };
        }) };
      }

      // ÚLTIMA PÁGINA ENLAZADA EN LA BARRA DE PÁGINAS (null SI NO HAY BARRA)
      function ultimaEnlazada(doc) {
        var nums = [];
        doc.querySelectorAll('.pagination a[href], .paging a[href]').forEach(function(a) {
          var m = (a.getAttribute('href') || '').match(/[?&]page=(\d+)/);
          if (m) nums.push(Number(m[1]));
        });
        return nums.length ? Math.max.apply(null, nums) : null;
      }

      // ERROR DE LA PÁGINA: SESIÓN VENCIDA O SIN PERMISO PARA VER LA BASE (null SI LA PÁGINA ES EL LISTADO)
      function errorDePagina(r, doc) {
        if (/\/login\/index\.php/.test(r.url || '') || doc.querySelector('form#login')) return 'La sesión de Moodle venció: hay que volver a entrar.';
        var e = doc.querySelector('.errorbox .errormessage, .errormessage');
        return e ? 'Moodle no muestra la base: ' + e.textContent.trim() : null;
      }

      // { dataid, porPagina, filas, columnas, filtro } → Promise de { entradas: [{ rid, campos, alta }], completa }.
      // Como LeerBase con paralelo = 1: página por página, sin repetir entradas ni pasar de la última página de la barra
      function leerBaseMoodle(o) {
        if (!o.dataid) return Promise.reject(new Error('Falta el dataid de la base.'));
        var porPagina = Math.max(1, Math.floor(o.porPagina || 500));
        var tope = Math.ceil(LEER_BASE_MAXIMO / porPagina) + 1;
        var resultado = { entradas: [], completa: true };
        var vistos = {}, leidas = 0;
        function pedir(n) {
          var url = M.cfg.wwwroot + '/mod/data/view.php?d=' + o.dataid + '&perpage=' + porPagina + '&page=' + n;
          return fetch(url, { credentials: 'same-origin' }).then(function(r) {
            if (!r.ok) throw new Error('Moodle respondió HTTP ' + r.status + ' en la página ' + (n + 1) + ' de la base.');
            return r.text().then(function(html) {
              var doc = new DOMParser().parseFromString(html, 'text/html');
              var error = errorDePagina(r, doc);
              if (error) throw new Error(error);
              var p = entradasDePagina(doc, o);
              p.ultima = ultimaEnlazada(doc);
              return p;
            });
          });
        }
        function desde(n) {
          return pedir(n).then(function(p) {
            p.entradas.forEach(function(e) {
              if (e.rid && vistos[e.rid]) return;
              if (e.rid) vistos[e.rid] = true;
              leidas++;
              if (leidas <= LEER_BASE_MAXIMO && (!o.filtro || o.filtro(e))) resultado.entradas.push(e);
            });
            var hayMas = p.entradas.length === porPagina && (p.ultima === null || p.ultima > n);
            if (!hayMas) return resultado;
            if (leidas >= LEER_BASE_MAXIMO || n + 1 >= tope) { resultado.completa = false; return resultado; }
            return desde(n + 1);
          });
        }
        return desde(0);
      }

      // PERÍODO GUARDADO (null SI NO HAY O TIENE MÁS DE 12 HORAS)
      function periodoGuardado() {
        try {
          var g = JSON.parse(window.localStorage.getItem(CLAVE_PERIODO_GUARDADO) || 'null');
          return g && /^\d{4}-[12]$/.test(String(g.periodo)) && Date.now() - (Number(g.guardado_en) || 0) < VIGENCIA_PERIODO ? g : null;
        } catch (e) { return null; }
      }

      // PERÍODO VIGENTE DE LA BASE PERÍODOS: la entrada válida de rid mayor (regla de PeriodoVigente). Lo guarda al leerlo.
      // Si la lectura falla, devuelve el último guardado aunque tenga más de 12 horas, o null (el período por defecto)
      function leerPeriodoVigente() {
        return leerBaseMoodle({ dataid: DATAID_PERIODOS, porPagina: 500 }).then(function(r) {
          var validos = r.entradas.filter(function(e) { return /^\d{4}-[12]$/.test(String(e.campos.periodo || '').trim()); })
            .sort(function(a, b) { return (Number(a.rid) || 0) - (Number(b.rid) || 0); });
          if (!validos.length) throw new Error('La base Períodos no tiene ningún período con el formato AAAA-n.');
          var p = { periodo: String(validos[validos.length - 1].campos.periodo).trim(), guardado_en: Date.now() };
          try { window.localStorage.setItem(CLAVE_PERIODO_GUARDADO, JSON.stringify(p)); } catch (e) { /* sin almacenamiento */ }
          return p;
        }).catch(function() {
          try { return JSON.parse(window.localStorage.getItem(CLAVE_PERIODO_GUARDADO) || 'null'); } catch (e) { return null; }
        });
      }
      // ---------------------------------------------------------
      // COPIA DE TOOLS: FIN
      // ---------------------------------------------------------

      // ESPERA UNA PROMESA COMO MUCHO "ms": UNA BASE QUE NO RESPONDE NO DEJA LA PÁGINA CARGANDO PARA SIEMPRE
      function conLimite(promesa, ms, que) {
        return Promise.race([promesa, new Promise(function(r, rechazar) {
          setTimeout(function() { rechazar(new Error(que + ' tardó más de ' + (ms / 1000) + ' segundos.')); }, ms);
        })]);
      }

      // ENTRADAS DE UNA BASE (opciones de LeerBase) CON SUS CAMPOS COMO TEXTO, EL rid Y LA FECHA DE ALTA.
      // Si LeerBase llegó a su tope, la lista queda marcada como incompleta
      function leerBase(nombre, opciones, espera) {
        return conLimite(leerBaseMoodle(opciones), espera || ESPERA_BASE, 'La base ' + nombre).then(function(r) {
          var lista = r.entradas.map(function(e) {
            var c = {};
            Object.keys(e.campos).forEach(function(k) { c[k] = String(e.campos[k]).trim(); });
            c.rid = e.rid ? Number(e.rid) : null;
            c.alta = e.alta || '';
            return c;
          });
          if (r.completa === false) incompletas.push(nombre);
          return lista;
        });
      }

      // FOTO DE PERFIL: Moodle la sirve según los permisos de quien mira
      function urlFoto(id) {
        return M.cfg.wwwroot + '/user/pix.php/' + encodeURIComponent(id) + '/f1.jpg';
      }

      // DATOS DEL PERFIL DEL CURSO: LISTA dt/dd (ROLES, GRUPO, ÚLTIMO ACCESO…)
      function leerPerfilMoodle(id) {
        var url = M.cfg.wwwroot + '/user/view.php?id=' + encodeURIComponent(id) + '&course=' + CURSO;
        return fetch(url, { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var campos = [];
            doc.querySelectorAll('li.contentnode').forEach(function(li) {
              var dt = li.querySelector('dt');
              var dd = li.querySelector('dd');
              // Se omiten el código QR de la app de Moodle, la zona horaria y la lista de cursos: no sirven al seguimiento.
              // Moodle agrega al correo "(Oculto a todo el mundo excepto…)": se quita (con [(] y no con barra y paréntesis, que activa el filtro TeX)
              if (dt && dd && !/c[oó]digo qr|zona horaria|perfiles de curso/i.test(dt.textContent)) {
                campos.push({ etiqueta: dt.textContent.trim(), valor: dd.textContent.replace(/\s+/g, ' ').replace(/\s*[(]Oculto a todo el mundo[^)]*[)]/gi, '').trim() });
              }
            });
            return { campos: campos };
          });
      }

      // AGREGAR UNA ENTRADA (rid=0). Los campos se ubican por su etiqueta en el formulario de alta, como en la Página Tools
      function agregarEntradaMoodle(dataid, campos, registro) {
        return fetch(M.cfg.wwwroot + '/mod/data/edit.php?d=' + dataid, { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var form = Array.prototype.filter.call(doc.querySelectorAll('form'), function(f) { return f.querySelector('[name^="field_"]'); })[0];
            if (!form) throw new Error('No se encontró el formulario de alta de la base (d=' + dataid + ').');
            var porCampo = {};
            form.querySelectorAll('label[for]').forEach(function(l) {
              var ctrl = form.querySelector('#' + CSS.escape(l.getAttribute('for')));
              if (ctrl && /^field_/.test(ctrl.name)) porCampo[l.textContent.replace(/\s+/g, ' ').trim().toLowerCase()] = ctrl.name;
            });
            var fd = new FormData(form);
            fd.set('d', String(dataid));
            fd.set('rid', '0');
            campos.forEach(function(k) {
              if (!porCampo[k]) throw new Error('Falta el campo "' + k + '" en la base (d=' + dataid + ').');
              var v = registro[k];
              fd.set(porCampo[k], v === null || v === undefined ? '' : String(v));
            });
            fd.delete('saveandadd');
            fd.set('saveandview', 'Guardar');
            return fetch(M.cfg.wwwroot + '/mod/data/edit.php', { method: 'POST', body: fd, credentials: 'same-origin' });
          })
          .then(function(r) {
            if (!r.ok) throw new Error('Moodle respondió ' + r.status + '.');
            var m = (r.url || '').match(/[?&]rid=(\d+)/);
            if (m) return Number(m[1]);
            // Sin redirección a la entrada nueva: Moodle volvió a mostrar el formulario con sus errores (igual que en la Página Tools)
            return r.text().then(function(html) {
              var doc = new DOMParser().parseFromString(html, 'text/html');
              var errores = Array.prototype.map.call(doc.querySelectorAll('#region-main .alert-danger, #region-main .error'), function(e) { return e.textContent.trim(); }).filter(Boolean);
              throw new Error(errores.length ? errores.join(' ') : 'Moodle no confirmó la entrada nueva.');
            });
          });
      }

      // ---------------------------------------------------------
      // CARGA DE DATOS (BASES PROPIAS O DATOS DE PRUEBA)
      // ---------------------------------------------------------
      var usaPrueba = ES_VISTA_LOCAL || !window.M || !DATAID_ESTUDIANTES || !DATAID_CRITICIDAD || !DATAID_RESPUESTAS;

      // SOLO LAS ENTRADAS DE UN ESTUDIANTE: la búsqueda de la base filtra en el servidor (con filter=1; sin eso Moodle la ignora y no
      // queda guardada en la sesión). Busca el texto en cualquier campo, así que puede traer de más: armarEstudiante vuelve a filtrar por
      // id o DNI exacto. leerBaseMoodle arma la dirección con "d=" + dataid, así que el filtro viaja en ese valor.
      // Medido en el campus el 2026-11-17: Criticidad bajó de 577 entradas en 7 a 14 s a 7 entradas en 0,8 s
      function soloDe(dataid, texto) {
        return String(dataid) + '&filter=1&search=' + encodeURIComponent(texto);
      }

      // DATOS DE UN ESTUDIANTE (idUsuario): en el campus se lee solo lo suyo; en la vista previa, todos los datos de prueba
      function cargarDatos(idUsuario) {
        if (usaPrueba) {
          if (!ES_VISTA_LOCAL) $('txt-aviso-detalle').innerHTML = '<b style="font-weight: 600 !important;">Datos de prueba.</b> Falta configurar alguna de las bases (Estudiantes, Criticidad o Respuestas) en este script.';
          fijarPeriodo(periodoDePrueba());
          return Promise.resolve({
            estudiantes: ESTUDIANTES_PRUEBA,
            criticidad: CRITICIDAD_PRUEBA.concat(historialLargoPrueba(), asignadosPreview(), cierrePreview()),
            respuestas: RESPUESTAS_PRUEBA,
            parciales: PARCIALES_PRUEBA,
            entrevistas: ENTREVISTAS_PRUEBA,
            encuestas: ENCUESTAS_PRUEBA
          });
        }
        var vacio = { estudiantes: [], criticidad: [], respuestas: [], parciales: [], entrevistas: [], encuestas: [] };
        if (!idUsuario) return Promise.resolve(vacio);
        // Con un período guardado (lo deja el Tablero) no se espera a la base Períodos: se lee junto con lo demás
        var guardado = periodoGuardado();
        if (guardado) fijarPeriodo(guardado);
        return (guardado ? Promise.resolve() : leerPeriodo()).then(function() {
          // Primero su información personal: de ahí sale el DNI, que identifica sus notas y sus entrevistas
          return leerBase('Estudiantes', { dataid: soloDe(DATAID_ESTUDIANTES, idUsuario), porPagina: POR_PAGINA });
        }).then(function(estudiantes) {
          var info = estudiantes.filter(function(e) { return String(e.id_usuario) === String(idUsuario); })[0];
          if (!info) return Object.assign({}, vacio, { estudiantes: estudiantes }); // sin información personal no se muestra
          var dni = String(info.dni || '').trim();
          // Las notas y las entrevistas solo completan la cronología: si no se leen (o tardan), el detalle sigue sin ellas
          var opcional = function(p) { return p.catch(function() { return []; }); };
          return Promise.all([
            leerBase('Criticidad', { dataid: soloDe(DATAID_CRITICIDAD, idUsuario), porPagina: POR_PAGINA }),
            leerBase('Respuestas', { dataid: soloDe(DATAID_RESPUESTAS, idUsuario), porPagina: POR_PAGINA }),
            DATAID_PARCIALES && dni ? opcional(leerBase('CargaParcialesPrimero', { dataid: soloDe(DATAID_PARCIALES, dni), filas: FILAS_PARCIALES, columnas: COLUMNAS_PARCIALES, porPagina: POR_PAGINA }, ESPERA_OPCIONAL)) : [],
            DATAID_ENTREVISTAS ? opcional(leerBase('Entrevistas', { dataid: soloDe(DATAID_ENTREVISTAS, dni || idUsuario), porPagina: POR_PAGINA }, ESPERA_OPCIONAL)) : [],
            // Textos de las preguntas para el detalle de cada encuesta (una entrada por versión: se lee entera)
            DATAID_ENCUESTAS ? opcional(leerBase('Encuestas', { dataid: DATAID_ENCUESTAS }, ESPERA_OPCIONAL)) : []
          ]).then(function(r) {
            return { estudiantes: estudiantes, criticidad: r[0], respuestas: r[1], parciales: r[2], entrevistas: r[3], encuestas: r[4] };
          });
        });
      }

      // ---------------------------------------------------------
      // ESTADO EN MEMORIA
      // ---------------------------------------------------------
      var rolActual = ROL_INICIAL;
      var datos = null;
      var incompletas = []; // bases que LeerBase no leyó enteras
      var usuario = null;
      var est = null; // { id, dni, nombre, info (entrada de Estudiantes o null), tramo, cohorte, entradas, crit, encuestas }
      var perfil = null; // datos del campus (Moodle) o null
      var filtroActividad = '';
      var modal = null; // { id, disparador, guardando }
      var modalRespuestas = null; // { disparador }
      var resaltado = null; // referencia del punto del gráfico seleccionado
      var pulsadoEn = null; // dónde empezó el último clic: arrastrar desde la caja hasta el fondo no cierra el modal

      // ARMAR EL ESTUDIANTE DE LA URL CON SUS ENTRADAS
      function armarEstudiante() {
        est = null;
        if (!datos || !usuario) return;
        var encuestas = {};
        datos.respuestas.forEach(function(r) { encuestas[String(r.rid)] = r.codigo_encuesta; });
        var info = masReciente(datos.estudiantes.filter(function(e) { return String(e.id_usuario) === usuario; }).map(function(e) {
          var c = Object.assign({}, e); c.created_at = ''; return c;
        }));
        var entradas = datos.criticidad.filter(function(c) { return String(c.id_usuario) === usuario; });
        // Solo estudiantes cargados en el sistema (con entrada en Estudiantes)
        if (!info) return;
        var tieneNotas = entradas.some(function(c) { return tipoDeEntrada(c, encuestas) === 'notas'; });
        var tramo = info ? (info.es_primer_anio === 'si' ? 'primero' : 'superior') : (tieneNotas ? 'primero' : 'superior');
        var dni = info ? info.dni : entradas[0].dni;
        var nombre = info ? (String(info.nombre || '') + ' ' + String(info.apellido || '')).trim() : '';
        est = {
          id: usuario, dni: dni, nombre: nombre || 'DNI ' + dni, info: info, tramo: tramo,
          cohorte: info && info.anio_ingreso ? info.anio_ingreso + '-' + info.cuatrimestre_ingreso : '',
          entradas: entradas, encuestas: encuestas, crit: criticidadDe(tramo, entradas, encuestas),
          respuestas: datos.respuestas.filter(function(r) { return String(r.id_usuario) === usuario; }),
          parciales: datos.parciales.filter(function(p) { return String(p.DNI) === String(dni); }),
          entrevistas: datos.entrevistas.filter(function(x) { return String(x.dni) === String(dni) || String(x.id_usuario_estudiante) === usuario; })
        };
      }

      // TRAMO EN UN PERÍODO: ANTES DE periodo_paso_superior ERA 1.er AÑO
      function tramoEn(periodo) {
        var paso = est.info && est.info.periodo_paso_superior;
        if (paso) return String(periodo) < paso ? 'primero' : 'superior';
        return est.tramo;
      }

      // ---------------------------------------------------------
      // UTILIDADES DE PRESENTACIÓN
      // ---------------------------------------------------------
      function chipNivel(nivel) {
        var n = NIVELES[nivel];
        return '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important; height: 24px !important; padding: 0 8px !important; border-radius: 999px !important; border: 1px solid ' + n.borde +
          ' !important; background-color: ' + n.fondo + ' !important; color: ' + n.color + ' !important; font-size: 12px !important; font-weight: 600 !important; white-space: nowrap !important; box-sizing: border-box !important;">' +
          '<span style="width: 8px !important; height: 8px !important; border-radius: 50% !important; background-color: ' + n.punto + ' !important;"></span>' + n.texto + '</span>';
      }

      function chipNeutro(texto) {
        return '<span style="font-size: 11px !important; font-weight: 600 !important; color: #47536b !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 1px 8px !important; line-height: 18px !important; white-space: nowrap !important;">' +
          escapar(texto) + '</span>';
      }

      function tarjeta(titulo, contenido, extra) {
        return '<div style="background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; padding: 16px !important; box-sizing: border-box !important; min-width: 0 !important; ' + (extra || '') + '">' +
          '<div style="font-size: 14px !important; font-weight: 600 !important; color: #0b0e14 !important; margin-bottom: 12px !important;">' + titulo + '</div>' + contenido + '</div>';
      }

      function textoTramo() {
        return (est.tramo === 'primero' ? '1.er año' : '2.º año en adelante') + (est.info ? '' : ' · sin información personal');
      }

      function iniciales(nombre) {
        return nombre.split(/\s+/).filter(Boolean).slice(0, 2).map(function(p) { return p.charAt(0).toUpperCase(); }).join('');
      }

      // ---------------------------------------------------------
      // COLUMNA IZQUIERDA: PERFIL (BASE ESTUDIANTES Y CAMPUS)
      // ---------------------------------------------------------
      function columnaPerfil() {
        var conFoto = !usaPrueba && window.M;
        var avatar = '<div style="width: 128px !important; height: 128px !important; border-radius: 50% !important; background-color: #ebeef4 !important; border: 1px solid #dadee7 !important; color: #47536b !important; font-size: 40px !important; font-weight: 600 !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; margin: 0 auto 12px auto !important;">' +
          (conFoto ? '<img id="foto-perfil" src="' + escapar(urlFoto(est.id)) + '" alt="Foto de perfil de ' + escapar(est.nombre) + '" style="width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important;">' : (est.info ? '<span aria-hidden="true">' + escapar(iniciales(est.nombre)) + '</span>' : icono('estudiante', 56))) + '</div>';
        var cabecera = avatar +
          '<div style="text-align: center !important; font-size: 18px !important; font-weight: 600 !important; overflow-wrap: anywhere !important;">' + escapar(est.nombre) + '</div>' +
          '<div style="text-align: center !important; color: #47536b !important; margin-bottom: 8px !important;">' + escapar(textoTramo()) + (est.cohorte ? ' · Cohorte ' + escapar(est.cohorte) : '') + '</div>' +
          '<div style="display: flex !important; justify-content: center !important; margin-bottom: 16px !important;">' + chipNivel(est.crit.vigente) + '</div>';
        var i = est.info;
        var campos = [
          { etiqueta: 'Id de usuario (Moodle)', valor: est.id },
          { etiqueta: 'DNI', valor: est.dni + (usaPrueba ? ' (ficticio)' : '') }
        ];
        if (i) {
          if (i.email) campos.push({ etiqueta: 'Correo', valor: i.email });
          if (i.anio_ingreso) campos.push({ etiqueta: 'Ingreso', valor: textoPeriodo(i.anio_ingreso + '-' + i.cuatrimestre_ingreso) });
          if (i.periodo_paso_superior) campos.push({ etiqueta: 'Pasó a 2.º año', valor: textoPeriodo(i.periodo_paso_superior) });
          // En Moodle la plantilla de Estudiantes trae la última modificación como texto (_modificada, ##timemodified##); en la vista previa, la fecha de alta
          if (fechaVisible(i.alta)) campos.push({ etiqueta: 'Información personal', valor: 'Cargada el ' + fechaVisible(i.alta) });
          else if (i._modificada) campos.push({ etiqueta: 'Información personal', valor: 'Última modificación: ' + i._modificada });
        } else {
          campos.push({ etiqueta: 'Información personal', valor: 'Sin cargar: el nombre, la cohorte y el año de la carrera faltan' });
        }
        // El correo del campus solo si la información personal no tiene uno (sin repetirlo), y con la misma etiqueta
        if (perfil && perfil.campos.length) {
          perfil.campos.forEach(function(c) {
            if (/^direcci[oó]n de correo/i.test(c.etiqueta)) {
              if (!(i && i.email)) campos.push({ etiqueta: 'Correo', valor: c.valor });
            } else campos.push(c);
          });
        }
        var lista = campos.map(function(c) {
          return '<div style="padding: 8px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +
            '<div style="font-size: 12px !important; color: #47536b !important;">' + escapar(c.etiqueta) + '</div>' +
            '<div style="font-weight: 500 !important; overflow-wrap: anywhere !important;">' + escapar(c.valor) + '</div></div>';
        }).join('');
        return tarjeta(i ? 'Perfil del estudiante' : 'Perfil del estudiante (sin información personal)', cabecera + lista);
      }

      // BOTÓN "SOLICITAR ENTREVISTA" ARRIBA A LA DERECHA (EL MISMO DE ENTREVISTAS Y TUTORÍAS), SOLO SI HAY ESTUDIANTE Y EL ROL PIDE ENTREVISTAS
      function renderizarAcciones() {
        var cont = $('acciones-detalle');
        if (!cont) return;
        cont.innerHTML = est && ROLES[rolActual].puedeEntrevistar
          ? '<div id="btn-solicitar-entrevista-detalle" role="button" tabindex="0" style="height: 40px !important; padding: 0 16px !important; border-radius: 8px !important; border: 1px solid #333c4d !important; background-image: linear-gradient(to bottom, #333c4d, #0b0e14) !important; color: #ffffff !important; font-size: 14px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; gap: 8px !important; cursor: pointer !important; box-sizing: border-box !important; white-space: nowrap !important;">' +
            icono('agregar', 20) + 'Solicitar entrevista</div>'
          : '';
      }

      // ABRIR LA SOLICITUD DE ENTREVISTA PARA ESTE ESTUDIANTE (PÁGINA ENTREVISTAS Y TUTORÍAS, CON EL FORMULARIO ABIERTO).
      // El nombre y el DNI van en la dirección (#solicitar&usuario=…&dni=…&nombre=…); solo se completan motivo, fecha y rol
      function solicitarEntrevista() {
        var hash = '#solicitar&usuario=' + encodeURIComponent(est.id) + '&dni=' + encodeURIComponent(est.dni) +
          (est.info ? '&nombre=' + encodeURIComponent(est.nombre) : '');
        if (ES_VISTA_LOCAL) window.location.href = URL_ENTREVISTAS_LOCAL + hash;
        else if (CMID_PAGINA_ENTREVISTAS) window.location.href = M.cfg.wwwroot + '/mod/page/view.php?id=' + CMID_PAGINA_ENTREVISTAS + hash;
      }

      // ---------------------------------------------------------
      // GRÁFICO: EVOLUCIÓN DE LA CRITICIDAD (SVG, 0 A 100, DOS SERIES)
      // ---------------------------------------------------------
      function puntosDeSerie(serie) {
        return est.entradas.filter(function(c) {
          // Sin fecha válida no se puede ubicar en el eje (quedaría en 1970)
          if (c.origen !== 'automatica' || numero(c.indice) === null || !tiempoDe(c)) return false;
          var tipo = tipoDeEntrada(c, est.encuestas);
          return serie === 'notas' ? tipo === 'notas' : tipo && tipo !== 'notas';
        }).sort(function(a, b) { return tiempoDe(a) - tiempoDe(b); }).map(function(c) {
          var tipo = tipoDeEntrada(c, est.encuestas);
          return { t: tiempoDe(c), valor: numero(c.indice), ref: refDe(c), texto: TIPOS[tipo] + (c.motivo ? ' · ' + c.motivo : '') };
        });
      }

      function graficoCriticidad(anchoDisponible) {
        var series = { notas: puntosDeSerie('notas'), encuestas: puntosDeSerie('encuestas') };
        var marcas = est.entradas.filter(function(c) { return c.origen === 'manual' && ASIGNABLES.indexOf(c.semaforo) !== -1 && tiempoDe(c); }).map(function(c) {
          return { t: tiempoDe(c), valor: VALOR_ASIGNADO[c.semaforo], nivel: c.semaforo, ref: refDe(c), texto: c.motivo + ' (' + (c.autor || 'sin autor') + ')' };
        });
        var paso = est.info && est.info.periodo_paso_superior ? Date.parse(inicioDePeriodo(est.info.periodo_paso_superior)) : NaN;
        var todas = series.notas.concat(series.encuestas, marcas);
        if (!todas.length) {
          return '<div style="height: 220px !important; border: 1px dashed #c2c9d6 !important; border-radius: 8px !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 8px !important; color: #47536b !important; text-align: center !important; padding: 16px !important;">' +
            '<span style="color: #94a0b8 !important;">' + icono('tablero', 32) + '</span>Todavía no hay criticidad calculada: faltan notas de parciales o encuestas.</div>';
        }
        // Se dibuja al ancho real del contenedor para que el texto no se achique en pantallas angostas
        var W = Math.max(200, Math.round(anchoDisponible || 640)), H = W < 480 ? 220 : 260, m = { i: 36, d: 16, a: 12, b: 32 };
        var ancho = W - m.i - m.d, alto = H - m.a - m.b;
        var tiempos = todas.map(function(p) { return p.t; });
        if (isFinite(paso)) tiempos.push(paso);
        var t0 = Math.min.apply(null, tiempos), t1 = Math.max.apply(null, tiempos);
        if (t0 === t1) { t0 -= 15 * 864e5; t1 += 15 * 864e5; }
        var x = function(t) { return m.i + (t - t0) / (t1 - t0) * ancho; };
        // Un índice fuera de 0 a 100 (dato anómalo) se dibuja en el borde, no fuera del gráfico
        var y = function(v) { return m.a + (100 - Math.min(100, Math.max(0, v))) / 100 * alto; };
        var svg = '<svg id="grafico-criticidad" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Evolución de la criticidad de 0 a 100: parciales y encuestas" style="display: block !important; overflow: visible !important; font-family: inherit !important;">';
        // Bandas del semáforo (40 y 70)
        [[100, CORTES.rojo, 'rojo'], [CORTES.rojo, CORTES.amarillo, 'amarillo'], [CORTES.amarillo, 0, 'verde']].forEach(function(b) {
          svg += '<rect x="' + m.i + '" y="' + y(b[0]) + '" width="' + ancho + '" height="' + (y(b[1]) - y(b[0])) + '" fill="' + NIVELES[b[2]].fondo + '"/>';
        });
        // Grilla y eje Y
        [0, 20, 40, 60, 70, 80, 100].forEach(function(v) {
          var corte = v === CORTES.rojo || v === CORTES.amarillo;
          if (v === 60 || v === 80) return;
          svg += '<line x1="' + m.i + '" x2="' + (W - m.d) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(194, 201, 214, 0.6)" stroke-dasharray="' + (corte ? '0' : '3 3') + '"/>' +
            '<text x="' + (m.i - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#47536b">' + v + '</text>';
        });
        // Eje X: una etiqueta por punto (mes/año), salteando las que se pisarían con la anterior
        var ultimaX = -Infinity;
        tiempos.slice().sort(function(a, b) { return a - b; }).forEach(function(t) {
          var px = x(t);
          if (px - ultimaX < 56) return;
          ultimaX = px;
          var d = new Date(t);
          var etiqueta = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getFullYear()).slice(2);
          var ancla = px - m.i < 24 ? 'start' : W - m.d - px < 24 ? 'end' : 'middle';
          svg += '<text x="' + px + '" y="' + (H - 10) + '" text-anchor="' + ancla + '" font-size="11" fill="#47536b">' + etiqueta + '</text>';
        });
        // Paso a 2.º año: línea vertical punteada
        if (isFinite(paso)) {
          svg += '<g data-punto><title>' + escapar('Pasó a 2.º año: ' + textoPeriodo(est.info.periodo_paso_superior)) + '</title>' +
            '<line x1="' + x(paso) + '" x2="' + x(paso) + '" y1="' + m.a + '" y2="' + (H - m.b) + '" stroke="#566481" stroke-width="1.5" stroke-dasharray="1 4"/></g>';
        }
        // Las dos series
        Object.keys(SERIES).forEach(function(k) {
          var s = SERIES[k], pts = series[k];
          if (pts.length > 1) {
            svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-dasharray="' + s.trazo + '" stroke-linejoin="round" points="' +
              pts.map(function(p) { return x(p.t) + ',' + y(p.valor); }).join(' ') + '"/>';
          }
          pts.forEach(function(p) {
            var cx = x(p.t), cy = y(p.valor);
            var forma = k === 'notas'
              ? '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#ffffff" stroke="' + s.color + '" stroke-width="2.5"/>'
              : '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" fill="#ffffff" stroke="' + s.color + '" stroke-width="2.5"/>';
            var etiqueta = fechaDeTiempo(p.t) + ' · ' + p.texto + ' · índice ' + p.valor;
            svg += '<g data-punto data-ref-punto="' + escapar(p.ref) + '" data-serie="' + k + '" role="button" tabindex="0" aria-label="' + escapar(etiqueta + '. Resaltar en la trayectoria') + '"><title>' + escapar(etiqueta) + '</title>' + forma + '</g>';
          });
        });
        // Marcas de los estados asignados (rombo en el centro de su banda)
        marcas.forEach(function(p) {
          var cx = x(p.t), cy = y(p.valor);
          var etiqueta = fechaDeTiempo(p.t) + ' · Asignado: ' + NIVELES[p.nivel].texto + ' · ' + p.texto;
          svg += '<g data-punto data-ref-punto="' + escapar(p.ref) + '" data-serie="asignado" role="button" tabindex="0" aria-label="' + escapar(etiqueta + '. Resaltar en la trayectoria') + '"><title>' + escapar(etiqueta) + '</title>' +
            '<line x1="' + cx + '" x2="' + cx + '" y1="' + m.a + '" y2="' + (H - m.b) + '" stroke="#0b0e14" stroke-width="1" stroke-dasharray="2 3"/>' +
            '<rect x="' + (cx - 6) + '" y="' + (cy - 6) + '" width="12" height="12" transform="rotate(45 ' + cx + ' ' + cy + ')" fill="' + NIVELES[p.nivel].punto + '" stroke="#0b0e14" stroke-width="2"/></g>';
        });
        svg += '<\/svg>';
        var item = function(muestra, texto) {
          return '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important;">' + muestra + texto + '</span>';
        };
        var leyenda = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 8px 16px !important; font-size: 12px !important; color: #47536b !important; margin-top: 8px !important;">' +
          item('<span style="width: 10px !important; height: 10px !important; border-radius: 50% !important; border: 2.5px solid ' + SERIES.notas.color + ' !important; box-sizing: border-box !important;"></span>', SERIES.notas.texto + ' (' + series.notas.length + ')') +
          item('<span style="width: 10px !important; height: 10px !important; border: 2.5px solid ' + SERIES.encuestas.color + ' !important; box-sizing: border-box !important;"></span>', SERIES.encuestas.texto + ' (' + series.encuestas.length + ')') +
          item('<span style="width: 10px !important; height: 10px !important; background-color: #ffffff !important; border: 2px solid #0b0e14 !important; transform: rotate(45deg) !important; box-sizing: border-box !important;"></span>', 'Estado asignado') +
          (isFinite(paso) ? item('<span style="width: 0 !important; height: 12px !important; border-left: 2px dotted #566481 !important;"></span>', 'Pasó a 2.º año') : '') +
          '<span>Bandas: ' + CORTES.rojo + ' o más riesgo alto · ' + CORTES.amarillo + ' a ' + (CORTES.rojo - 1) + ' riesgo medio · menos de ' + CORTES.amarillo + ' sin riesgo</span></div>';
        return svg + leyenda;
      }

      // ---------------------------------------------------------
      // CRONOLOGÍA (LO QUE FUE HACIENDO EL ESTUDIANTE)
      // ---------------------------------------------------------
      // REFERENCIA DE UNA ENTRADA DE CRITICIDAD: UNE EL PUNTO DEL GRÁFICO CON SU EVENTO EN LA TRAYECTORIA
      function refDe(c) {
        return c.rid !== null && c.rid !== undefined && c.rid !== '' ? 'c' + c.rid : 't' + tiempoDe(c);
      }

      function itemsCronologia() {
        var items = [];
        var parcialPorRid = {};
        est.parciales.forEach(function(p) { parcialPorRid[String(p.rid)] = p; });
        var respuestaConEntrada = {};
        est.entradas.forEach(function(c) {
          var indice = numero(c.indice);
          var tipo = tipoDeEntrada(c, est.encuestas);
          var extra = indice !== null ? [chipNivel(nivelDeIndice(indice)), chipNeutro('Índice ' + indice)] : [];
          if (c.origen === 'manual') {
            var quita = ASIGNABLES.indexOf(c.semaforo) === -1;
            items.push({ t: tiempoDe(c), ref: refDe(c), grupo: 'asignado', titulo: quita ? 'Quitó el estado asignado' : 'Asignó un estado',
              texto: c.motivo, extra: [quita ? chipNeutro('Vuelve el calculado') : chipNivel(c.semaforo), chipNeutro(c.autor || 'Sin autor')] });
          } else if (tipo === 'notas') {
            var p = parcialPorRid[String(c.rid_fuente)];
            var texto = c.fuente === 'materias' ? (c.motivo || 'Recálculo por un cambio en las materias de 1.er año.')
              : p ? p.Materia + ' · ' + p.Instancia + ' · ' + (p.Nota ? 'nota ' + p.Nota : 'sin nota') + (p.Estado ? ' (' + p.Estado + ')' : '') : 'Nota de un parcial de 1.er año.';
            items.push({ t: tiempoDe(c), ref: refDe(c), grupo: 'notas', titulo: c.fuente === 'materias' ? 'Recálculo de las notas' : 'Cargó una nota', texto: texto, extra: extra });
          } else if (tipo === 'omision') {
            items.push({ t: tiempoDe(c), ref: refDe(c), grupo: 'encuesta', titulo: 'No respondió la encuesta', texto: c.motivo || 'Encuesta Cuatrimestral ' + c.periodo, extra: extra });
          } else if (tipo) {
            respuestaConEntrada[String(c.rid_fuente)] = true;
            items.push({ t: tiempoDe(c), ref: refDe(c), respuesta: String(c.rid_fuente), grupo: 'encuesta', titulo: 'Respondió la ' + TIPOS[tipo], texto: tipo === 'cuatrimestral' ? 'Período ' + c.periodo : tipo === 'inicial' ? 'No entra en el calculado (se ve como referencia).' : '', extra: extra });
          }
        });
        // Envíos de encuestas sin entrada de Criticidad (el índice no se pudo calcular)
        est.respuestas.forEach(function(r) {
          if (respuestaConEntrada[String(r.rid)]) return;
          items.push({ t: tiempoDe(r), respuesta: String(r.rid), grupo: 'encuesta', titulo: 'Respondió la ' + (TIPOS[r.codigo_encuesta] || 'encuesta'), texto: 'Sin índice de criticidad registrado.', extra: [] });
        });
        est.entrevistas.forEach(function(x) {
          var fecha = x.fecha_realizada || x.fecha_programada || x.fecha_solicitud;
          items.push({ t: Date.parse(fecha) || 0, grupo: 'entrevista', titulo: 'Entrevista con ' + (x.nombre_acompanante || 'un acompañante'),
            texto: x.resultado || x.motivo || '', extra: [chipNeutro(x.estado || 'Sin estado')] });
        });
        if (est.info) {
          if (fechaVisible(est.info.alta)) items.push({ t: Date.parse(est.info.alta) || 0, grupo: 'info', titulo: 'Cargó su información personal', texto: (est.info.es_primer_anio === 'si' ? '1.er año' : '2.º año en adelante') + (est.cohorte ? ' · cohorte ' + est.cohorte : ''), extra: [] });
          if (est.info.periodo_paso_superior) items.push({ t: Date.parse(inicioDePeriodo(est.info.periodo_paso_superior)) || 0, grupo: 'info', titulo: 'Pasó a 2.º año', texto: textoPeriodo(est.info.periodo_paso_superior), extra: [] });
        }
        return items.sort(function(a, b) { return b.t - a.t; });
      }

      function cronologia() {
        var items = itemsCronologia();
        var grupos = Object.keys(ACTIVIDADES).filter(function(k) { return items.some(function(i) { return i.grupo === k; }); });
        var filtros = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 6px !important; margin-bottom: 12px !important;">' +
          [''].concat(grupos).map(function(k) {
            var activo = filtroActividad === k;
            var cantidad = items.filter(function(i) { return !k || i.grupo === k; }).length;
            return '<span role="button" tabindex="0" data-filtro-actividad="' + k + '" aria-pressed="' + activo + '" style="display: inline-flex !important; align-items: center !important; height: 28px !important; padding: 0 10px !important; border-radius: 999px !important; font-size: 12px !important; font-weight: 500 !important; cursor: pointer !important; border: 1px solid ' + (activo ? '#026bd4' : '#dadee7') + ' !important; background-color: ' + (activo ? '#e5f2ff' : '#ffffff') + ' !important; color: ' + (activo ? '#024a92' : '#47536b') + ' !important; box-sizing: border-box !important;">' +
              (k ? ACTIVIDADES[k].texto : 'Todo') + ' · ' + cantidad + '</span>';
          }).join('') + '</div>';
        var lista = items.filter(function(i) { return !filtroActividad || i.grupo === filtroActividad; }).map(function(i) {
          var verDetalle = i.respuesta && respuestaPorRid(i.respuesta)
            ? '<div data-ver-respuesta="' + escapar(i.respuesta) + '" role="button" tabindex="0" style="display: inline-flex !important; align-items: center !important; gap: 4px !important; margin-top: 4px !important; color: #026bd4 !important; font-size: 13px !important; font-weight: 500 !important; cursor: pointer !important;">' + icono('ver', 16) + 'Ver detalle</div>'
            : '';
          return '<div data-item-cronologia="' + i.grupo + '"' + (i.ref ? ' data-ref="' + escapar(i.ref) + '"' : '') + ' style="display: flex !important; gap: 12px !important; padding: 10px 8px !important; margin: 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 6px !important; transition: background-color 0.2s ease, box-shadow 0.2s ease !important;">' +
            '<span style="width: 32px !important; height: 32px !important; border-radius: 8px !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; flex: 0 0 auto !important;">' + icono(ACTIVIDADES[i.grupo].icono, 18) + '</span>' +
            '<div style="flex: 1 1 auto !important; min-width: 0 !important;">' +
            '<div style="display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 6px 8px !important;"><span style="font-weight: 500 !important;">' + escapar(i.titulo) + '</span>' + i.extra.join('') + '</div>' +
            (i.texto ? '<div style="overflow-wrap: anywhere !important;">' + escapar(i.texto) + '</div>' : '') + verDetalle + '</div>' +
            '<div style="flex: 0 0 auto !important; font-size: 12px !important; color: #47536b !important; font-variant-numeric: tabular-nums !important;">' + (i.t ? fechaDeTiempo(i.t) : '—') + '</div></div>';
        }).join('');
        return filtros + '<div style="max-height: 420px !important; overflow-y: auto !important; overflow-x: hidden !important; overscroll-behavior: contain !important; min-width: 0 !important;">' + (lista || '<div style="color: #47536b !important;">Sin actividades de este tipo.</div>') + '</div>';
      }


      // ---------------------------------------------------------
      // DETALLE DE UNA ENCUESTA: PREGUNTA Y RESPUESTA (BASES RESPUESTAS Y ENCUESTAS)
      // ---------------------------------------------------------
      function respuestaPorRid(rid) {
        return est.respuestas.filter(function(r) { return String(r.rid) === String(rid); })[0] || null;
      }

      function json(texto, defecto) {
        if (texto && typeof texto === 'object') return texto;
        try { return JSON.parse(texto); } catch (e) { return defecto; }
      }

      // PREGUNTAS DE UNA VERSIÓN DE ENCUESTA (json_preguntas llega como texto desde la base)
      function preguntasDe(codigo, version) {
        var def = (datos.encuestas || []).filter(function(e) { return e.codigo_encuesta === codigo && String(e.version) === String(version); })[0];
        var lista = def ? json(def.json_preguntas, []) : [];
        return Array.isArray(lista) ? lista : [];
      }

      // TEXTO DE UNA RESPUESTA SEGÚN EL TIPO DE PREGUNTA
      function textoRespuesta(p, respuestas) {
        if (!Array.isArray(respuestas) || !respuestas.length) return 'Sin respuesta';
        if (p && p.formato === 'seleccion_creditos') {
          var sel = respuestas[0] || {};
          return 'Plan ' + (sel.plan || '—') + ' · ' + (Array.isArray(sel.materias) ? sel.materias.length : 0) + ' materias marcadas' +
            (Array.isArray(sel.materias) && sel.materias.length ? ': ' + sel.materias.join(', ') : '');
        }
        if (p && p.formato === 'selector_materias') {
          return respuestas.map(function(m) {
            if (!m || typeof m !== 'object') return String(m);
            var extra = [];
            if (m.primera_vez === true) extra.push('primera vez');
            if (m.primera_vez === false) extra.push('recursa');
            if (typeof m.dificultad === 'number') extra.push('dificultad ' + m.dificultad);
            return m.materia + (extra.length ? ' (' + extra.join(', ') + ')' : '');
          }).join(' · ');
        }
        if (p && Array.isArray(p.opciones)) {
          return respuestas.map(function(o) {
            var op = p.opciones.filter(function(x) { return Number(x.opcion) === Number(o); })[0];
            return op ? op.texto : String(o);
          }).join(' · ');
        }
        return respuestas.map(function(v) { return v && typeof v === 'object' ? JSON.stringify(v) : String(v); }).join(' · ');
      }

      // ---------------------------------------------------------
      // PLAN DE ESTUDIOS: NOMBRES, AÑO Y CRÉDITOS DE CADA CÓDIGO (BASE MATERIAS)
      // ---------------------------------------------------------
      // Se lee después de dibujar la página, en segundo plano: no suma tiempo a la carga. Si el modal de respuestas se abre antes,
      // muestra los códigos con "Cargando nombres…" y se vuelve a dibujar al terminar. Un código que no está en la base se muestra tal cual
      var plan = { estado: 'sin_leer', porPlan: {} }; // estado: sin_leer, cargando, listo o error. porPlan: { '<plan>': { '<codigo>': materia } }

      // CSV SIMPLE CON COMILLAS (EL DEL REPO): [{ columna: valor }]
      function parsearCsv(texto) {
        var filas = [], fila = [], campo = '', comillas = false;
        for (var i = 0; i < texto.length; i++) {
          var c = texto[i];
          if (comillas) {
            if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; } else if (c === '"') comillas = false; else campo += c;
          } else if (c === '"') comillas = true;
          else if (c === ',') { fila.push(campo); campo = ''; }
          else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(campo); filas.push(fila); fila = []; campo = ''; }
          else campo += c;
        }
        if (campo || fila.length) { fila.push(campo); filas.push(fila); }
        var encabezado = (filas.shift() || []).map(function(h) { return h.trim(); });
        return filas.filter(function(f) { return f.join('').trim(); }).map(function(f) {
          var o = {};
          encabezado.forEach(function(h, j) { o[h] = (f[j] || '').trim(); });
          return o;
        });
      }

      // LA ENTRADA MÁS NUEVA DE CADA plan + codigo, SIN LAS DADAS DE BAJA (MISMA REGLA QUE Widgets)
      function indexarPlan(lista) {
        var porPlan = {};
        lista.forEach(function(m, i) {
          var p = String(m.plan || '').trim(), c = String(m.codigo || '').trim();
          if (!p || !c) return;
          var orden = Number(m.rid) || i;
          var previa = (porPlan[p] = porPlan[p] || {})[c];
          if (!previa || orden >= previa.orden) porPlan[p][c] = { orden: orden, m: m };
        });
        var r = {};
        Object.keys(porPlan).forEach(function(p) {
          r[p] = {};
          Object.keys(porPlan[p]).forEach(function(c) {
            var m = porPlan[p][c].m;
            if (String(m.estado || '').trim() === 'baja') return;
            var cuat = parseInt(m.cuatrimestre, 10);
            r[p][c] = { codigo: c, nombre: String(m.nombre || c).trim(), anio: cuat > 0 ? Math.ceil(cuat / 2) : null, creditos: numero(m.creditos) || 0 };
          });
        });
        return r;
      }

      function cargarPlan() {
        if (plan.estado !== 'sin_leer') return;
        plan.estado = 'cargando';
        var lectura = usaPrueba && window.location.protocol === 'file:' ? Promise.resolve(MATERIAS_PRUEBA)
          : usaPrueba ? fetch(new URL(CSV_PLANES_LOCAL, window.location.href).href).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
              .then(parsearCsv).catch(function() { return MATERIAS_PRUEBA; })
          : leerBase('Materias', { dataid: DATAID_MATERIAS, porPagina: 500 }, ESPERA_OPCIONAL);
        lectura.then(function(lista) {
          plan.porPlan = indexarPlan(lista);
          plan.estado = 'listo';
        }, function() { plan.estado = 'error'; }).then(function() {
          if (modalRespuestas && modalRespuestas.rid) abrirRespuestas(modalRespuestas.rid, modalRespuestas.disparador);
        });
      }

      // MATERIA DE UN CÓDIGO: PRIMERO EN SU PLAN Y, SI NO, EN CUALQUIERA (LOS CÓDIGOS DE 2024 Y 2003 NO SE REPITEN)
      function materiaDe(codigo, planEnvio) {
        var c = String(codigo || '').trim();
        if (planEnvio && plan.porPlan[planEnvio] && plan.porPlan[planEnvio][c]) return plan.porPlan[planEnvio][c];
        var otros = Object.keys(plan.porPlan).filter(function(p) { return plan.porPlan[p][c]; });
        return otros.length ? plan.porPlan[otros[0]][c] : null;
      }

      function ordinalAnio(a) {
        return a + (a === 1 || a === 3 ? '.er' : '.º') + ' año';
      }

      function formatoCreditos(n) {
        return (Math.round(n * 10) / 10).toString().replace('.', ',');
      }

      function avisoPlan() {
        if (plan.estado === 'listo') return '';
        var texto = plan.estado === 'error' ? 'No se pudo leer la base Materias: se muestran los códigos.' : 'Cargando los nombres de las materias…';
        return '<div style="font-size: 13px !important; color: #566481 !important; margin: 0 0 8px 0 !important;">' + texto + '</div>';
      }

      function barra(valor, maximo, color, ancho) {
        var pct = maximo > 0 ? Math.max(0, Math.min(100, valor / maximo * 100)) : 0;
        return '<span aria-hidden="true" style="display: inline-block !important; width: ' + (ancho || 80) + 'px !important; height: 8px !important; border-radius: 4px !important; background-color: #ebeef4 !important; overflow: hidden !important; vertical-align: middle !important;">' +
          '<span style="display: block !important; width: ' + pct + '% !important; height: 100% !important; background-color: ' + color + ' !important;"></span></span>';
      }

      // 1A: MATERIAS CURSADAS, DE LA MÁS DIFÍCIL A LA MÁS FÁCIL (EMPATE: PRIMERO LAS RECURSADAS)
      function htmlCursadas(respuestas, planEnvio) {
        var lista = (respuestas || []).filter(function(m) { return m && typeof m === 'object'; });
        if (!lista.length) return escapar(textoRespuesta(null, respuestas));
        lista = lista.slice().sort(function(a, b) {
          return ((b.dificultad || 0) - (a.dificultad || 0)) || ((a.primera_vez === false ? 0 : 1) - (b.primera_vez === false ? 0 : 1));
        });
        var recursadas = lista.filter(function(m) { return m.primera_vez === false; }).length;
        var conDificultad = lista.filter(function(m) { return typeof m.dificultad === 'number'; });
        var media = conDificultad.length ? conDificultad.reduce(function(a, m) { return a + m.dificultad; }, 0) / conDificultad.length : null;
        var th = 'text-align: left !important; font-size: 12px !important; font-weight: 500 !important; color: #566481 !important; padding: 6px 8px !important; border-bottom: 1px solid #dadee7 !important;';
        var td = 'padding: 8px !important; border-bottom: 1px solid rgba(194, 201, 214, 0.4) !important; vertical-align: middle !important;';
        var filas = lista.map(function(m) {
          var info = materiaDe(m.materia, planEnvio);
          var sub = [escapar(m.materia)];
          if (info && info.anio) sub.push(ordinalAnio(info.anio));
          if (info) sub.push(formatoCreditos(info.creditos) + ' CG');
          else if (plan.estado === 'listo') sub.push('no está en el plan');
          var chip = m.primera_vez === false ? ['Recursa', NIVELES.rojo] : m.primera_vez === true ? ['1.ª vez', NIVELES.sin_datos] : ['Sin responder', NIVELES.sin_datos];
          var d = typeof m.dificultad === 'number' ? m.dificultad : null;
          var nivel = d === null ? NIVELES.sin_datos : d >= 4 ? NIVELES.rojo : d === 3 ? NIVELES.amarillo : NIVELES.verde;
          var etiqueta = d === null ? 'Sin responder' : d >= 4 ? 'Alta' : d === 3 ? 'Media' : 'Baja';
          return '<tr>' +
            '<td style="' + td + ' min-width: 150px !important;"><div style="font-weight: 500 !important; color: #0b0e14 !important;">' + escapar(info ? info.nombre : m.materia) + '</div>' +
            '<div style="font-size: 12px !important; color: #566481 !important;">' + sub.join(' · ') + '</div></td>' +
            '<td style="' + td + ' white-space: nowrap !important;"><span style="display: inline-block !important; padding: 2px 8px !important; border-radius: 999px !important; font-size: 12px !important; font-weight: 500 !important; background-color: ' + chip[1].fondo + ' !important; color: ' + chip[1].color + ' !important; border: 1px solid ' + chip[1].borde + ' !important;">' + chip[0] + '</span></td>' +
            '<td style="' + td + ' white-space: nowrap !important;">' + barra(d || 0, 5, nivel.punto, 48) +
            ' <span style="font-size: 13px !important; color: ' + nivel.color + ' !important; margin-left: 6px !important;">' + (d === null ? '' : d + ' · ') + etiqueta + '</span></td></tr>';
        }).join('');
        var resumen = lista.length + (lista.length === 1 ? ' materia' : ' materias') + ' · ' + recursadas + (recursadas === 1 ? ' recursada' : ' recursadas') +
          (media === null ? '' : ' · dificultad media ' + formatoCreditos(media));
        return avisoPlan() +
          '<div style="font-size: 13px !important; color: #47536b !important; margin: 0 0 6px 0 !important;">' + resumen + '</div>' +
          '<div style="overflow-x: auto !important;"><table style="width: 100% !important; border-collapse: collapse !important; font-size: 14px !important;">' +
          '<thead><tr><th style="' + th + '">Materia</th><th style="' + th + '">Cursada</th><th style="' + th + '">Dificultad (1 a 5)</th></tr></thead>' +
          '<tbody>' + filas + '</tbody></table></div>';
      }

      // 2A: CRÉDITOS APROBADOS POR AÑO DEL PLAN, CON LAS MATERIAS QUE LOS SUMAN (SIN LAS PENDIENTES)
      function htmlCreditos(respuestas, declarados) {
        var sel = (respuestas || [])[0];
        if (!sel || typeof sel !== 'object' || !Array.isArray(sel.materias)) return escapar(textoRespuesta(null, respuestas));
        var p = String(sel.plan || '').trim();
        var delPlan = plan.porPlan[p] || {};
        var otros = OTROS_CREDITOS[p] || [];
        var porAnio = {}, sinAnio = [], marcadosOtros = [], suma = 0;
        sel.materias.forEach(function(codigo) {
          var c = String(codigo).trim();
          var otro = otros.filter(function(o) { return o.codigo === c; })[0];
          if (otro) { marcadosOtros.push(otro); suma += otro.creditos; return; }
          var m = delPlan[c] || materiaDe(c, p);
          if (m) suma += m.creditos;
          if (m && m.anio) (porAnio[m.anio] = porAnio[m.anio] || []).push(m);
          else sinAnio.push(m || { codigo: c, nombre: c, creditos: null });
        });
        var listo = plan.estado === 'listo';
        var totalAnio = {}, totalPlan = otros.reduce(function(a, o) { return a + o.creditos; }, 0);
        Object.keys(delPlan).forEach(function(c) {
          var m = delPlan[c];
          totalPlan += m.creditos;
          if (m.anio) totalAnio[m.anio] = (totalAnio[m.anio] || 0) + m.creditos;
        });
        var item = function(m) {
          return '<li style="display: flex !important; justify-content: space-between !important; gap: 12px !important; padding: 3px 0 !important;">' +
            '<span><span aria-hidden="true" style="color: #1f7a1f !important; margin-right: 6px !important;">✓</span>' + escapar(m.nombre) +
            (m.nombre !== m.codigo ? ' <span style="font-size: 12px !important; color: #566481 !important;">' + escapar(m.codigo) + '</span>' : '') + '</span>' +
            '<span style="white-space: nowrap !important; color: #47536b !important;">' + (m.creditos === null ? '' : formatoCreditos(m.creditos) + ' CG') + '</span></li>';
        };
        var anios = Object.keys(porAnio).map(Number).sort(function(a, b) { return a - b; });
        var bloques = anios.map(function(a) {
          var aprobados = porAnio[a].reduce(function(x, m) { return x + m.creditos; }, 0);
          var total = totalAnio[a] || 0;
          var completo = total > 0 && aprobados >= total;
          return '<details open style="border-top: 1px solid rgba(194, 201, 214, 0.4) !important; padding: 6px 0 !important;">' +
            '<summary style="cursor: pointer !important; display: flex !important; align-items: center !important; gap: 10px !important; flex-wrap: wrap !important; list-style: revert !important;">' +
            '<b style="font-weight: 600 !important; min-width: 64px !important;">' + ordinalAnio(a) + '</b>' + barra(aprobados, total, completo ? NIVELES.verde.punto : '#026bd4', 120) +
            '<span style="font-size: 13px !important; color: #47536b !important;">' + formatoCreditos(aprobados) + (total ? '/' + formatoCreditos(total) : '') + ' CG · ' +
            porAnio[a].length + (porAnio[a].length === 1 ? ' materia' : ' materias') + (completo ? ' · completo' : '') + '</span></summary>' +
            '<ul style="list-style: none !important; margin: 6px 0 0 0 !important; padding: 0 0 0 4px !important; font-size: 14px !important;">' + porAnio[a].map(item).join('') + '</ul></details>';
        }).join('');
        if (sinAnio.length) {
          bloques += '<details style="border-top: 1px solid rgba(194, 201, 214, 0.4) !important; padding: 6px 0 !important;"><summary style="cursor: pointer !important;"><b style="font-weight: 600 !important;">' +
            (listo ? 'Fuera del plan' : 'Materias') + '</b> <span style="font-size: 13px !important; color: #47536b !important;">' + sinAnio.length + ' códigos</span></summary>' +
            '<ul style="list-style: none !important; margin: 6px 0 0 0 !important; padding: 0 0 0 4px !important; font-size: 14px !important;">' + sinAnio.map(item).join('') + '</ul></details>';
        }
        if (marcadosOtros.length) {
          bloques += '<div style="border-top: 1px solid rgba(194, 201, 214, 0.4) !important; padding: 8px 0 0 0 !important; font-size: 14px !important;"><b style="font-weight: 600 !important;">Otros</b> ' +
            marcadosOtros.map(function(o) { return '<span aria-hidden="true" style="color: #1f7a1f !important;">✓</span> ' + escapar(o.nombre) + (o.creditos ? ' (' + formatoCreditos(o.creditos) + ' CG)' : ''); }).join(' · ') + '</div>';
        }
        var cabecera = '<div style="display: flex !important; justify-content: space-between !important; align-items: baseline !important; gap: 12px !important; flex-wrap: wrap !important; margin: 0 0 6px 0 !important;">' +
          '<span style="font-size: 13px !important; color: #47536b !important;">Plan ' + escapar(p || '—') + ' · ' + sel.materias.length + ' marcadas</span>' +
          (listo ? '<b style="font-weight: 600 !important;">' + formatoCreditos(suma) + ' de ' + formatoCreditos(totalPlan) + ' CG (' + Math.round(totalPlan ? suma / totalPlan * 100 : 0) + ' %)</b>' : '') + '</div>' +
          (listo ? '<div style="margin: 0 0 8px 0 !important;">' + barra(suma, totalPlan, '#026bd4', 640).replace('width: 640px', 'width: 100%') + '</div>' : '');
        var diferencia = listo && typeof declarados === 'number' && Math.abs(declarados - suma) >= 0.5
          ? '<div style="font-size: 13px !important; padding: 6px 10px !important; margin: 0 0 8px 0 !important; border-radius: 8px !important; background-color: ' + NIVELES.amarillo.fondo + ' !important; color: ' + NIVELES.amarillo.color + ' !important; border: 1px solid ' + NIVELES.amarillo.borde + ' !important;">' +
            'Declaró ' + formatoCreditos(declarados) + ' CG; las materias marcadas suman ' + formatoCreditos(suma) + ' CG.</div>'
          : '';
        return avisoPlan() + cabecera + diferencia + bloques;
      }

      // PARES PREGUNTA / RESPUESTA DE UN ENVÍO, EN EL ORDEN DE LA ENCUESTA
      function paresDeEnvio(r) {
        var preguntas = preguntasDe(r.codigo_encuesta, r.version);
        var porId = {};
        preguntas.forEach(function(p) { porId[String(p.item_id)] = p; });
        var orden = {};
        preguntas.forEach(function(p, k) { orden[String(p.item_id)] = k; });
        var lista = json(r.json_respuesta, []);
        if (!Array.isArray(lista)) return [];
        // Plan del envío (del cuadro de créditos) y créditos declarados (la pregunta numérica que completa el cuadro)
        var planEnvio = '', declarados = null;
        lista.forEach(function(x) {
          var p = porId[String(x.item_id)];
          if (p && p.formato === 'seleccion_creditos' && x.respuestas && x.respuestas[0] && x.respuestas[0].plan) planEnvio = String(x.respuestas[0].plan);
          if (p && p.tipo === 'numeric' && /cr[eé]ditos/i.test(p.pregunta || '') && x.respuestas && typeof x.respuestas[0] === 'number') declarados = x.respuestas[0];
        });
        return lista.slice().sort(function(a, b) {
          var oa = orden[String(a.item_id)], ob = orden[String(b.item_id)];
          return (oa === undefined ? 1e6 : oa) - (ob === undefined ? 1e6 : ob);
        }).map(function(x) {

          var pregunta = p ? p.pregunta : 'Pregunta ' + x.item_id + ' (no está en la versión ' + r.version + ')';

          if (p && p.formato === 'seleccion_creditos') return { pregunta: 'Créditos aprobados (materias del cuadro de créditos)', html: htmlCreditos(x.respuestas, declarados) };
          return { pregunta: pregunta, respuesta: textoRespuesta(p, x.respuestas) };
        });

      function abrirRespuestas(rid, disparador) {
        var r = respuestaPorRid(rid);

        cargarPlan();

          '<div id="btn-cerrar-modal-respuestas" role="button" tabindex="0" aria-label="Cerrar" style="width: 32px !important; height: 32px !important; border-radius: 8px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; color: #47536b !important; cursor: pointer !important; flex: 0 0 auto !important;">' + icono('cerrar', 20) + '</div></div>' +

                return '<div style="padding: 10px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +

                  '<dd style="margin: 0 !important; font-weight: 500 !important; color: #0b0e14 !important; overflow-wrap: anywhere !important;">' + (x.html !== undefined ? x.html : escapar(x.respuesta)) + '</dd></div>';

            : '<div style="color: #47536b !important;">' + ((datos.encuestas || []).length ? 'Este envío no tiene respuestas guardadas.' : 'No se pudo leer la base Encuestas: faltan los textos de las preguntas.') + '</div>');
