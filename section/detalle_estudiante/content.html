      // ---------------------------------------------------------

      function $(id) { return document.getElementById(id); }

      function escapar(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
          return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
        });
      }

      function ahoraIso() {
        var d = new Date(), off = -d.getTimezoneOffset(), s = off >= 0 ? '+' : '-', a = Math.abs(off);
        var dos = function(n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()) + 'T' + dos(d.getHours()) + ':' + dos(d.getMinutes()) + ':' + dos(d.getSeconds()) +
          s + dos(Math.floor(a / 60)) + ':' + dos(a % 60);
      }

      function fechaVisible(iso) {
        var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
      }

      // FECHA DE UN INSTANTE (MILISEGUNDOS) EN LA HORA LOCAL: toISOString daría el día en UTC (después de las 21 h, el siguiente)
      function fechaDeTiempo(t) {
        var d = new Date(t);
        if (!isFinite(d.getTime())) return '';
        return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
      }

      // INICIO APROXIMADO DE UN PERÍODO AAAA-n (1.er cuatrimestre: marzo; 2.º: agosto)
      function inicioDePeriodo(periodo) {
        var m = String(periodo || '').match(/^(\d{4})-([12])$/);
        return m ? m[1] + (m[2] === '1' ? '-03-01T00:00:00-03:00' : '-08-01T00:00:00-03:00') : '';
      }

      function textoPeriodo(periodo) {
        var m = String(periodo || '').match(/^(\d{4})-([12])$/);
        return m ? (m[2] === '1' ? '1.er' : '2.º') + ' cuatrimestre ' + m[1] : '';
      }

      function leerAlmacen(clave, defecto) {
        try { var v = window.localStorage.getItem(clave); return v ? JSON.parse(v) : defecto; } catch (e) { return defecto; }
      }

      // ESTADOS ASIGNADOS EN LA VISTA PREVIA: SOLO UNA LISTA DE ENTRADAS CON id_usuario (UN VALOR CORRUPTO NO ROMPE LA PANTALLA)
      function asignadosPreview() {
        var v = leerAlmacen(CLAVE_PREVIEW, []);
        return Array.isArray(v) ? v.filter(function(c) { return c && typeof c === 'object' && c.id_usuario; }) : [];
      }

      function escribirAlmacen(clave, valor) {
        try { window.localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento: queda en memoria */ }
      }

      // ---------------------------------------------------------
      // CRITICIDAD DE UN ESTUDIANTE (MISMA REGLA QUE section/tablero_estudiantes)
      // ---------------------------------------------------------
      function numero(v) {
        if (v === null || v === undefined || String(v).trim() === '') return null;
        var n = Number(String(v).replace(',', '.'));
        return isFinite(n) ? n : null;
      }

      function nivelDeIndice(indice) {
        if (indice === null) return 'sin_datos';
        return indice >= CORTES.rojo ? 'rojo' : indice >= CORTES.amarillo ? 'amarillo' : 'verde';
      }

      function tiempoDe(c) {
        var t = Date.parse(c.created_at);
        if (isFinite(t)) return t;
        var a = Number(c.alta);
        return isFinite(a) ? a * 1000 : 0;
      }

      function masReciente(lista) {
        return lista.slice().sort(function(a, b) { return tiempoDe(a) - tiempoDe(b) || (Number(a.rid) || 0) - (Number(b.rid) || 0); }).pop() || null;
      }

      function tipoDeEntrada(c, encuestas) {
        if (c.fuente === 'notas_1ro' || c.fuente === 'materias') return 'notas';
        if (c.fuente === 'omision') return 'omision';
        if (c.fuente === 'respuestas') return encuestas[String(c.rid_fuente)] || 'encuesta';
        return null;
      }

      function criticidadDe(tramo, entradas, encuestas) {
        var candidatas = entradas.filter(function(c) {
          if (c.origen !== 'automatica' || String(c.periodo) !== PERIODO_ACTUAL || numero(c.indice) === null) return false;
          var tipo = tipoDeEntrada(c, encuestas);
          return tramo === 'primero' ? tipo === 'notas' : tipo === 'cuatrimestral' || tipo === 'omision';
        });
        var ultima = masReciente(candidatas);
        var calculado;
        if (ultima) {
          var indice = numero(ultima.indice);
          calculado = { nivel: nivelDeIndice(indice), indice: indice, tipo: tipoDeEntrada(ultima, encuestas), fecha: ultima.created_at, entrada: ultima,
            motivo: TIPOS[tipoDeEntrada(ultima, encuestas)] + ' del ' + fechaVisible(ultima.created_at) + ': índice ' + indice + (ultima.motivo ? ' (' + ultima.motivo + ')' : '') };
        } else {
          calculado = { nivel: 'sin_datos', indice: null, tipo: null, fecha: null, entrada: null,
            motivo: tramo === 'primero' ? 'Sin notas de parciales en ' + PERIODO_ACTUAL + '.' : 'Sin Encuesta Cuatrimestral en ' + PERIODO_ACTUAL + '.' };
        }
        var ultimaManual = masReciente(entradas.filter(function(c) { return c.origen === 'manual'; }));
        var asignado = ultimaManual && ASIGNABLES.indexOf(ultimaManual.semaforo) !== -1 ? ultimaManual : null;
        return { calculado: calculado, asignado: asignado, vigente: asignado ? asignado.semaforo : calculado.nivel };
      }

      // BIBLIOTECA DE TOOLS (COMO EL CARGADOR DE TOOLS CON TOOL = null: UNA SOLA LECTURA POR PÁGINA)
      function cargarTools() {
        if (window.ZhakyzTools) return Promise.resolve(window.ZhakyzTools);
        if (window.ZhakyzToolsCarga) return window.ZhakyzToolsCarga;
        var url = M.cfg.wwwroot + '/mod/page/view.php?id=' + CMID_TOOLS;
        window.ZhakyzToolsCarga = fetch(url, { credentials: 'same-origin' })
          .then(function(r) {
            if (!r.ok) throw new Error('La Página Tools respondió HTTP ' + r.status + '.');
            return r.text();
          })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var biblioteca = doc.querySelector('script[type="text/plain"][data-zk-biblioteca="tools"]');
            if (!biblioteca) throw new Error('La Página Tools no contiene la biblioteca.');
            var s = document.createElement('script');
            s.setAttribute('data-base', url);
            s.textContent = biblioteca.textContent;
            document.head.appendChild(s);
            if (!window.ZhakyzTools || typeof window.ZhakyzTools.LeerBase !== 'function') throw new Error('La biblioteca de Tools no se pudo ejecutar.');
            return window.ZhakyzTools;
          });
        window.ZhakyzToolsCarga.catch(function() { window.ZhakyzToolsCarga = null; });
        return window.ZhakyzToolsCarga;
      }

      // ESPERA UNA PROMESA COMO MUCHO "ms": UNA BASE QUE NO RESPONDE NO DEJA LA PÁGINA CARGANDO PARA SIEMPRE
      function conLimite(promesa, ms, que) {
        return Promise.race([promesa, new Promise(function(r, rechazar) {
          setTimeout(function() { rechazar(new Error(que + ' tardó más de ' + (ms / 1000) + ' segundos.')); }, ms);
        })]);
      }

      // ENTRADAS DE UNA BASE (opciones de LeerBase) CON SUS CAMPOS COMO TEXTO, EL rid Y LA FECHA DE ALTA.
      // Si LeerBase llegó a su tope, la lista queda marcada como incompleta
      function leerBase(Tools, nombre, opciones, espera) {
        return conLimite(Tools.LeerBase(opciones), espera || ESPERA_BASE, 'La base ' + nombre).then(function(r) {
          var lista = r.entradas.map(function(e) {
            var c = {};
            Object.keys(e.campos).forEach(function(k) { c[k] = String(e.campos[k]).trim(); });
            c.rid = e.rid ? Number(e.rid) : null;
            c.alta = e.alta || '';
            return c;
          });
          if (r.completa === false) incompletas.push(nombre);
          return lista;
        });
      }

      function leerPerfilMoodle(id) {

      // AGREGAR UNA ENTRADA (rid=0). Los campos se ubican por su etiqueta en el formulario de alta, como en la Página Tools
      function agregarEntradaMoodle(dataid, campos, registro) {
        return fetch(M.cfg.wwwroot + '/mod/data/edit.php?d=' + dataid, { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var form = Array.prototype.filter.call(doc.querySelectorAll('form'), function(f) { return f.querySelector('[name^="field_"]'); })[0];
            if (!form) throw new Error('No se encontró el formulario de alta de la base (d=' + dataid + ').');
            var porCampo = {};
            form.querySelectorAll('label[for]').forEach(function(l) {
              var ctrl = form.querySelector('#' + CSS.escape(l.getAttribute('for')));
              if (ctrl && /^field_/.test(ctrl.name)) porCampo[l.textContent.replace(/\s+/g, ' ').trim().toLowerCase()] = ctrl.name;
            });
            var fd = new FormData(form);
            fd.set('d', String(dataid));
            fd.set('rid', '0');
            campos.forEach(function(k) {
              if (!porCampo[k]) throw new Error('Falta el campo "' + k + '" en la base (d=' + dataid + ').');
              var v = registro[k];
              fd.set(porCampo[k], v === null || v === undefined ? '' : String(v));
            });
            fd.delete('saveandadd');
            fd.set('saveandview', 'Guardar');
            return fetch(M.cfg.wwwroot + '/mod/data/edit.php', { method: 'POST', body: fd, credentials: 'same-origin' });
          })
          .then(function(r) {
            if (!r.ok) throw new Error('Moodle respondió ' + r.status + '.');
            var m = (r.url || '').match(/[?&]rid=(\d+)/);
            if (m) return Number(m[1]);
            throw new Error('Moodle no confirmó la entrada nueva.');
          });
      }

      // ---------------------------------------------------------

      // ARMAR EL ESTUDIANTE DE LA URL CON SUS ENTRADAS
      function armarEstudiante() {
        est = null;
        if (!datos || !usuario) return;
        var encuestas = {};
        datos.respuestas.forEach(function(r) { encuestas[String(r.rid)] = r.codigo_encuesta; });
        var info = masReciente(datos.estudiantes.filter(function(e) { return String(e.id_usuario) === usuario; }).map(function(e) {

        var entradas = datos.criticidad.filter(function(c) { return String(c.id_usuario) === usuario; });

          (conFoto ? '<img id="foto-perfil" src="' + escapar(urlFoto(est.id)) + '" alt="Foto de perfil de ' + escapar(est.nombre) + '" style="width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important;">' : (est.info ? '<span aria-hidden="true">' + escapar(iniciales(est.nombre)) + '</span>' : icono('estudiante', 56))) + '</div>';
        var cabecera = avatar +
          '<div style="text-align: center !important; font-size: 18px !important; font-weight: 600 !important; overflow-wrap: anywhere !important;">' + escapar(est.nombre) + '</div>' +
          '<div style="text-align: center !important; color: #47536b !important; margin-bottom: 8px !important;">' + escapar(textoTramo()) + (est.cohorte ? ' · Cohorte ' + escapar(est.cohorte) : '') + '</div>' +
          '<div style="display: flex !important; justify-content: center !important; margin-bottom: 16px !important;">' + chipNivel(est.crit.vigente) + '</div>';
        var i = est.info;
        var campos = [
          { etiqueta: 'Id de usuario (Moodle)', valor: est.id },
          { etiqueta: 'DNI', valor: est.dni + (usaPrueba ? ' (ficticio)' : '') }
        ];
        if (i) {
          if (i.email) campos.push({ etiqueta: 'Correo', valor: i.email });
          if (i.anio_ingreso) campos.push({ etiqueta: 'Ingreso', valor: textoPeriodo(i.anio_ingreso + '-' + i.cuatrimestre_ingreso) });
          if (i.periodo_paso_superior) campos.push({ etiqueta: 'Pasó a 2.º año', valor: textoPeriodo(i.periodo_paso_superior) });
          // En Moodle la plantilla de Estudiantes trae la última modificación como texto (_modificada, ##timemodified##); en la vista previa, la fecha de alta
          if (fechaVisible(i.alta)) campos.push({ etiqueta: 'Información personal', valor: 'Cargada el ' + fechaVisible(i.alta) });
          else if (i._modificada) campos.push({ etiqueta: 'Información personal', valor: 'Última modificación: ' + i._modificada });
        } else {
          campos.push({ etiqueta: 'Información personal', valor: 'Sin cargar: el nombre, la cohorte y el año de la carrera faltan' });
        }
        if (perfil && perfil.campos.length) campos = campos.concat(perfil.campos);
        var lista = campos.map(function(c) {
          return '<div style="padding: 8px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +
            '<div style="font-size: 12px !important; color: #47536b !important;">' + escapar(c.etiqueta) + '</div>' +
            '<div style="font-weight: 500 !important; overflow-wrap: anywhere !important;">' + escapar(c.valor) + '</div></div>';
        }).join('');
        return tarjeta(i ? 'Perfil del estudiante' : 'Perfil del estudiante (sin información personal)', cabecera + lista);
      }

      // ---------------------------------------------------------
      // GRÁFICO: EVOLUCIÓN DE LA CRITICIDAD (SVG, 0 A 100, DOS SERIES)
      // ---------------------------------------------------------
      function puntosDeSerie(serie) {
        return est.entradas.filter(function(c) {
          // Sin fecha válida no se puede ubicar en el eje (quedaría en 1970)
          if (c.origen !== 'automatica' || numero(c.indice) === null || !tiempoDe(c)) return false;
          var tipo = tipoDeEntrada(c, est.encuestas);
          return serie === 'notas' ? tipo === 'notas' : tipo && tipo !== 'notas';
        }).sort(function(a, b) { return tiempoDe(a) - tiempoDe(b); }).map(function(c) {
          var tipo = tipoDeEntrada(c, est.encuestas);
          return { t: tiempoDe(c), valor: numero(c.indice), texto: TIPOS[tipo] + (c.motivo ? ' · ' + c.motivo : '') };
        });
      }

      function graficoCriticidad(anchoDisponible) {
        var series = { notas: puntosDeSerie('notas'), encuestas: puntosDeSerie('encuestas') };
        var marcas = est.entradas.filter(function(c) { return c.origen === 'manual' && ASIGNABLES.indexOf(c.semaforo) !== -1 && tiempoDe(c); }).map(function(c) {
          return { t: tiempoDe(c), valor: VALOR_ASIGNADO[c.semaforo], nivel: c.semaforo, texto: c.motivo + ' (' + (c.autor || 'sin autor') + ')' };
        });
        var paso = est.info && est.info.periodo_paso_superior ? Date.parse(inicioDePeriodo(est.info.periodo_paso_superior)) : NaN;
        var todas = series.notas.concat(series.encuestas, marcas);
        if (!todas.length) {
          return '<div style="height: 220px !important; border: 1px dashed #c2c9d6 !important; border-radius: 8px !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 8px !important; color: #47536b !important; text-align: center !important; padding: 16px !important;">' +
            '<span style="color: #94a0b8 !important;">' + icono('tablero', 32) + '</span>Todavía no hay criticidad calculada: faltan notas de parciales o encuestas.</div>';
        }
        // Se dibuja al ancho real del contenedor para que el texto no se achique en pantallas angostas
        var W = Math.max(200, Math.round(anchoDisponible || 640)), H = W < 480 ? 220 : 260, m = { i: 36, d: 16, a: 12, b: 32 };
        var ancho = W - m.i - m.d, alto = H - m.a - m.b;
        var tiempos = todas.map(function(p) { return p.t; });
        if (isFinite(paso)) tiempos.push(paso);
        var t0 = Math.min.apply(null, tiempos), t1 = Math.max.apply(null, tiempos);
        if (t0 === t1) { t0 -= 15 * 864e5; t1 += 15 * 864e5; }
        var x = function(t) { return m.i + (t - t0) / (t1 - t0) * ancho; };
        // Un índice fuera de 0 a 100 (dato anómalo) se dibuja en el borde, no fuera del gráfico
        var y = function(v) { return m.a + (100 - Math.min(100, Math.max(0, v))) / 100 * alto; };
        var svg = '<svg id="grafico-criticidad" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Evolución de la criticidad de 0 a 100: parciales y encuestas" style="display: block !important; overflow: visible !important; font-family: inherit !important;">';
        // Bandas del semáforo (40 y 70)
        [[100, CORTES.rojo, 'rojo'], [CORTES.rojo, CORTES.amarillo, 'amarillo'], [CORTES.amarillo, 0, 'verde']].forEach(function(b) {
          svg += '<rect x="' + m.i + '" y="' + y(b[0]) + '" width="' + ancho + '" height="' + (y(b[1]) - y(b[0])) + '" fill="' + NIVELES[b[2]].fondo + '"/>';
        });
        // Grilla y eje Y
        [0, 20, 40, 60, 70, 80, 100].forEach(function(v) {
          var corte = v === CORTES.rojo || v === CORTES.amarillo;
          if (v === 60 || v === 80) return;
          svg += '<line x1="' + m.i + '" x2="' + (W - m.d) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(194, 201, 214, 0.6)" stroke-dasharray="' + (corte ? '0' : '3 3') + '"/>' +
            '<text x="' + (m.i - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#47536b">' + v + '</text>';
        });
        // Eje X: una etiqueta por punto (mes/año), salteando las que se pisarían con la anterior
        var ultimaX = -Infinity;
        tiempos.slice().sort(function(a, b) { return a - b; }).forEach(function(t) {
          var px = x(t);
          if (px - ultimaX < 56) return;
          ultimaX = px;
          var d = new Date(t);
          var etiqueta = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getFullYear()).slice(2);
          var ancla = px - m.i < 24 ? 'start' : W - m.d - px < 24 ? 'end' : 'middle';
          svg += '<text x="' + px + '" y="' + (H - 10) + '" text-anchor="' + ancla + '" font-size="11" fill="#47536b">' + etiqueta + '</text>';
        });
        // Paso a 2.º año: línea vertical punteada
        if (isFinite(paso)) {
          svg += '<g data-punto><title>' + escapar('Pasó a 2.º año: ' + textoPeriodo(est.info.periodo_paso_superior)) + '</title>' +
            '<line x1="' + x(paso) + '" x2="' + x(paso) + '" y1="' + m.a + '" y2="' + (H - m.b) + '" stroke="#566481" stroke-width="1.5" stroke-dasharray="1 4"/></g>';
        }
        // Las dos series
        Object.keys(SERIES).forEach(function(k) {
          var s = SERIES[k], pts = series[k];
          if (pts.length > 1) {
            svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-dasharray="' + s.trazo + '" stroke-linejoin="round" points="' +
              pts.map(function(p) { return x(p.t) + ',' + y(p.valor); }).join(' ') + '"/>';
          }
          pts.forEach(function(p) {
            var cx = x(p.t), cy = y(p.valor);
            var forma = k === 'notas'
              ? '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#ffffff" stroke="' + s.color + '" stroke-width="2.5"/>'
              : '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" fill="#ffffff" stroke="' + s.color + '" stroke-width="2.5"/>';
            svg += '<g data-punto data-serie="' + k + '"><title>' + escapar(fechaDeTiempo(p.t) + ' · ' + p.texto + ' · índice ' + p.valor) + '</title>' + forma + '</g>';
          });
        });
        // Marcas de los estados asignados (rombo en el centro de su banda)
        marcas.forEach(function(p) {
          var cx = x(p.t), cy = y(p.valor);
          svg += '<g data-punto data-serie="asignado"><title>' + escapar(fechaDeTiempo(p.t) + ' · Asignado: ' + NIVELES[p.nivel].texto + ' · ' + p.texto) + '</title>' +
            '<line x1="' + cx + '" x2="' + cx + '" y1="' + m.a + '" y2="' + (H - m.b) + '" stroke="#0b0e14" stroke-width="1" stroke-dasharray="2 3"/>' +
            '<rect x="' + (cx - 6) + '" y="' + (cy - 6) + '" width="12" height="12" transform="rotate(45 ' + cx + ' ' + cy + ')" fill="' + NIVELES[p.nivel].punto + '" stroke="#0b0e14" stroke-width="2"/></g>';
        });
        svg += '<\/svg>';
        var item = function(muestra, texto) {
          return '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important;">' + muestra + texto + '</span>';
        };
        var leyenda = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 8px 16px !important; font-size: 12px !important; color: #47536b !important; margin-top: 8px !important;">' +
          item('<span style="width: 10px !important; height: 10px !important; border-radius: 50% !important; border: 2.5px solid ' + SERIES.notas.color + ' !important; box-sizing: border-box !important;"></span>', SERIES.notas.texto + ' (' + series.notas.length + ')') +
          item('<span style="width: 10px !important; height: 10px !important; border: 2.5px solid ' + SERIES.encuestas.color + ' !important; box-sizing: border-box !important;"></span>', SERIES.encuestas.texto + ' (' + series.encuestas.length + ')') +
          item('<span style="width: 10px !important; height: 10px !important; background-color: #ffffff !important; border: 2px solid #0b0e14 !important; transform: rotate(45deg) !important; box-sizing: border-box !important;"></span>', 'Estado asignado') +
          (isFinite(paso) ? item('<span style="width: 0 !important; height: 12px !important; border-left: 2px dotted #566481 !important;"></span>', 'Pasó a 2.º año') : '') +
          '<span>Bandas: ' + CORTES.rojo + ' o más riesgo alto · ' + CORTES.amarillo + ' a ' + (CORTES.rojo - 1) + ' riesgo medio · menos de ' + CORTES.amarillo + ' sin riesgo</span></div>';
        return svg + leyenda;
      }

      // ---------------------------------------------------------
      // CRONOLOGÍA (LO QUE FUE HACIENDO EL ESTUDIANTE)
      // ---------------------------------------------------------
      function itemsCronologia() {
        var items = [];
        var parcialPorRid = {};
        est.parciales.forEach(function(p) { parcialPorRid[String(p.rid)] = p; });
        var respuestaConEntrada = {};
        est.entradas.forEach(function(c) {
          var indice = numero(c.indice);
          var tipo = tipoDeEntrada(c, est.encuestas);
          var extra = indice !== null ? [chipNivel(nivelDeIndice(indice)), chipNeutro('Índice ' + indice)] : [];
          if (c.origen === 'manual') {
            var quita = ASIGNABLES.indexOf(c.semaforo) === -1;
            items.push({ t: tiempoDe(c), grupo: 'asignado', titulo: quita ? 'Quitó el estado asignado' : 'Asignó un estado',
              texto: c.motivo, extra: [quita ? chipNeutro('Vuelve el calculado') : chipNivel(c.semaforo), chipNeutro(c.autor || 'Sin autor')] });
          } else if (tipo === 'notas') {
            var p = parcialPorRid[String(c.rid_fuente)];
            var texto = c.fuente === 'materias' ? (c.motivo || 'Recálculo por un cambio en las materias de 1.er año.')
              : p ? p.Materia + ' · ' + p.Instancia + ' · ' + (p.Nota ? 'nota ' + p.Nota : 'sin nota') + (p.Estado ? ' (' + p.Estado + ')' : '') : 'Nota de un parcial de 1.er año.';
            items.push({ t: tiempoDe(c), grupo: 'notas', titulo: c.fuente === 'materias' ? 'Recálculo de las notas' : 'Cargó una nota', texto: texto, extra: extra });
          } else if (tipo === 'omision') {
            items.push({ t: tiempoDe(c), grupo: 'encuesta', titulo: 'No respondió la encuesta', texto: c.motivo || 'Encuesta Cuatrimestral ' + c.periodo, extra: extra });
          } else if (tipo) {
            respuestaConEntrada[String(c.rid_fuente)] = true;
            items.push({ t: tiempoDe(c), grupo: 'encuesta', titulo: 'Respondió la ' + TIPOS[tipo], texto: tipo === 'cuatrimestral' ? 'Período ' + c.periodo : tipo === 'inicial' ? 'No entra en el calculado (se ve como referencia).' : '', extra: extra });
          }
        });
        // Envíos de encuestas sin entrada de Criticidad (el índice no se pudo calcular)
        est.respuestas.forEach(function(r) {
          if (respuestaConEntrada[String(r.rid)]) return;
          items.push({ t: tiempoDe(r), grupo: 'encuesta', titulo: 'Respondió la ' + (TIPOS[r.codigo_encuesta] || 'encuesta'), texto: 'Sin índice de criticidad registrado.', extra: [] });
        });
        est.entrevistas.forEach(function(x) {
          var fecha = x.fecha_realizada || x.fecha_programada || x.fecha_solicitud;
          items.push({ t: Date.parse(fecha) || 0, grupo: 'entrevista', titulo: 'Entrevista con ' + (x.nombre_acompanante || 'un acompañante'),
            texto: x.resultado || x.motivo || '', extra: [chipNeutro(x.estado || 'Sin estado')] });
        });
        if (est.info) {
          if (fechaVisible(est.info.alta)) items.push({ t: Date.parse(est.info.alta) || 0, grupo: 'info', titulo: 'Cargó su información personal', texto: (est.info.es_primer_anio === 'si' ? '1.er año' : '2.º año en adelante') + (est.cohorte ? ' · cohorte ' + est.cohorte : ''), extra: [] });
          if (est.info.periodo_paso_superior) items.push({ t: Date.parse(inicioDePeriodo(est.info.periodo_paso_superior)) || 0, grupo: 'info', titulo: 'Pasó a 2.º año', texto: textoPeriodo(est.info.periodo_paso_superior), extra: [] });
        }
        return items.sort(function(a, b) { return b.t - a.t; });
      }

      function cronologia() {
        var items = itemsCronologia();
        var grupos = Object.keys(ACTIVIDADES).filter(function(k) { return items.some(function(i) { return i.grupo === k; }); });
        var filtros = '<div style="display: flex !important; flex-wrap: wrap !important; gap: 6px !important; margin-bottom: 12px !important;">' +
          [''].concat(grupos).map(function(k) {
            var activo = filtroActividad === k;
            var cantidad = items.filter(function(i) { return !k || i.grupo === k; }).length;
            return '<span role="button" tabindex="0" data-filtro-actividad="' + k + '" aria-pressed="' + activo + '" style="display: inline-flex !important; align-items: center !important; height: 28px !important; padding: 0 10px !important; border-radius: 999px !important; font-size: 12px !important; font-weight: 500 !important; cursor: pointer !important; border: 1px solid ' + (activo ? '#026bd4' : '#dadee7') + ' !important; background-color: ' + (activo ? '#e5f2ff' : '#ffffff') + ' !important; color: ' + (activo ? '#024a92' : '#47536b') + ' !important; box-sizing: border-box !important;">' +
              (k ? ACTIVIDADES[k].texto : 'Todo') + ' · ' + cantidad + '</span>';
          }).join('') + '</div>';
        var lista = items.filter(function(i) { return !filtroActividad || i.grupo === filtroActividad; }).map(function(i) {
          return '<div data-item-cronologia="' + i.grupo + '" style="display: flex !important; gap: 12px !important; padding: 10px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +
            '<span style="width: 32px !important; height: 32px !important; border-radius: 8px !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; flex: 0 0 auto !important;">' + icono(ACTIVIDADES[i.grupo].icono, 18) + '</span>' +
            '<div style="flex: 1 1 auto !important; min-width: 0 !important;">' +
            '<div style="display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 6px 8px !important;"><span style="font-weight: 500 !important;">' + escapar(i.titulo) + '</span>' + i.extra.join('') + '</div>' +
            (i.texto ? '<div style="overflow-wrap: anywhere !important;">' + escapar(i.texto) + '</div>' : '') + '</div>' +
            '<div style="flex: 0 0 auto !important; font-size: 12px !important; color: #47536b !important; font-variant-numeric: tabular-nums !important;">' + (i.t ? fechaDeTiempo(i.t) : '—') + '</div></div>';
        }).join('');
        return filtros + (lista || '<div style="color: #47536b !important;">Sin actividades de este tipo.</div>');
      }

      // ---------------------------------------------------------
      // HISTORIAL DE CAMBIOS DE ESTADO (CALCULADO Y ASIGNADO)
      // ---------------------------------------------------------
      function historialEstados() {
        var cambios = [];
        // Calculado: cada vez que cambia el nivel, con la fuente que correspondía al tramo de ese período
        var anterior = null, ultimoCalculado = 0;
        est.entradas.filter(function(c) {
          if (c.origen !== 'automatica' || numero(c.indice) === null) return false;
          var tipo = tipoDeEntrada(c, est.encuestas);
          return tramoEn(c.periodo) === 'primero' ? tipo === 'notas' : tipo === 'cuatrimestral' || tipo === 'omision';
        }).sort(function(a, b) { return tiempoDe(a) - tiempoDe(b); }).forEach(function(c) {
          var nivel = nivelDeIndice(numero(c.indice));
          if (nivel !== anterior) cambios.push({ t: tiempoDe(c), origen: 'Calculado', desde: anterior, hasta: nivel, quien: 'Sistema', motivo: TIPOS[tipoDeEntrada(c, est.encuestas)] + ': índice ' + numero(c.indice) });
          ultimoCalculado = tiempoDe(c);
          anterior = nivel;
        });
        // Si en el período actual todavía no hay fuente, el calculado vigente pasa a "Sin calcular" al empezar el período
        if (anterior && anterior !== 'sin_datos' && est.crit.calculado.nivel === 'sin_datos') {
          cambios.push({ t: Math.max(Date.parse(inicioDePeriodo(PERIODO_ACTUAL)) || 0, ultimoCalculado + 1), origen: 'Calculado', desde: anterior, hasta: 'sin_datos', quien: 'Sistema', motivo: est.crit.calculado.motivo });
        }
        var previo = null;
        est.entradas.filter(function(c) { return c.origen === 'manual'; }).sort(function(a, b) { return tiempoDe(a) - tiempoDe(b); }).forEach(function(c) {
          var quitado = ASIGNABLES.indexOf(c.semaforo) === -1;
          cambios.push({ t: tiempoDe(c), origen: 'Asignado', desde: previo, hasta: quitado ? null : c.semaforo, quien: c.autor || 'Sin autor', motivo: c.motivo, quitado: quitado });
          previo = quitado ? null : c.semaforo;
        });
        cambios.sort(function(a, b) { return b.t - a.t; });
        if (!cambios.length) return '<div style="color: #47536b !important;">Sin cambios de estado.</div>';
        var th = 'border: 0 !important; height: 44px !important; text-align: left !important; padding: 0 8px !important; font-size: 13px !important; font-weight: 500 !important; color: #47536b !important; background-color: #f5f6fa !important;';
        var td = 'border: 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important; padding: 8px !important; vertical-align: top !important;';
        return '<div style="overflow-x: auto !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important;"><table style="width: 100% !important; border-collapse: collapse !important; min-width: 560px !important; margin: 0 !important; font-size: 13px !important;">' +
          '<thead><tr><th style="' + th + ' padding-left: 12px !important;">Fecha</th><th style="' + th + '">Origen</th><th style="' + th + '">Cambio</th><th style="' + th + '">Quién y por qué</th></tr></thead><tbody>' +
          cambios.map(function(c) {
            var cambio = c.quitado ? '<span style="font-weight: 500 !important;">Quitado</span>' :
              (c.desde ? '<span style="opacity: 0.6 !important;">' + chipNivel(c.desde) + '</span>' : '') +
              (c.desde ? '<span style="color: #47536b !important; display: inline-flex !important; vertical-align: middle !important; margin: 0 2px !important;">' + icono('flecha', 16) + '</span>' : '') + chipNivel(c.hasta);
            return '<tr><td style="' + td + ' padding-left: 12px !important; white-space: nowrap !important; font-variant-numeric: tabular-nums !important;">' + fechaDeTiempo(c.t) + '</td>' +
              '<td style="' + td + '">' + chipNeutro(c.origen) + '</td>' +
              '<td style="' + td + ' white-space: nowrap !important;"><span style="display: inline-flex !important; align-items: center !important; gap: 4px !important;">' + cambio + '</span></td>' +
              '<td style="' + td + ' overflow-wrap: anywhere !important;"><div style="font-weight: 500 !important;">' + escapar(c.quien) + '</div><div style="color: #47536b !important;">' + escapar(c.motivo) + '</div></td></tr>';
          }).join('') + '</tbody></table></div>';
      }

      // ---------------------------------------------------------
      // RENDERIZADO
      // ---------------------------------------------------------
      function resumen() {
        var c = est.crit.calculado, a = est.crit.asignado;
        var puede = ROLES[rolActual].puedeAsignar;
        var accion = puede
          ? '<div id="btn-abrir-asignacion" role="button" tabindex="0" style="margin-top: 4px !important; align-self: flex-start !important; height: 32px !important; padding: 0 10px !important; border-radius: 8px !important; border: 1px solid #333c4d !important; background-image: linear-gradient(to bottom, #333c4d, #0b0e14) !important; color: #ffffff !important; font-size: 13px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; gap: 6px !important; cursor: pointer !important; box-sizing: border-box !important;">' + icono('editar', 16) + 'Asignar estado</div>'
          : '<div style="font-size: 12px !important; color: #47536b !important;">Solo tutores y administradores pueden asignar estados.</div>';
        var tarjetas = [
          ['Criticidad calculada', c.indice !== null ? c.indice + '<span style="font-size: 14px !important; color: #47536b !important; font-weight: 400 !important; margin-left: 4px !important;">/ 100</span>' : '—',
            c.indice !== null ? escapar(TIPOS[c.tipo]) + ' · ' + fechaVisible(c.fecha) : escapar(c.motivo)],
          ['Estado calculado', chipNivel(c.nivel), est.tramo === 'primero' ? 'notas de parciales de ' + PERIODO_ACTUAL : 'última Encuesta Cuatrimestral de ' + PERIODO_ACTUAL],
          ['Estado asignado', a ? chipNivel(a.semaforo) : '<span style="color: #94a0b8 !important;">—</span>', a ? 'por ' + escapar(a.autor || 'sin autor') + ' · ' + fechaVisible(a.created_at) : 'manda el calculado', accion]
        ];
        return '<div style="display: flex !important; flex-wrap: wrap !important; gap: 12px !important;">' + tarjetas.map(function(k) {
          return '<div style="flex: 1 1 170px !important; background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; padding: 12px 14px !important; box-sizing: border-box !important; display: flex !important; flex-direction: column !important; gap: 4px !important;">' +
            '<div style="font-size: 14px !important; font-weight: 500 !important;">' + k[0] + '</div>' +
            '<div style="font-size: 24px !important; font-weight: 600 !important; line-height: 1.2 !important; min-height: 29px !important; display: flex !important; align-items: center !important;">' + k[1] + '</div>' +
            '<div style="font-size: 12px !important; color: #47536b !important;">' + k[2] + '</div>' + (k[3] || '') + '</div>';
        }).join('') + '</div>';
      }

      function renderizar() {
        var cont = $('contenido-detalle');
        if (!datos) {
          cont.innerHTML = '<div style="padding: 32px !important; text-align: center !important; color: #47536b !important;">Cargando…</div>';
          return;
        }
        if (!est) {
          cont.innerHTML = '<div style="padding: 32px !important; text-align: center !important; color: #47536b !important; background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important;">No se encontró el estudiante. Abrí esta pantalla desde el Tablero de Criticidad.</div>';
          return;
        }
        cont.innerHTML =
          '<div style="display: flex !important; flex-wrap: wrap !important; gap: 16px !important; align-items: flex-start !important;">' +
          '<div style="flex: 1 1 240px !important; max-width: 300px !important; min-width: 0 !important;">' + columnaPerfil() + '</div>' +
          '<div style="flex: 999 1 420px !important; min-width: 0 !important; display: flex !important; flex-direction: column !important; gap: 16px !important;">' +
          resumen() +
          tarjeta('Evolución de la criticidad <span style="font-weight: 400 !important; color: #47536b !important;">(0 sin riesgo · 100 máximo riesgo)</span>', '<div id="contenedor-grafico"></div>') +
          tarjeta('Trayectoria <span style="font-weight: 400 !important; color: #47536b !important;">(de lo más reciente a lo más viejo)</span>', cronologia()) +
          tarjeta('Historial de cambios de estado', historialEstados()) +
          '</div></div>';
        dibujarGrafico();
        var foto = $('foto-perfil');
        if (foto) foto.onerror = function() { foto.parentNode.innerHTML = est.info ? '<span aria-hidden="true">' + escapar(iniciales(est.nombre)) + '</span>' : icono('estudiante', 56); };
      }

      // DIBUJAR EL GRÁFICO AL ANCHO DE SU CONTENEDOR (TAMBIÉN AL CAMBIAR EL TAMAÑO DE LA VENTANA)
      var anchoGrafico = 0;
      function dibujarGrafico() {
        var c = $('contenedor-grafico');
        if (!c || !est) return;
        anchoGrafico = c.clientWidth;
        c.innerHTML = graficoCriticidad(anchoGrafico);
      }

      window.addEventListener('resize', function() {
        var c = $('contenedor-grafico');
        if (c && Math.abs(c.clientWidth - anchoGrafico) > 8) dibujarGrafico();
      });

      // ---------------------------------------------------------
      // MODAL: ASIGNAR ESTADO (REQ 10, EL MISMO DEL TABLERO)
      // ---------------------------------------------------------
      function abrirModal(disparador) {
        if (!est || !ROLES[rolActual].puedeAsignar) return;
        modal = { id: est.id, disparador: disparador };
        var a = est.crit.asignado;
        var opciones = ASIGNABLES.map(function(n) { return { valor: n, html: chipNivel(n) }; });
        if (a) opciones.push({ valor: 'sin_asignar', html: '<span style="font-size: 13px !important; font-weight: 500 !important;">Quitar el estado asignado</span><span style="font-size: 12px !important; color: #47536b !important;">vuelve a mandar el calculado</span>' });
        var campo = 'padding: 8px 12px !important; border-radius: 8px !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; background-color: #fcfcfc !important; color: #0b0e14 !important; font-family: inherit !important; font-size: 14px !important; box-sizing: border-box !important; width: 100% !important; margin: 0 !important;';
        $('caja-modal-asignar').innerHTML =
          '<div style="display: flex !important; align-items: flex-start !important; justify-content: space-between !important; gap: 12px !important; margin-bottom: 4px !important;">' +
          '<h5 id="titulo-modal-asignar" style="margin: 0 !important; font-size: 20px !important; font-weight: 600 !important; line-height: 1.4 !important; color: #0b0e14 !important;">Asignar estado</h5>' +
          '<div id="btn-cerrar-modal-asignar" role="button" tabindex="0" aria-label="Cerrar" style="width: 32px !important; height: 32px !important; border-radius: 8px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; color: #47536b !important; cursor: pointer !important; flex: 0 0 auto !important;">' + icono('cerrar', 20) + '</div></div>' +
          '<div style="color: #47536b !important; margin-bottom: 16px !important;"><b style="font-weight: 600 !important; color: #0b0e14 !important;">' + escapar(est.nombre) + '</b> · ' + escapar(textoTramo()) + '</div>' +
          '<div style="display: flex !important; flex-wrap: wrap !important; gap: 8px 16px !important; align-items: center !important; padding: 10px 12px !important; border-radius: 8px !important; background-color: #f5f6fa !important; margin-bottom: 16px !important; font-size: 13px !important;">' +
          '<span style="color: #47536b !important;">Calculado</span>' + chipNivel(est.crit.calculado.nivel) +
          '<span style="color: #47536b !important;">Asignado</span>' + (a ? chipNivel(a.semaforo) : '<span style="color: #94a0b8 !important;">—</span>') + '</div>' +
          '<fieldset style="border: 0 !important; padding: 0 !important; margin: 0 0 12px 0 !important; min-width: 0 !important;">' +
          '<legend style="font-size: 14px !important; font-weight: 500 !important; color: #0b0e14 !important; margin: 0 0 8px 0 !important; padding: 0 !important;">Estado</legend>' +
          '<div style="display: flex !important; flex-direction: column !important; gap: 8px !important;">' +
          opciones.map(function(o) {
            return '<label data-opcion-nivel="' + o.valor + '" style="display: flex !important; align-items: center !important; gap: 10px !important; padding: 8px 12px !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; cursor: pointer !important; margin: 0 !important; box-sizing: border-box !important;">' +
              '<input type="radio" name="nivel-asignado" value="' + o.valor + '" style="margin: 0 !important; accent-color: #026bd4 !important; width: 16px !important; height: 16px !important;">' +
              '<span style="display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 4px 8px !important;">' + o.html + '</span></label>';
          }).join('') + '</div></fieldset>' +
          '<label for="campo-motivo-asignado" style="display: block !important; font-size: 14px !important; font-weight: 500 !important; color: #0b0e14 !important; margin: 0 0 6px 0 !important;">Motivo (obligatorio)</label>' +
          '<textarea id="campo-motivo-asignado" rows="3" aria-required="true" aria-describedby="txt-error-asignacion" placeholder="Por ejemplo, el resultado de la entrevista" style="resize: vertical !important; ' + campo + '"></textarea>' +
          '<div id="txt-error-asignacion" role="alert" style="display: none; color: #910808 !important; font-size: 13px !important; margin-top: 8px !important;"></div>' +
          '<div style="display: flex !important; justify-content: flex-end !important; gap: 8px !important; margin-top: 16px !important; flex-wrap: wrap !important;">' +
          '<div id="btn-cancelar-asignacion" role="button" tabindex="0" style="height: 40px !important; padding: 0 16px !important; border-radius: 8px !important; border: 1px solid #dadee7 !important; background-color: rgba(245, 246, 250, 0.3) !important; color: #0b0e14 !important; font-size: 14px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; cursor: pointer !important; box-sizing: border-box !important;">Cancelar</div>' +
          '<div id="btn-guardar-asignacion" role="button" tabindex="0" style="height: 40px !important; padding: 0 16px !important; border-radius: 8px !important; border: 1px solid #333c4d !important; background-image: linear-gradient(to bottom, #333c4d, #0b0e14) !important; color: #ffffff !important; font-size: 14px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; gap: 8px !important; cursor: pointer !important; box-sizing: border-box !important;">' +
          icono('guardar', 18) + '<span>Guardar</span></div></div>';
        $('modal-asignar-detalle').style.setProperty('display', 'flex', 'important');
        var primera = document.querySelector('#modal-asignar-detalle input[name="nivel-asignado"]');
        if (primera) primera.focus();
      }

      // Mientras guarda no se cierra (la entrada se guardaría igual): solo lo cierran el guardado mismo o un cambio de estudiante
      function cerrarModal(forzar) {
        if (!modal || (modal.guardando && !forzar)) return;
        $('modal-asignar-detalle').style.setProperty('display', 'none', 'important');
        modal = null;
        var boton = $('btn-abrir-asignacion');
        if (boton) boton.focus();
      }

      function mostrarError(texto, enMotivo) {
        var error = $('txt-error-asignacion');
        error.textContent = texto;
        error.style.setProperty('display', 'block', 'important');
        if (enMotivo) $('campo-motivo-asignado').setAttribute('aria-invalid', 'true');
      }

      function ocultarError() {
        var error = $('txt-error-asignacion');
        if (!error) return;
        error.style.setProperty('display', 'none', 'important');
        $('campo-motivo-asignado').removeAttribute('aria-invalid');
      }

      function guardarAsignacion() {
        if (!modal || modal.guardando) return;
        // El modal es de un estudiante: si la página ya muestra otro, no se guarda
        if (!est || modal.id !== est.id) return cerrarModal(true);
        var elegido = document.querySelector('#modal-asignar-detalle input[name="nivel-asignado"]:checked');
        var motivo = $('campo-motivo-asignado').value.trim();
        if (!elegido) return mostrarError('Elegí un estado.');
        if (!motivo) return mostrarError('Escribí el motivo: queda en el historial del estudiante.', true);
        var m = modal;
        var entrada = {
          id_usuario: est.id, dni: est.dni, periodo: PERIODO_ACTUAL, origen: 'manual', fuente: '', rid_fuente: '', indice: '',
          semaforo: elegido.value, motivo: motivo, created_at: ahoraIso()
        };
        m.guardando = true;
        var btn = $('btn-guardar-asignacion');
        btn.lastChild.textContent = 'Guardando…';
        var guardado = usaPrueba ? Promise.resolve(Date.now()) : agregarEntradaMoodle(DATAID_CRITICIDAD, CAMPOS_MANUAL, entrada);
        guardado.then(function(rid) {
          entrada.rid = rid;
          entrada.autor = usaPrueba ? 'Vista previa (' + rolActual + ')' : 'Vos';
          datos.criticidad.push(entrada);
          if (usaPrueba) escribirAlmacen(CLAVE_PREVIEW, asignadosPreview().concat([entrada]));
          armarEstudiante();
          renderizar();
          if (modal === m) cerrarModal(true);
        }).catch(function(err) {
          if (modal !== m) return;
          m.guardando = false;
          btn.lastChild.textContent = 'Guardar';
          mostrarError('No se pudo guardar: ' + err.message);
        });
      }

      // ---------------------------------------------------------
      // ROL Y VISTA PREVIA LOCAL
      // ---------------------------------------------------------
      function aplicarRol(rol) {
        rolActual = rol;
        var botones = document.querySelectorAll('[data-preview-rol]');
        for (var i = 0; i < botones.length; i++) {
          var activo = botones[i].getAttribute('data-preview-rol') === rol;
          botones[i].style.backgroundColor = activo ? '#ffffff' : 'transparent';
          botones[i].style.color = activo ? '#0b0e14' : '#c2c9d6';
        }
        renderizar();
      }

      function crearBarraPreview() {
        var ids = ESTUDIANTES_PRUEBA.map(function(e) { return { id: e.id_usuario, nombre: e.nombre + ' ' + e.apellido }; });
        CRITICIDAD_PRUEBA.forEach(function(c) {
          if (!ids.some(function(x) { return x.id === c.id_usuario; })) ids.push({ id: c.id_usuario, nombre: 'DNI ' + c.dni + ' (sin información personal)' });
        });
        var barra = document.createElement('div');
        barra.id = 'barra-preview-detalle';
        barra.setAttribute('style', 'display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 8px !important; padding: 8px 12px !important; margin: 0 0 20px 0 !important; background-color: #0b0e14 !important; color: #ffffff !important; border-radius: 8px !important; font-size: 13px !important;');
        barra.innerHTML = '<span style="display: inline-flex !important; align-items: center !important; gap: 8px !important; font-weight: 500 !important; margin-right: 4px !important;">' +
          icono('ver', 18) + 'Vista previa local · ver como</span>' +
          Object.keys(ROLES).map(function(rol) {
            return '<button data-preview-rol="' + rol + '" style="cursor: pointer; border: 1px solid #333c4d; border-radius: 6px; padding: 3px 10px; font-family: inherit; font-weight: 600; font-size: 12px;">' + rol + '</button>';
          }).join('') +
          '<select id="selector-estudiante-prueba" aria-label="Estudiante de prueba" style="margin-left: auto; max-width: 100%; height: 28px; border-radius: 6px; border: 1px solid #333c4d; background: #0b0e14; color: #ffffff; font-family: inherit; font-size: 12px;">' +
          ids.map(function(x) { return '<option value="' + escapar(x.id) + '">' + escapar(x.nombre) + '</option>'; }).join('') + '</select>';
        var aviso = $('aviso-datos-detalle');
        aviso.parentNode.insertBefore(barra, aviso.nextSibling);
      }

      // ---------------------------------------------------------
      // CARGA SEGÚN #usuario
      // ---------------------------------------------------------
      // "usuario=<número>" entero, en el hash o en la consulta. Devuelve null si no está y '' si está pero no es un número
      function usuarioDeUrl() {
        var texto = window.location.hash.replace(/^#/, '') + '&' + window.location.search.replace(/^\?/, '');
        var hallado = null;
        texto.split('&').forEach(function(par) {
          var kv = par.split('=');
          if (kv[0] !== 'usuario' || hallado) return;
          hallado = /^\d+$/.test(kv[1] || '') ? kv[1] : '';
        });
        return hallado;
      }

      function mostrarUsuario() {
        // Un modal abierto es del estudiante anterior
        if (modal) cerrarModal(true);
        var deUrl = usuarioDeUrl();
        // En la vista previa, sin parámetro se muestra un estudiante de ejemplo; un parámetro inválido no se reemplaza
        usuario = deUrl === null ? (ES_VISTA_LOCAL ? '3773' : null) : deUrl || null;
        filtroActividad = '';
        perfil = null;
        var selector = $('selector-estudiante-prueba');
        if (selector) selector.value = usuario || '';
        armarEstudiante();
        renderizar();
        // En el campus: foto y datos del perfil del curso
        if (!usaPrueba && window.M && est) {
          var pedido = usuario;
          leerPerfilMoodle(usuario).then(function(p) {
            if (pedido !== usuario) return;
            perfil = p;
            renderizar();
          }).catch(function() { /* sin perfil: quedan los datos de la base */ });
        }
      }

      function volverAlTablero() {
        if (ES_VISTA_LOCAL) window.location.href = URL_TABLERO_LOCAL;
        else if (CMID_TABLERO) window.location.href = M.cfg.wwwroot + '/mod/page/view.php?id=' + CMID_TABLERO;
        else window.history.back();
      }

      // ---------------------------------------------------------
      // DELEGACIÓN DE EVENTOS
      // ---------------------------------------------------------
      document.addEventListener('click', function(e) {
        var t = e.target;
        if (!t.closest || !t.closest('#detalle-estudiante')) return;
        if (modal) {
          var enFondo = t.id === 'modal-asignar-detalle' && pulsadoEn === t;
          if (enFondo || t.closest('#btn-cerrar-modal-asignar') || t.closest('#btn-cancelar-asignacion')) return cerrarModal();
          if (t.closest('#btn-guardar-asignacion')) return guardarAsignacion();
          return;
        }
        var btnRol = t.closest('[data-preview-rol]');
        if (btnRol) return aplicarRol(btnRol.getAttribute('data-preview-rol'));
        if (t.closest('#btn-volver-tablero')) return volverAlTablero();
        if (t.closest('#btn-abrir-asignacion')) return abrirModal(t.closest('#btn-abrir-asignacion'));
        var filtro = t.closest('[data-filtro-actividad]');
        if (filtro) {
          filtroActividad = filtro.getAttribute('data-filtro-actividad');
          renderizar();
          var nuevo = document.querySelector('[data-filtro-actividad="' + filtroActividad + '"]');
          if (nuevo) nuevo.focus();
        }
      });

      document.addEventListener('mousedown', function(e) { pulsadoEn = e.target; });

      document.addEventListener('input', function(e) {
        if (e.target.id === 'campo-motivo-asignado') ocultarError();
      });

      document.addEventListener('change', function(e) {
        if (e.target.id === 'selector-estudiante-prueba') window.location.hash = 'usuario=' + e.target.value;
        if (e.target.name === 'nivel-asignado') {
          ocultarError();
          var opciones = document.querySelectorAll('#modal-asignar-detalle [data-opcion-nivel]');
          for (var i = 0; i < opciones.length; i++) {
            var activa = opciones[i].getAttribute('data-opcion-nivel') === e.target.value;
            opciones[i].style.setProperty('border-color', activa ? '#026bd4' : 'rgba(194, 201, 214, 0.4)', 'important');
            opciones[i].style.setProperty('background-color', activa ? '#e5f2ff' : 'transparent', 'important');
          }
        }
      });

      document.addEventListener('keydown', function(e) {
        var t = e.target;
        if (modal && e.key === 'Escape') { e.preventDefault(); return cerrarModal(); }
        // Tab dentro del modal: no sale de la caja (tampoco si el foco quedó afuera, por un clic en un texto)
        if (modal && e.key === 'Tab') {
          var foco = document.querySelectorAll('#caja-modal-asignar input, #caja-modal-asignar textarea, #caja-modal-asignar [role="button"]');
          var primero = foco[0], ultimo = foco[foco.length - 1];
          if (!$('caja-modal-asignar').contains(document.activeElement)) { e.preventDefault(); (e.shiftKey ? ultimo : primero).focus(); }
          else if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
          else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
          return;
        }
        if ((e.key === 'Enter' || e.key === ' ') && t.closest && t.closest('#detalle-estudiante') && t.getAttribute('role') === 'button') {
          e.preventDefault();
          t.click();
        }
      });

      window.addEventListener('hashchange', mostrarUsuario);

      // ---------------------------------------------------------
      // INICIO
      // ---------------------------------------------------------
      var huecos = document.querySelectorAll('#detalle-estudiante [data-icono]');
      for (var h = 0; h < huecos.length; h++) huecos[h].innerHTML = icono(huecos[h].getAttribute('data-icono'), 20);
      if (usaPrueba) $('aviso-datos-detalle').style.setProperty('display', 'flex', 'important');
      if (ES_VISTA_LOCAL) crearBarraPreview();
      aplicarRol(ROL_INICIAL);
      cargarDatos().then(function(d) {
        datos = d;
        if (incompletas.length) {
          $('txt-aviso-detalle').innerHTML = '<b style="font-weight: 600 !important;">Lectura incompleta.</b> ' + escapar(incompletas.join(', ')) +
            ': la base tiene más entradas que las que lee la Página Tools, así que puede faltar parte de la trayectoria.';
          $('aviso-datos-detalle').style.setProperty('display', 'flex', 'important');
        }
        mostrarUsuario();
      }).catch(function(e) {
        $('contenido-detalle').innerHTML = '<div style="padding: 24px !important; color: #910808 !important;">No se pudieron leer las bases: ' + escapar(e.message) + '</div>';
      });
    })();
  </script>
  </nolink>
</div>
