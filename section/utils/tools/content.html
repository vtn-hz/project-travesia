      // ---------------------------------------------------------
      // BASE CRITICIDAD: SEMÁFORO, ÍNDICE TOTAL Y ALTA DE UNA ENTRADA AUTOMÁTICA (LA USAN LA COPIA Y CriticidadNotas)
      // ---------------------------------------------------------
      // Semáforo del índice total: los mismos cortes que el ICE y el modelo de las encuestas
      var CORTES_SEMAFORO = { amarillo: 40, rojo: 70 };
      // Grupos de fuentes para indice_total: materias es un recálculo de las notas, y omision ocupa el lugar de la encuesta no respondida
      var GRUPO_FUENTE = { notas_1ro: 'notas', materias: 'notas', respuestas: 'encuestas', omision: 'encuestas' };

      function semaforoDe(indice) {
        if (typeof indice !== 'number' || !isFinite(indice)) return null;
        return indice >= CORTES_SEMAFORO.rojo ? 'rojo' : indice >= CORTES_SEMAFORO.amarillo ? 'amarillo' : 'verde';
      }

      function tiempoDe(iso) {
        var t = new Date(iso).getTime();
        return isFinite(t) ? t : 0;
      }

      // indice_total = PROMEDIO DEL ÚLTIMO ÍNDICE DE CADA GRUPO DE FUENTES DEL ESTUDIANTE EN EL PERÍODO, CONTANDO LA ENTRADA NUEVA.
      // Solo entradas automáticas: las manuales no cambian el calculado (el tablero muestra los dos)
      function indiceTotal(nueva, propias) {
        var ultimas = {};
        propias.concat([nueva]).forEach(function(c) {
          var grupo = GRUPO_FUENTE[c.fuente];
          var indice = numeroMoodle(c.indice);
          if (!grupo || c.origen !== 'automatica' || String(c.periodo) !== String(nueva.periodo) || indice === null) return;
          var t = c === nueva ? Infinity : tiempoDe(c.created_at);
          if (!ultimas[grupo] || t >= ultimas[grupo].t) ultimas[grupo] = { indice: indice, t: t };
        });
        var valores = Object.keys(ultimas).map(function(g) { return ultimas[g].indice; });
        return valores.length ? Math.round(valores.reduce(function(a, b) { return a + b; }, 0) / valores.length) : null;
      }

      // AGREGA UNA ENTRADA AUTOMÁTICA: LEE LAS ENTRADAS PROPIAS (CON "REQUIERE APROBACIÓN", LAS DEL ESTUDIANTE), CALCULA indice_total
      // Y semaforo, Y LA GUARDA. base: { leer(idUsuario), guardar(entrada) }. opciones.yaEsta(entrada): no guardar si ya hay una así
      function registrarCriticidad(base, entrada, opciones) {
        return base.leer(entrada.id_usuario).then(function(propias) {
          if (opciones && opciones.yaEsta && propias.some(opciones.yaEsta)) return null;
          entrada.indice_total = indiceTotal(entrada, propias);
          entrada.semaforo = semaforoDe(entrada.indice_total);
          return base.guardar(entrada).then(function() { return entrada; });
        });
      }

      // =========================================================
      // HERRAMIENTA IndiceNotasPrimero: ÍNDICE DE 0 A 100 DE LAS NOTAS DE 1.ER AÑO DE UN ESTUDIANTE
      // =========================================================
      // Es la fórmula del Dashboard Estudiantes de Primero (section/dashboard_estudiantes_primero), que la creó el equipo, documentada en
      // docs/models/criticidad/MODELO_CRITICIDAD_NOTAS_PRIMERO.md (provisoria). Por materia, ICm = (35 % FP + 35 % FR + 15 % FA + 15 % FAC) × 100:
      //   FP = (10 − promedio de lo rendido) ÷ 10 · FR = 1 − aprobados ÷ rendidos · FA = ausentes ÷ instancias · FAC = 1 si la materia es
      //   crítica y alguna nota está debajo de su umbral (4 si no tiene).
      // Por estudiante, ICG = 60 % el promedio de sus ICm + 40 % el ICm más alto. Un recuperatorio (recupera_a) reemplaza la instancia que indica.
      // parciales: [{ materia, instancia, nota, estado, recupera_a }]; materias: [{ materia, es_critica, umbral }] (Carga_Materias_Primero)
      function normalizarMateria(s) {
        return String(s || '').toLowerCase().replace(/[\s_-]/g, '');
      }

      function IndiceNotasPrimero(parciales, materias) {
        var grupos = {};
        (parciales || []).forEach(function(r) {
          var clave = normalizarMateria(r.materia);
          if (!clave) return;
          var g = grupos[clave] || (grupos[clave] = { materia: String(r.materia).trim(), instancias: {} });
          var reemplaza = String(r.recupera_a || '').trim();
          var instancia = String(r.instancia || '').trim();
          if (reemplaza) g.instancias[reemplaza] = { nota: r.nota, estado: r.estado };
          else if (!g.instancias[instancia]) g.instancias[instancia] = { nota: r.nota, estado: r.estado };
        });
        var detalle = Object.keys(grupos).map(function(clave) {
          var g = grupos[clave];
          var programados = 0, rendidos = 0, ausencias = 0, aprobados = 0, suma = 0, notas = [];
          Object.keys(g.instancias).forEach(function(k) {
            var inst = g.instancias[k];
            var estado = String(inst.estado || '').toLowerCase();
            var nota = numeroMoodle(inst.nota);
            programados++;
            if (estado.indexOf('ausente') !== -1 || nota === null) { ausencias++; return; }
            rendidos++;
            suma += nota;
            notas.push(nota);
            if (estado.indexOf('aprobado') !== -1 && estado.indexOf('des') === -1) aprobados++;
          });
          var info = (materias || []).filter(function(m) { return normalizarMateria(m.materia) === clave; })[0];
          var critica = !!info && ['S', 'SI', 'SÍ', 'TRUE', '1'].indexOf(String(info.es_critica || '').trim().toUpperCase()) !== -1;
          var umbral = info ? numeroMoodle(info.umbral) : null;
          if (umbral === null || umbral === 0) umbral = 4;
          var promedio = rendidos ? suma / rendidos : 0;
          var pctAprobados = rendidos ? aprobados / rendidos * 100 : 0;
          var pctAusentismo = programados ? ausencias / programados * 100 : 0;
          var alerta = critica && notas.some(function(n) { return n < umbral; });
          var icm = (0.35 * Math.max(0, (10 - promedio) / 10) + 0.35 * (1 - pctAprobados / 100) + 0.15 * (pctAusentismo / 100) + 0.15 * (alerta ? 1 : 0)) * 100;
          return {
            materia: g.materia, promedio: Math.round(promedio * 100) / 100, pct_aprobados: Math.round(pctAprobados * 10) / 10,
            pct_ausentismo: Math.round(pctAusentismo * 10) / 10, alerta_critica: alerta, icm: Math.min(100, Math.round(icm * 10) / 10)
          };
        });
        if (!detalle.length) return { indice: null, materias: [] };
        var icms = detalle.map(function(d) { return d.icm; });
        var icg = 0.6 * (icms.reduce(function(a, b) { return a + b; }, 0) / icms.length) + 0.4 * Math.max.apply(null, icms);
        return { indice: Math.min(100, Math.round(icg)), materias: detalle };
      }

      // =========================================================
      // HERRAMIENTA CriticidadNotas: AL GUARDAR UNA NOTA EN Carga_Parciales_Primero, AGREGA LA CRITICIDAD DE LAS NOTAS A CRITICIDAD
      // =========================================================
      // La llama la plantilla "Javascript personalizado" de Carga_Parciales_Primero (data/moodle/plantillas/carga_parciales_primero/jstemplate.js),
      // que Moodle carga también en el formulario de alta y edición (mod/data/edit.php). Desde el 2026-11-01 cada estudiante carga sus notas.
      //   CriticidadNotas({ form, boton }) → guarda la nota con fetch (el DNI vacío se completa con el de la cuenta), lee las notas del
      //     estudiante en el período y los umbrales de Carga_Materias_Primero, agrega la entrada (fuente notas_1ro, rid_fuente = la nota)
      //     y sigue a la página que muestra Moodle. Si la nota no se guardó (error de validación), repite el envío normal para que Moodle
      //     muestre el error. Si falla la criticidad, queda pendiente y se reintenta en la próxima página de la base.
      //   CriticidadNotas({ rid }) → para una página propia que guarda la nota por su cuenta (sin el formulario de Moodle): con el rid de
      //     la nota ya guardada, calcula y agrega la entrada. Devuelve una promesa de la entrada (null si no hay notas en el período).
      //     Si falla, queda pendiente y la promesa se rechaza (docs/specs/carga-parciales-primero.md).
      //   CriticidadNotas({}) → solo reintenta las pendientes.
      // El período de una nota sale de su fecha: enero a julio → AAAA-1, agosto a diciembre → AAAA-2 (provisorio).
      var COLUMNAS_PARCIALES = ['dni', 'estudiante', 'materia', 'instancia', 'fecha', 'nota', 'estado', 'recupera_a'];
      var COLUMNAS_MATERIAS_PRIMERO = ['materia', 'es_critica', 'umbral'];
      var ESPERA_NOTAS = 8000; // milisegundos que se espera la criticidad antes de seguir a la página de Moodle

      function periodoDeFecha(fecha) {
        var m = String(fecha || '').match(/^(\d{4})-(\d{2})/);
        return m ? m[1] + '-' + (Number(m[2]) <= 7 ? 1 : 2) : null;
      }

      // NOTAS DEL ESTUDIANTE EN EL PERÍODO ACTUAL Y MATERIAS DE 1.ER AÑO (LAS PLANTILLAS DE LISTA DEL REPO: UNA CELDA POR CAMPO)
      function leerNotasPropias(dni) {
        return Promise.all([
          LeerBase({ dataid: DATAID_PARCIALES_PRIMERO, filas: 'tr[data-tipo="entrada_parcial"]', columnas: COLUMNAS_PARCIALES }),
          LeerBase({ dataid: DATAID_MATERIAS_PRIMERO, filas: 'tr[data-tipo="entrada_materia"]', columnas: COLUMNAS_MATERIAS_PRIMERO })
        ]).then(function(r) {
          return {
            parciales: r[0].entradas.map(function(e) { return e.campos; }).filter(function(c) {
              return String(c.dni || '').trim() === dni && periodoDeFecha(c.fecha) === PERIODO_ACTUAL;
            }),
            materias: r[1].entradas.map(function(e) { return e.campos; })
          };
        });
      }

      // CALCULA Y AGREGA LA ENTRADA DE LAS NOTAS DEL ESTUDIANTE (rid: LA NOTA QUE LA DISPARÓ)
      function criticidadDeNotas(rid) {
        return leerUsuarioMoodle().then(function(u) {
          if (!u.dni) throw new Error('No se pudo leer el DNI de la cuenta.');
          return leerNotasPropias(u.dni).then(function(datos) {
            var calculo = IndiceNotasPrimero(datos.parciales, datos.materias);
            if (calculo.indice === null) return null; // sin notas en el período: no hay nada que registrar
            return registrarCriticidad(baseCriticidadMoodle, {
              id_usuario: u.id, dni: u.dni, periodo: PERIODO_ACTUAL, origen: 'automatica', fuente: 'notas_1ro', rid_fuente: rid,
              indice: calculo.indice, indice_total: null, semaforo: null, motivo: '', created_at: ahoraIso()
            });
          });
        });
      }

      // CAMPO DEL FORMULARIO DE ALTA POR SU ETIQUETA (EN MINÚSCULAS)
      function campoPorEtiqueta(form, etiqueta) {
        var l = Array.prototype.filter.call(form.querySelectorAll('label[for]'), function(x) {
          return x.textContent.replace(/\s+/g, ' ').trim().toLowerCase() === etiqueta;
        })[0];
        return l ? form.querySelector('#' + CSS.escape(l.getAttribute('for'))) : null;
      }

      // ENVÍO NORMAL DEL FORMULARIO, CON EL BOTÓN PRESIONADO COMO CAMPO OCULTO
      function enviarNormal(form, boton) {
        if (boton && boton.name) {
          var h = document.createElement('input');
          h.type = 'hidden';
          h.name = boton.name;
          h.value = boton.value;
          form.appendChild(h);
        }
        form.setAttribute('data-zk-notas', 'enviando');
        HTMLFormElement.prototype.submit.call(form);
      }

      function CriticidadNotas(opciones) {
        var form = opciones && opciones.form, boton = opciones && opciones.boton;
        if (!(window.M && M.cfg && M.cfg.wwwroot)) return Promise.reject(new Error('CriticidadNotas solo funciona dentro de Moodle.'));
        if (opciones && opciones.rid) {
          var ridNota = Number(opciones.rid);
          return conLimite(criticidadDeNotas(ridNota), ESPERA_NOTAS, 'La criticidad de las notas').catch(function(e) {
            agregarCriticidadPendiente({ id_usuario: Number(M.cfg.userId), periodo: PERIODO_ACTUAL, origen: 'automatica', fuente: 'notas_1ro', rid_fuente: ridNota, indice: null });
            throw e;
          });
        }
        if (!form) return reintentarCriticidadPendiente();
        var d = form.querySelector('input[name="d"]');
        if (!d || Number(d.value) !== DATAID_PARCIALES_PRIMERO) { enviarNormal(form, boton); return Promise.resolve(null); }
        // "Guardar y agregar otra" no devuelve el rid: se guarda con "Guardar y ver" y después se abre un formulario vacío
        var otra = !!boton && boton.name === 'saveandadd';
        return leerUsuarioMoodle().then(function(u) {
          var dni = campoPorEtiqueta(form, 'dni');
          if (dni && !String(dni.value || '').trim() && u.dni) dni.value = u.dni;
          var fd = new FormData(form);
          fd.delete('saveandadd');
          fd.set(otra || !boton || !boton.name ? 'saveandview' : boton.name, otra || !boton ? 'Guardar' : boton.value);
          return fetch(form.action, { method: 'POST', body: fd, credentials: 'same-origin' });
        }).then(function(r) {
          var m = (r.url || '').match(/[?&]rid=(\d+)/);
          if (!r.ok || !m) { enviarNormal(form, boton); return null; } // Moodle no la guardó: que muestre el error
          var rid = Number(m[1]);
          var destino = otra ? M.cfg.wwwroot + '/mod/data/edit.php?d=' + DATAID_PARCIALES_PRIMERO : r.url;
          return conLimite(criticidadDeNotas(rid), ESPERA_NOTAS, 'La criticidad de las notas')
            .catch(function() {
              agregarCriticidadPendiente({ id_usuario: Number(M.cfg.userId), periodo: PERIODO_ACTUAL, origen: 'automatica', fuente: 'notas_1ro', rid_fuente: rid, indice: null });
            })
            .then(function() { window.location.href = destino; return rid; });
        });
      }

      // =========================================================
      // HERRAMIENTA LeerBase: TODAS LAS ENTRADAS DE UNA BASE DE DATOS DE MOODLE, PÁGINA POR PÁGINA
      // =========================================================
      // Moodle lista las entradas de a "perpage" por página ("page" empieza en 0) y no informa el total: se pide página por página
      // hasta que una trae menos entradas que porPagina (o la barra de páginas no tiene una siguiente). Formatos de la plantilla de lista:
      //   'propio'   → filas .zk-registro con una celda data-campo por campo (plantillas del repo)
      //   'columnas' → filas de otra plantilla (opciones.filas) con una celda por campo, en el orden de opciones.columnas
      //   'defecto'  → la plantilla de Moodle por defecto (filas "campo | valor")
      // Moodle guarda "perpage" como preferencia del usuario para esa base. Guía: section/utils/README.md
      var LEER_BASE_OPCIONES = { porPagina: 500, paralelo: 1, maximo: 20000 };

      // TEXTO DE UNA CELDA, CON LOS SALTOS DE LÍNEA DE LOS <br> Y DE LOS PÁRRAFOS
      function textoCelda(el) {
        var c = el.cloneNode(true);
        c.querySelectorAll('br').forEach(function(br) { br.replaceWith('\n'); });
        c.querySelectorAll('p, div').forEach(function(x) { x.append('\n'); });
        return c.textContent.replace(/ +\n/g, '\n').trim();
      }

      // rid DE UNA ENTRADA: data-rid, o el de un enlace de la entrada (Mostrar más, Editar o Borrar)
      function ridDe(el) {
        if (el.getAttribute('data-rid')) return el.getAttribute('data-rid');
        var a = el.querySelector('a[href*="rid="], a[href*="delete="]');
        var m = a ? (a.getAttribute('href') || '').match(/[?&](?:rid|delete)=(\d+)/) : null;
        return m ? m[1] : null;
      }

      // ENTRADAS DE UNA PÁGINA DEL LISTADO: { formato, entradas: [{ rid, campos }] }
      function entradasDePagina(doc, o) {
        var zona = doc.querySelector('#region-main') || doc.querySelector('[role="main"]') || doc.body;
        var lista = function(nodos, leer) { return Array.prototype.map.call(nodos, leer); };
        if (o.filas) {
          return { formato: 'columnas', entradas: lista(zona.querySelectorAll(o.filas), function(f) {
            var campos = {};
            var celdas = f.querySelectorAll(':scope > td');
            o.columnas.forEach(function(nombre, i) { if (nombre && celdas[i]) campos[nombre] = textoCelda(celdas[i]); });
            return { rid: ridDe(f), campos: campos };
          }) };
        }
        var propias = zona.querySelectorAll('.zk-registro');
        if (propias.length) {
          return { formato: 'propio', entradas: lista(propias, function(f) {
            var campos = {};
            f.querySelectorAll('[data-campo]').forEach(function(c) { campos[c.getAttribute('data-campo')] = textoCelda(c); });
            var e = { rid: ridDe(f), campos: campos };
            if (f.hasAttribute('data-alta')) e.alta = Number(f.getAttribute('data-alta')) || f.getAttribute('data-alta');
            if (f.hasAttribute('data-modificada')) e.modificada = Number(f.getAttribute('data-modificada')) || f.getAttribute('data-modificada');
            return e;
          }) };
        }
        var defecto = zona.querySelectorAll('.defaulttemplate-listentry');
        return { formato: defecto.length ? 'defecto' : null, entradas: lista(defecto, function(e) {
          var campos = {};
          e.querySelectorAll('.defaulttemplate-list-body .row').forEach(function(fila) {
            if (fila.children.length >= 2) campos[fila.children[0].textContent.trim()] = textoCelda(fila.children[1]);
          });
          return { rid: ridDe(e), campos: campos };
        }) };
      }

      // ÚLTIMA PÁGINA ENLAZADA EN LA BARRA DE PÁGINAS (null SI NO HAY BARRA)
      function ultimaEnlazada(doc) {
        var nums = [];
        doc.querySelectorAll('.pagination a[href], .paging a[href]').forEach(function(a) {
          var m = (a.getAttribute('href') || '').match(/[?&]page=(\d+)/);
          if (m) nums.push(Number(m[1]));
        });
        return nums.length ? Math.max.apply(null, nums) : null;
      }

      // ERROR DE LA PÁGINA: SESIÓN VENCIDA O SIN PERMISO PARA VER LA BASE (null SI LA PÁGINA ES EL LISTADO)
      function errorDePagina(r, doc) {
        if (/\/login\/index\.php/.test(r.url || '') || doc.querySelector('form#login')) return 'La sesión de Moodle venció: hay que volver a entrar.';
        var e = doc.querySelector('.errorbox .errormessage, .errormessage');
        return e ? 'Moodle no muestra la base: ' + e.textContent.trim() : null;
      }

      // ---------------------------------------------------------
      // FUNCIÓN: LeerBase({ dataid | cmid, porPagina, paralelo, maximo, filas, columnas, filtro, alAvanzar })
      //   → Promise de { entradas: [{ rid, campos }], formato, paginas, completa }
      // ---------------------------------------------------------
      function LeerBase(opciones) {
        var o = {};
        Object.keys(LEER_BASE_OPCIONES).forEach(function(k) { o[k] = LEER_BASE_OPCIONES[k]; });
        Object.keys(opciones || {}).forEach(function(k) { if (opciones[k] !== undefined && opciones[k] !== null) o[k] = opciones[k]; });
        var raizMoodle = o.urlBase || (window.M && M.cfg && M.cfg.wwwroot);
        if (!raizMoodle) return Promise.reject(new Error('LeerBase solo funciona dentro de Moodle.'));
        if (!o.dataid && !o.cmid) return Promise.reject(new Error('LeerBase necesita dataid o cmid.'));
        if (o.filas && !(Array.isArray(o.columnas) && o.columnas.length)) return Promise.reject(new Error('Con "filas" hay que pasar "columnas".'));
        var porPagina = Math.max(1, Math.floor(o.porPagina));
        var paralelo = Math.max(1, Math.floor(o.paralelo));
        var tope = Math.ceil(o.maximo / porPagina) + 1; // páginas como mucho, aunque Moodle siga devolviendo páginas llenas
        var resultado = { entradas: [], formato: null, paginas: 0, completa: true };
        var vistos = {};
        var leidas = 0;
        var ultimaVista = null; // la última página que mostró la barra: no se piden páginas más allá

        function pedir(n) {
          var url = raizMoodle + '/mod/data/view.php?' + (o.dataid ? 'd=' + o.dataid : 'id=' + o.cmid) + '&perpage=' + porPagina + '&page=' + n;
          return fetch(url, { credentials: 'same-origin' }).then(function(r) {
            if (!r.ok) throw new Error('Moodle respondió HTTP ' + r.status + ' en la página ' + (n + 1) + ' de la base.');
            return r.text().then(function(html) {
              var doc = new DOMParser().parseFromString(html, 'text/html');
              var error = errorDePagina(r, doc);
              if (error) throw new Error(error);
              var p = entradasDePagina(doc, o);
              p.ultima = ultimaEnlazada(doc);
              return p;
            });
          });
        }

        // Si la base cambia mientras se lee, una entrada puede pasar de una página a otra: se cuenta una sola vez
        function procesar(n, p) {
          resultado.paginas++;
          if (p.formato && !resultado.formato) resultado.formato = p.formato;
          if (p.ultima !== null) ultimaVista = Math.max(ultimaVista === null ? -1 : ultimaVista, p.ultima);
          p.entradas.forEach(function(e) {
            if (e.rid && vistos[e.rid]) return;
            if (e.rid) vistos[e.rid] = true;
            leidas++;
            if (leidas <= o.maximo && (!o.filtro || o.filtro(e))) resultado.entradas.push(e);
          });
          if (o.alAvanzar) { try { o.alAvanzar(leidas, n + 1); } catch (e) { /* el aviso de progreso no corta la lectura */ } }
        }

        // La primera página se pide sola (formato y errores); las siguientes, de a "paralelo", sin pasar de la última que mostró la barra
        function desde(n) {
          var hasta = n + (n === 0 ? 1 : paralelo);
          if (ultimaVista !== null) hasta = Math.max(n + 1, Math.min(hasta, ultimaVista + 1));
          var lote = [];
          for (var k = n; k < hasta && k < tope; k++) lote.push(k);
          return Promise.all(lote.map(pedir)).then(function(paginas) {
            for (var i = 0; i < paginas.length; i++) {
              procesar(lote[i], paginas[i]);
              var hayMas = paginas[i].entradas.length === porPagina && (paginas[i].ultima === null || paginas[i].ultima > lote[i]);
              if (!hayMas) return resultado;
              if (leidas >= o.maximo) { resultado.completa = false; return resultado; }
            }
            var proxima = lote[lote.length - 1] + 1;
            if (proxima >= tope) { resultado.completa = false; return resultado; }
            return desde(proxima);
          });
        }
        return desde(0);
      }

      // ---------------------------------------------------------
      // EXPORTACIÓN
      // ---------------------------------------------------------
      window.ZhakyzTools = {
        version: VERSION,
        CopiaRespuestas: CopiaRespuestas,
        CriticidadEncuesta: CriticidadEncuesta,
        IndiceNotasPrimero: IndiceNotasPrimero,
        CriticidadNotas: CriticidadNotas,
        LeerBase: LeerBase
      };
      // Aviso para las vistas que usan las herramientas desde su código (cargador de tools con TOOL = null)
      try { document.dispatchEvent(new CustomEvent('zk-tools', { detail: window.ZhakyzTools })); } catch (e) { /* sin CustomEvent: la vista usa window.ZhakyzTools */ }
    })();
  </script>

      // ---------------------------------------------------------
      // ÍCONOS (Material Icons Outlined — Apache 2.0, skill diseno-ui)

      var ICONOS = {

        herramienta: '<path d="M22.61 18.99l-9.08-9.08c.93-2.34.45-5.1-1.44-7C9.79.61 6.21.4 3.66 2.26L7.5 6.11 6.08 7.52 2.25 3.69C.39 6.23.6 9.82 2.9 12.11c1.86 1.86 4.57 2.35 6.89 1.48l9.11 9.11c.39.39 1.02.39 1.41 0l2.3-2.3c.4-.38.4-1.01 0-1.41zm-3 1.6l-9.46-9.46c-.61.45-1.29.72-2 .82-1.36.2-2.79-.21-3.83-1.25C3.37 9.76 2.93 8.5 3 7.26l3.09 3.09 4.24-4.24-3.09-3.09c1.24-.07 2.49.37 3.44 1.31 1.08 1.08 1.49 2.57 1.24 3.96-.12.71-.42 1.37-.88 1.96l9.45 9.45-.88.89z"/>'
      };

      function icono(nombre, tamano) {
        var t = tamano || 20;
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' + t + '" height="' + t +
          '" fill="currentColor" aria-hidden="true" focusable="false" style="display: block !important; flex: 0 0 auto !important;">' +
          ICONOS[nombre] + '<\/svg>';
      }

      function escapar(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
          return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
        });
      }

      // ---------------------------------------------------------
      // BIBLIOTECA: SE EJECUTA EL SCRIPT MUERTO DE ESTA MISMA PÁGINA PARA LISTAR SUS HERRAMIENTAS
      // ---------------------------------------------------------
      function biblioteca() {
        if (!window.ZhakyzTools) {
          var s = document.createElement('script');

      // ---------------------------------------------------------

        document.getElementById('menu-tools').innerHTML =
          '<span style="display: inline-flex !important; align-items: center !important; gap: 8px !important; font-weight: 500 !important;">' + icono('herramienta', 18) + 'Tools</span>' +

          '<div style="display: flex !important; flex-direction: column !important; gap: 12px !important;">' +
          vigentes.map(function(t) {

            return '<div style="padding: 16px !important; background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important;">' +

              (d.carga ? '<code style="display: block !important; margin-top: 6px !important; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important; font-size: 12px !important; color: #47536b !important; background: none !important; padding: 0 !important; word-break: break-all !important;">' + escapar(d.carga) + '</code>' : '') +
