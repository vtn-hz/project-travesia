  <!-- SCRIPT DE MANEJO DE EVENTOS -->
  <script>
    (function() {

        var styleEl = document.createElement('style');

      var ROL_INICIAL = 'ADM';
      var ES_VISTA_LOCAL = window.location.protocol === 'file:' ||
        /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
      // Las líneas "// @config" se copian de moodle.config.json con sincronizar_config.js: no editarlas a mano
      // Banco de preguntas (base de Zhakyz, data/moodle/BASE_ENCUESTAS.json)

      // Composición de las encuestas (data/moodle/BASE_ENCUESTAS_ARMADO.json): null hasta que se cree
      var CMID_ARMADO = null; // @config bases.armado.cmid
      var DATAID_ARMADO = null; // @config bases.armado.dataid

      var ROLES = {
        ADM: { nombre: 'Administrador', puedeEditar: true },
        GES: { nombre: 'Gestor Dpto. Industrial', puedeEditar: false }
      };

      var ENCUESTAS = {
        inicial: { etiqueta: 'Encuesta inicial', frecuencia: 'Se responde una sola vez, al empezar 2.º año (actualizable).', tituloPorDefecto: 'Encuesta inicial' },
        cuatrimestral: { etiqueta: 'Encuesta cuatrimestral', frecuencia: 'Se responde al cierre de cada cuatrimestre, desde 2.º año.', tituloPorDefecto: 'Encuesta cuatrimestral' }

      var TIPOS = {
        'texto': 'Texto libre',
        'numero': 'Número',
        'seleccion unica': 'Selección única',
        'seleccion multiple': 'Selección múltiple'

      // ---------------------------------------------------------
      // ÍCONOS (Material Icons Outlined — Apache 2.0, skill diseno-ui)
      // ---------------------------------------------------------
      var ICONOS = {
        alerta: '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>',
        info: '<path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>',
        buscar: '<path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>',
        agregar: '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>',
        quitar: '<path d="M7 11v2h10v-2H7zm5-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>',
        subir: '<path d="m4 12 1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>',
        bajar: '<path d="m20 12-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/>',
        arrastrar: '<path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>',
        guardar: '<path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM6 6h9v4H6z"/>',
        lista: '<path d="M22 7h-9v2h9V7zm0 8h-9v2h9v-2zM5.54 11 2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19z"/>',
        ver: '<path d="M12 6a9.77 9.77 0 0 1 8.82 5.5C19.17 14.87 15.79 17 12 17s-7.17-2.13-8.82-5.5A9.77 9.77 0 0 1 12 6m0-2C7 4 2.73 7.11 1 11.5 2.73 15.89 7 19 12 19s9.27-3.11 11-7.5C21.27 7.11 17 4 12 4zm0 5a2.5 2.5 0 0 1 0 5 2.5 2.5 0 0 1 0-5m0-2c-2.48 0-4.5 2.02-4.5 4.5S9.52 16 12 16s4.5-2.02 4.5-4.5S14.48 7 12 7z"/>',
        cerrar: '<path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>',
        estudiante: '<path d="M12 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 10c2.7 0 5.8 1.29 6 2H6c.23-.72 3.31-2 6-2m0-12C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 10c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>',
        ok: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm4.59-12.42L10 14.17l-2.59-2.58L6 13l4 4 8-8z"/>',
        horario: '<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>'
      };

      function icono(nombre, tamano) {
        var t = tamano || 20;
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' + t + '" height="' + t +
          '" fill="currentColor" aria-hidden="true" focusable="false" style="display: block !important; flex: 0 0 auto !important;">' +
          ICONOS[nombre] + '<\/svg>';
      }

      // ---------------------------------------------------------
      // DATOS DE PRUEBA (SOLO EN VISTA LOCAL)
      // ---------------------------------------------------------
      var PREGUNTAS_PRUEBA = [
        { id: 1, pregunta: '¿Trabajás actualmente?', tipo: 'seleccion unica', opciones: ['No', 'Sí, hasta 20 horas semanales', 'Sí, más de 20 horas semanales'] },
        { id: 2, pregunta: '¿Cuántas materias estás cursando este cuatrimestre?', tipo: 'numero', opciones: ['0-0', '1-2', '3-'] },
        { id: 3, pregunta: '¿Qué dificultades tuviste este cuatrimestre?', tipo: 'seleccion multiple', opciones: ['Horarios', 'Contenidos de las materias', 'Económicas', 'Personales o familiares', 'Ninguna'] },
        { id: 4, pregunta: '¿Cómo te sentís con la carrera?', tipo: 'seleccion unica', opciones: ['Muy conforme', 'Conforme', 'Poco conforme', 'Estoy pensando en dejarla'] },
        { id: 5, pregunta: '¿Querés contarnos algo más?', tipo: 'texto', opciones: [] },
        { id: 6, pregunta: '¿Es tu primera carrera universitaria?', tipo: 'seleccion unica', opciones: ['Sí', 'No'] },
        { id: 7, pregunta: '¿Tenés computadora propia para estudiar?', tipo: 'seleccion unica', opciones: ['Sí', 'Compartida', 'No'] },
        { id: 8, pregunta: '¿Cuánto tardás en llegar a la facultad?', tipo: 'seleccion unica', opciones: ['Menos de 30 minutos', 'Entre 30 y 60 minutos', 'Más de 1 hora'] }
      ];
      var ARMADO_PRUEBA = {
        inicial: { rid: null, titulo: 'Encuesta inicial', descripcion: 'Contanos un poco sobre vos. Se completa una sola vez.', preguntas: [6, 1, 7, 8] },
        cuatrimestral: { rid: null, titulo: 'Encuesta cuatrimestral', descripcion: '¿Cómo te fue este cuatrimestre? Te lleva menos de 5 minutos.', preguntas: [2, 3, 4, 5] }
      };

      // ---------------------------------------------------------
      // ACCESO A DATOS (PLANTILLA POR DEFECTO DE MOODLE, SIN CAMBIAR NADA)
      // ---------------------------------------------------------
      function textoConLineas(el) {
        var copia = el.cloneNode(true);
        copia.querySelectorAll('br').forEach(function(br) { br.replaceWith('\n'); });
        copia.querySelectorAll('p, div').forEach(function(p) { p.append('\n'); });
        return copia.textContent.replace(/\n{2,}/g, '\n').trim();
      }

      // ENTRADAS DE UNA BASE CON PLANTILLA POR DEFECTO: [{ rid, valores: { campo: texto } }]
      function leerBase(cmid) {
        return fetch(M.cfg.wwwroot + '/mod/data/view.php?id=' + cmid + '&perpage=1000', { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            return Array.prototype.map.call(doc.querySelectorAll('.defaulttemplate-listentry'), function(entrada) {
              var valores = {};
              entrada.querySelectorAll('.defaulttemplate-list-body .row').forEach(function(fila) {
                if (fila.children.length >= 2) valores[fila.children[0].textContent.trim().toLowerCase()] = textoConLineas(fila.children[1]);
              });
              var editar = entrada.querySelector('a[href*="edit.php"][href*="rid="]');
              return { rid: editar ? (editar.href.match(/[?&]rid=(\d+)/) || [])[1] : null, valores: valores };
            });
          });
      }

      function leerBancoMoodle() {
        return leerBase(CMID_PREGUNTAS).then(function(entradas) {
          return entradas.map(function(e) {
            return { id: parseInt(e.valores.id, 10), pregunta: e.valores.pregunta || '', tipo: e.valores.tipo || 'texto', opciones: (e.valores.respuestas || '').split('\n').filter(Boolean) };
          }).filter(function(p) { return !isNaN(p.id); });
        });
      }

      function leerArmadoMoodle() {
        return leerBase(CMID_ARMADO).then(function(entradas) {
          var armado = {};
          Object.keys(ENCUESTAS).forEach(function(k) { armado[k] = { rid: null, titulo: ENCUESTAS[k].tituloPorDefecto, descripcion: '', preguntas: [] }; });
          entradas.forEach(function(e) {
            var k = e.valores.encuesta;
            if (!armado[k]) return;
            armado[k] = {
              rid: e.rid, titulo: e.valores.titulo || ENCUESTAS[k].tituloPorDefecto, descripcion: e.valores.descripcion || '',
              preguntas: (e.valores.preguntas || '').split(',').map(function(s) { return parseInt(s, 10); }).filter(function(n) { return !isNaN(n); })
            };
          });
          return armado;
        });
      }

      // GUARDAR UNA ENCUESTA CON EL FORMULARIO NATIVO (CAMPOS UBICADOS POR SU ETIQUETA)
      function guardarArmadoMoodle(clave, e) {
        var url = M.cfg.wwwroot + '/mod/data/edit.php?d=' + DATAID_ARMADO + (e.rid ? '&rid=' + e.rid : '');
        return fetch(url, { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var form = Array.prototype.filter.call(doc.querySelectorAll('form'), function(f) { return f.querySelector('[name^="field_"]'); })[0];
            if (!form) throw new Error('No se encontró el formulario de la base.');
            var porCampo = {};
            form.querySelectorAll('label[for]').forEach(function(l) {
              var ctrl = form.querySelector('#' + CSS.escape(l.getAttribute('for')));
              if (ctrl && /^field_/.test(ctrl.name)) porCampo[l.textContent.replace(/\s+/g, ' ').trim().toLowerCase()] = ctrl.name;
            });
            var nombre = function(k) {
              var etiqueta = Object.keys(porCampo).filter(function(x) { return x.indexOf(k) === 0; })[0];
              if (!etiqueta) throw new Error('Falta el campo "' + k + '" en la base.');
              return porCampo[etiqueta];
            };
            var fd = new FormData(form);
            fd.set('d', String(DATAID_ARMADO));
            fd.set('rid', e.rid ? String(e.rid) : '0');
            fd.set(nombre('encuesta'), clave);
            fd.set(nombre('titulo'), e.titulo);
            fd.set(nombre('descripcion'), escapar(e.descripcion).replace(/\n/g, '<br>'));
            fd.set(nombre('preguntas'), e.preguntas.join(','));
            fd.delete('saveandadd');
            fd.set('saveandview', 'Guardar');
            return fetch(M.cfg.wwwroot + '/mod/data/edit.php', { method: 'POST', body: fd, credentials: 'same-origin' });
          })
          .then(function(r) { if (!r.ok) throw new Error('Moodle respondió ' + r.status); });
      }

      // ---------------------------------------------------------
      // ESTADO EN MEMORIA
      // ---------------------------------------------------------
      var rolActual = ROL_INICIAL;
      var banco = [];
      var armado = {}; // clave -> { rid, titulo, descripcion, preguntas: [ids] }
      var guardado = {}; // copia de lo último guardado, para detectar cambios
      var activa = 'inicial';
      var conectadoBanco = !ES_VISTA_LOCAL && !!window.M && !!CMID_PREGUNTAS;
      var conectadoArmado = conectadoBanco && !!CMID_ARMADO && !!DATAID_ARMADO;
      var arrastre = null; // { origen: 'banco' | 'encuesta', id, indice }

      // ---------------------------------------------------------
      // UTILIDADES
      // ---------------------------------------------------------
      function escapar(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
          return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
        });
      }

      function mostrar(el, visible, modo) {
        el.style.setProperty('display', visible ? (modo || 'flex') : 'none', 'important');
      }

      function pregunta(id) {
        return banco.filter(function(p) { return p.id === id; })[0];
      }

      function hayCambios(clave) {
        return JSON.stringify(armado[clave]) !== JSON.stringify(guardado[clave]);
      }

      function puedeEditar() {
        return ROLES[rolActual].puedeEditar;
      }

      function chipTipo(tipo) {
        return '<span style="display: inline-flex !important; align-items: center !important; height: 22px !important; padding: 0 8px !important; border-radius: 999px !important; border: 1px solid #dadee7 !important; background-color: #f5f6fa !important; color: #47536b !important; font-size: 11px !important; font-weight: 600 !important; white-space: nowrap !important;">' + escapar(TIPOS[tipo] || tipo) + '</span>';
      }

      var BTN_ICONO = 'width: 32px !important; height: 32px !important; border-radius: 8px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; cursor: pointer !important; color: #47536b !important; flex: 0 0 auto !important;';

      // ---------------------------------------------------------
      // RENDERIZADO
      // ---------------------------------------------------------
      function renderizarAviso() {
        var aviso = document.getElementById('aviso-datos-armado');
        var texto, fondo, borde, color, ic;
        if (!conectadoBanco) {
          fondo = '#fdf1ce'; borde = 'rgba(246, 206, 85, 0.5)'; color = '#aa8109'; ic = 'alerta';
          texto = '<b style="font-weight: 600 !important;">Datos de prueba.</b> Vista local con 8 preguntas de ejemplo: los cambios no se guardan en Moodle.';
        } else if (!conectadoArmado) {
          fondo = '#fdf1ce'; borde = 'rgba(246, 206, 85, 0.5)'; color = '#aa8109'; ic = 'alerta';
          texto = 'Las preguntas vienen del banco real, pero la base <b style="font-weight: 600 !important;">Armado de encuestas</b> todavía no existe: los cambios no se guardan.';
        } else {
          fondo = '#e5f2ff'; borde = 'rgba(77, 166, 255, 0.4)'; color = '#026bd4'; ic = 'info';
          texto = 'Conectado al banco de preguntas y a la base <b style="font-weight: 600 !important;">Armado de encuestas</b> de Zhakyz.';
        }
        aviso.style.setProperty('background-color', fondo, 'important');
        aviso.style.setProperty('border', '1px solid ' + borde, 'important');
        aviso.innerHTML = '<span style="color: ' + color + ' !important; padding-top: 1px !important;">' + icono(ic, 20) + '</span><span>' + texto + '</span>';
      }

      function renderizarPestanas() {
        document.getElementById('pestanas-encuestas').innerHTML = Object.keys(ENCUESTAS).map(function(k) {
          var sel = k === activa;
          var cambios = hayCambios(k);
          return '<div role="tab" tabindex="0" aria-selected="' + sel + '" data-accion="pestana" data-clave="' + k + '" style="display: inline-flex !important; align-items: center !important; gap: 8px !important; padding: 10px 14px !important; cursor: pointer !important; font-size: 14px !important; font-weight: ' + (sel ? '600' : '500') + ' !important; color: ' + (sel ? '#0b0e14' : '#47536b') + ' !important; border-bottom: 2px solid ' + (sel ? '#0b0e14' : 'transparent') + ' !important; margin-bottom: -1px !important;">' +
            ENCUESTAS[k].etiqueta +
            '<span style="font-size: 11px !important; font-weight: 600 !important; color: #47536b !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 0 7px !important;">' + armado[k].preguntas.length + '</span>' +
            (cambios ? '<span title="Cambios sin guardar" aria-label="Cambios sin guardar" style="width: 8px !important; height: 8px !important; border-radius: 50% !important; background-color: #c2940a !important;"></span>' : '') + '</div>';
        }).join('');
      }

      function renderizarDatos() {
        var e = armado[activa];
        var dis = puedeEditar() ? '' : ' disabled';
        var campo = 'width: 100% !important; padding: 8px 12px !important; border-radius: 8px !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; background-color: #fcfcfc !important; color: #0b0e14 !important; font-family: inherit !important; font-size: 14px !important; box-sizing: border-box !important;';
        document.getElementById('datos-encuesta').innerHTML =
          '<div style="display: flex !important; align-items: center !important; gap: 8px !important; color: #47536b !important; font-size: 12px !important;">' + icono('horario', 16) + escapar(ENCUESTAS[activa].frecuencia) + '</div>' +
          '<div><label for="campo-titulo-encuesta" style="display: block !important; font-size: 14px !important; font-weight: 500 !important; margin-bottom: 6px !important;">Título que ve el estudiante</label>' +
          '<input id="campo-titulo-encuesta" value="' + escapar(e.titulo) + '"' + dis + ' style="height: 40px !important; ' + campo + '"></div>' +
          '<div><label for="campo-descripcion-encuesta" style="display: block !important; font-size: 14px !important; font-weight: 500 !important; margin-bottom: 6px !important;">Texto introductorio</label>' +
          '<textarea id="campo-descripcion-encuesta" rows="2"' + dis + ' style="resize: vertical !important; ' + campo + '">' + escapar(e.descripcion) + '</textarea></div>';
      }

      function renderizarBanco() {
        var q = document.getElementById('filtro-banco').value.trim().toLowerCase();
        var enEncuesta = armado[activa].preguntas;
        var lista = banco.filter(function(p) { return !q || p.pregunta.toLowerCase().indexOf(q) !== -1; })
          .sort(function(a, b) { return a.id - b.id; });
        var editar = puedeEditar();
        document.getElementById('txt-total-banco').textContent = banco.length + ' preguntas';
        document.getElementById('lista-banco').innerHTML = lista.length ? lista.map(function(p) {
          var usada = enEncuesta.indexOf(p.id) !== -1;
          var arrastrable = editar && !usada;
          return '<div data-banco-id="' + p.id + '"' + (arrastrable ? ' draggable="true"' : '') + ' style="display: flex !important; align-items: center !important; gap: 8px !important; padding: 8px 8px 8px 10px !important; border: 1px solid ' + (usada ? 'rgba(194, 201, 214, 0.4)' : '#dadee7') + ' !important; border-radius: 8px !important; background-color: ' + (usada ? '#f5f6fa' : '#ffffff') + ' !important; cursor: ' + (arrastrable ? 'grab' : 'default') + ' !important;' + (usada ? ' opacity: 0.6 !important;' : '') + '">' +
            (arrastrable ? '<span style="color: #94a0b8 !important;">' + icono('arrastrar', 18) + '</span>' : '') +
            '<div style="flex: 1 1 auto !important; min-width: 0 !important;"><div style="font-size: 14px !important; font-weight: 500 !important;">' + escapar(p.pregunta) + '</div>' +
            '<div style="display: flex !important; gap: 6px !important; align-items: center !important; margin-top: 2px !important; font-size: 12px !important; color: #47536b !important;">#' + p.id + ' ' + chipTipo(p.tipo) + (usada ? ' · ya está en la encuesta' : '') + '</div></div>' +
            (arrastrable ? '<span role="button" tabindex="0" data-accion="agregar" data-id="' + p.id + '" aria-label="Agregar a la encuesta" title="Agregar a la encuesta" style="' + BTN_ICONO + ' color: #026bd4 !important;">' + icono('agregar', 20) + '</span>' : '') +
            '</div>';
        }).join('') : '<div style="padding: 16px !important; text-align: center !important; color: #47536b !important;">' + (banco.length ? 'Ninguna pregunta coincide.' : 'El banco está vacío: cargá preguntas en "Preguntas".') + '</div>';
      }

      function renderizarEncuesta() {
        var ids = armado[activa].preguntas;
        var editar = puedeEditar();
        document.getElementById('titulo-columna-encuesta').textContent = ENCUESTAS[activa].etiqueta;
        document.getElementById('txt-total-encuesta').textContent = ids.length + (ids.length === 1 ? ' pregunta' : ' preguntas');
        document.getElementById('lista-encuesta').innerHTML = ids.length ? ids.map(function(id, i) {
          var p = pregunta(id) || { id: id, pregunta: 'Pregunta ' + id + ' (ya no está en el banco)', tipo: 'texto' };
          return '<div data-encuesta-indice="' + i + '"' + (editar ? ' draggable="true"' : '') + ' style="display: flex !important; align-items: center !important; gap: 8px !important; padding: 8px 6px 8px 8px !important; border: 1px solid #dadee7 !important; border-radius: 8px !important; background-color: #ffffff !important; cursor: ' + (editar ? 'grab' : 'default') + ' !important;">' +
            (editar ? '<span style="color: #94a0b8 !important;">' + icono('arrastrar', 18) + '</span>' : '') +
            '<span style="flex: 0 0 auto !important; width: 24px !important; height: 24px !important; border-radius: 50% !important; background-color: #0b0e14 !important; color: #ffffff !important; font-size: 12px !important; font-weight: 600 !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;">' + (i + 1) + '</span>' +
            '<div style="flex: 1 1 auto !important; min-width: 0 !important;"><div style="font-size: 14px !important; font-weight: 500 !important;">' + escapar(p.pregunta) + '</div>' +
            '<div style="display: flex !important; gap: 6px !important; align-items: center !important; margin-top: 2px !important; font-size: 12px !important; color: #47536b !important;">#' + p.id + ' ' + chipTipo(p.tipo) + '</div></div>' +
            (editar ? '<span role="button" tabindex="0" data-accion="subir" data-indice="' + i + '" aria-label="Subir" title="Subir" style="' + BTN_ICONO + (i === 0 ? ' visibility: hidden !important;' : '') + '">' + icono('subir', 18) + '</span>' +
              '<span role="button" tabindex="0" data-accion="bajar" data-indice="' + i + '" aria-label="Bajar" title="Bajar" style="' + BTN_ICONO + (i === ids.length - 1 ? ' visibility: hidden !important;' : '') + '">' + icono('bajar', 18) + '</span>' +
              '<span role="button" tabindex="0" data-accion="quitar" data-indice="' + i + '" aria-label="Quitar de la encuesta" title="Quitar de la encuesta" style="' + BTN_ICONO + '">' + icono('quitar', 18) + '</span>' : '') +
            '</div>';
        }).join('') : '<div data-zona-vacia="1" style="flex: 1 1 auto !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 6px !important; min-height: 160px !important; border: 2px dashed #c2c9d6 !important; border-radius: 8px !important; color: #47536b !important; text-align: center !important; padding: 16px !important;">' +
          icono('lista', 24) + (editar ? 'Arrastrá preguntas del banco hasta acá, o usá el botón +.' : 'Esta encuesta todavía no tiene preguntas.') + '</div>';
      }

      function renderizarEstado() {
        var estado = document.getElementById('txt-estado-guardado');
        if (hayCambios(activa)) {
          estado.innerHTML = '<span style="width: 8px !important; height: 8px !important; border-radius: 50% !important; background-color: #c2940a !important;"></span>Cambios sin guardar';
        } else {
          estado.innerHTML = '<span style="color: #1f7a1f !important;">' + icono('ok', 18) + '</span>Todo guardado';
        }
      }

      function renderizarTodo() {
        renderizarAviso();
        renderizarPestanas();
        renderizarDatos();
        renderizarBanco();
        renderizarEncuesta();
        renderizarEstado();
      }

      // ACTUALIZAR SOLO LO QUE CAMBIA AL MOVER PREGUNTAS
      function refrescarListas() {
        renderizarPestanas();
        renderizarBanco();
        renderizarEncuesta();
        renderizarEstado();
      }

      // ---------------------------------------------------------
      // OPERACIONES SOBRE LA ENCUESTA ACTIVA
      // ---------------------------------------------------------
      function insertar(id, indice) {
        var ids = armado[activa].preguntas;
        if (ids.indexOf(id) !== -1) return;
        ids.splice(indice === undefined ? ids.length : indice, 0, id);
        refrescarListas();
      }

      function mover(desde, hasta) {
        var ids = armado[activa].preguntas;
        if (hasta < 0 || hasta >= ids.length || desde === hasta) return;
        var id = ids.splice(desde, 1)[0];
        ids.splice(hasta, 0, id);
        refrescarListas();
      }

      function quitar(indice) {
        armado[activa].preguntas.splice(indice, 1);
        refrescarListas();
      }

      // ---------------------------------------------------------
      // ARRASTRAR Y SOLTAR (HTML5)
      // ---------------------------------------------------------
      var indicador = document.createElement('div');
      indicador.setAttribute('aria-hidden', 'true');
      indicador.setAttribute('style', 'height: 3px !important; border-radius: 3px !important; background-color: #027af2 !important; margin: -5px 0 !important;');

      // ÍNDICE DONDE SE SOLTARÍA, SEGÚN LA POSICIÓN DEL PUNTERO
      function indiceDeInsercion(y) {
        var items = document.querySelectorAll('#lista-encuesta [data-encuesta-indice]');
        for (var i = 0; i < items.length; i++) {
          var r = items[i].getBoundingClientRect();
          if (y < r.top + r.height / 2) return i;
        }
        return items.length;
      }

      function mostrarIndicador(indice) {
        var lista = document.getElementById('lista-encuesta');
        var items = lista.querySelectorAll('[data-encuesta-indice]');
        if (!items.length) return;
        if (indice >= items.length) lista.appendChild(indicador);
        else lista.insertBefore(indicador, items[indice]);
      }

      function limpiarArrastre() {
        if (indicador.parentNode) indicador.parentNode.removeChild(indicador);
        document.getElementById('lista-encuesta').style.setProperty('background-color', 'transparent', 'important');
        arrastre = null;
      }

      document.addEventListener('dragstart', function(e) {
        var t = e.target;
        if (!t.closest || !t.closest('#armado-encuestas') || !puedeEditar()) return;
        var b = t.closest('[data-banco-id]');
        var s = t.closest('[data-encuesta-indice]');
        if (b) arrastre = { origen: 'banco', id: parseInt(b.getAttribute('data-banco-id'), 10) };
        else if (s) arrastre = { origen: 'encuesta', indice: parseInt(s.getAttribute('data-encuesta-indice'), 10) };
        else return;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', JSON.stringify(arrastre));
        (b || s).style.setProperty('opacity', '0.4', 'important');
      });

      document.addEventListener('dragover', function(e) {
        if (!arrastre) return;
        var lista = e.target.closest && e.target.closest('#lista-encuesta');
        if (!lista) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        lista.style.setProperty('background-color', 'rgba(2, 122, 242, 0.04)', 'important');
        mostrarIndicador(indiceDeInsercion(e.clientY));
      });

      document.addEventListener('dragleave', function(e) {
        if (!arrastre) return;
        var lista = document.getElementById('lista-encuesta');
        if (!lista.contains(e.relatedTarget)) {
          if (indicador.parentNode) indicador.parentNode.removeChild(indicador);
          lista.style.setProperty('background-color', 'transparent', 'important');
        }
      });

      document.addEventListener('drop', function(e) {
        if (!arrastre) return;
        var lista = e.target.closest && e.target.closest('#lista-encuesta');
        if (!lista) return;
        e.preventDefault();
        var indice = indiceDeInsercion(e.clientY);
        var a = arrastre;
        limpiarArrastre();
        if (a.origen === 'banco') insertar(a.id, indice);
        else mover(a.indice, indice > a.indice ? indice - 1 : indice);
      });

      document.addEventListener('dragend', function() {
        if (!arrastre) return;
        limpiarArrastre();
        refrescarListas();
      });

      // ---------------------------------------------------------
      // VISTA DEL ESTUDIANTE
      // ---------------------------------------------------------
      function abrirVistaPrevia() {
        var e = armado[activa];
        document.getElementById('titulo-vista-encuesta').textContent = e.titulo || ENCUESTAS[activa].etiqueta;
        var campo = 'border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; background-color: #fcfcfc !important;';
        var html = e.descripcion ? '<p style="margin: 0 0 16px 0 !important; color: #47536b !important;">' + escapar(e.descripcion) + '</p>' : '';
        html += e.preguntas.length ? e.preguntas.map(function(id, i) {
          var p = pregunta(id);
          if (!p) return '';
          var cuerpo;
          if (p.tipo === 'texto') cuerpo = '<div style="height: 56px !important; ' + campo + '"></div>';
          else if (p.tipo === 'numero') cuerpo = '<div style="width: 140px !important; height: 40px !important; ' + campo + '"></div>';
          else {
            var forma = p.tipo === 'seleccion unica' ? '50%' : '4px';
            cuerpo = p.opciones.map(function(o) {
              return '<div style="display: flex !important; align-items: center !important; gap: 8px !important; padding: 3px 0 !important;"><span style="width: 16px !important; height: 16px !important; border: 2px solid #94a0b8 !important; border-radius: ' + forma + ' !important; box-sizing: border-box !important;"></span>' + escapar(o) + '</div>';
            }).join('');
          }
          return '<div style="padding: 12px 0 !important; border-top: ' + (i ? '1px solid rgba(194, 201, 214, 0.4)' : '0') + ' !important;">' +
            '<div style="font-weight: 500 !important; margin-bottom: 8px !important;">' + (i + 1) + '. ' + escapar(p.pregunta) + '</div>' + cuerpo + '</div>';
        }).join('') : '<p style="color: #47536b !important;">La encuesta no tiene preguntas.</p>';
        document.getElementById('cuerpo-vista-encuesta').innerHTML = html;
        mostrar(document.getElementById('modal-vista-encuesta'), true);
      }

      // ---------------------------------------------------------
      // GUARDAR
      // ---------------------------------------------------------
      function guardar() {
        var e = armado[activa];
        var error = document.getElementById('txt-error-armado');
        mostrar(error, false);
        if (!e.titulo.trim()) { error.textContent = 'Escribí el título de la encuesta.'; return mostrar(error, true, 'block'); }
        if (!e.preguntas.length) { error.textContent = 'La encuesta necesita al menos una pregunta.'; return mostrar(error, true, 'block'); }
        var promesa = conectadoArmado
          ? guardarArmadoMoodle(activa, e).then(leerArmadoMoodle).then(function(a) { armado[activa] = a[activa]; })
          : Promise.resolve();
        promesa.then(function() {
          guardado[activa] = JSON.parse(JSON.stringify(armado[activa]));
          renderizarTodo();
        }).catch(function(err) {
          error.textContent = 'No se pudo guardar: ' + err.message;
          mostrar(error, true, 'block');
        });
      }

      // ---------------------------------------------------------
      // ROL Y VISTA PREVIA LOCAL
      // ---------------------------------------------------------
      function aplicarRol(rol) {
        rolActual = rol;
        document.getElementById('badge-rol-armado').innerHTML =
          '<span style="width: 24px !important; height: 24px !important; border-radius: 50% !important; background-color: #f5f6fa !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;">' +
          icono('estudiante', 16) + '</span>' + ROLES[rol].nombre +
          '<span style="font-size: 11px !important; font-weight: 600 !important; color: #47536b !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 1px 8px !important;">' + rol + '</span>';
        mostrar(document.getElementById('btn-guardar-encuesta'), puedeEditar(), 'inline-flex');
        var botones = document.querySelectorAll('#armado-encuestas [data-preview-rol]');
        for (var i = 0; i < botones.length; i++) {
          var activo = botones[i].getAttribute('data-preview-rol') === rol;
          botones[i].style.backgroundColor = activo ? '#ffffff' : 'transparent';
          botones[i].style.color = activo ? '#0b0e14' : '#c2c9d6';
        }
        if (banco.length) renderizarTodo();
      }

      function crearBarraPreview() {
        var barra = document.createElement('div');
        barra.setAttribute('style', 'display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 8px !important; padding: 8px 12px !important; margin: 0 0 20px 0 !important; background-color: #0b0e14 !important; color: #ffffff !important; border-radius: 8px !important; font-size: 13px !important;');
        barra.innerHTML = '<span style="display: inline-flex !important; align-items: center !important; gap: 8px !important; font-weight: 500 !important; margin-right: 4px !important;">' +
          icono('ver', 18) + 'Vista previa local · ver como</span>' + Object.keys(ROLES).map(function(rol) {
            return '<button data-preview-rol="' + rol + '" style="cursor: pointer; border: 1px solid #333c4d; border-radius: 6px; padding: 3px 10px; font-family: inherit; font-weight: 600; font-size: 12px;">' + rol + '</button>';
          }).join('');
        var aviso = document.getElementById('aviso-datos-armado');
        aviso.parentNode.insertBefore(barra, aviso.nextSibling);
      }

      // ---------------------------------------------------------
      // DELEGACIÓN DE EVENTOS
      // ---------------------------------------------------------
      function accion(el) {
        var a = el.getAttribute('data-accion');
        var i = parseInt(el.getAttribute('data-indice'), 10);
        if (a === 'pestana') { activa = el.getAttribute('data-clave'); renderizarTodo(); }
        else if (a === 'agregar') insertar(parseInt(el.getAttribute('data-id'), 10));
        else if (a === 'subir') mover(i, i - 1);
        else if (a === 'bajar') mover(i, i + 1);
        else if (a === 'quitar') quitar(i);
        else if (a === 'vista-previa') abrirVistaPrevia();
        else if (a === 'cerrar-vista') mostrar(document.getElementById('modal-vista-encuesta'), false);
        else if (a === 'guardar') guardar();
      }

      document.addEventListener('click', function(e) {
        var t = e.target;
        if (!t.closest || !t.closest('#armado-encuestas')) return;
        var rol = t.closest('[data-preview-rol]');
        if (rol) return aplicarRol(rol.getAttribute('data-preview-rol'));
        if (t.id === 'modal-vista-encuesta') return mostrar(t, false);
        var el = t.closest('[data-accion]');
        if (el) accion(el);
      });

      document.addEventListener('keydown', function(e) {
        if (!e.target.closest || !e.target.closest('#armado-encuestas')) return;
        if (e.key === 'Escape') mostrar(document.getElementById('modal-vista-encuesta'), false);
        var r = e.target.getAttribute('role');
        if ((e.key === 'Enter' || e.key === ' ') && (r === 'button' || r === 'tab')) {
          e.preventDefault();
          e.target.click();
        }
      });

      document.addEventListener('input', function(e) {
        if (!e.target.closest || !e.target.closest('#armado-encuestas')) return;
        if (e.target.id === 'filtro-banco') return renderizarBanco();
        if (e.target.id === 'campo-titulo-encuesta') armado[activa].titulo = e.target.value;
        if (e.target.id === 'campo-descripcion-encuesta') armado[activa].descripcion = e.target.value;
        if (e.target.id === 'campo-titulo-encuesta' || e.target.id === 'campo-descripcion-encuesta') {
          renderizarPestanas();
          renderizarEstado();
        }
      });

      // ---------------------------------------------------------
      // INICIO
      // ---------------------------------------------------------
      var huecos = document.querySelectorAll('#armado-encuestas [data-icono]');
      for (var h = 0; h < huecos.length; h++) huecos[h].innerHTML = icono(huecos[h].getAttribute('data-icono'), 20);
      if (ES_VISTA_LOCAL) crearBarraPreview();
      aplicarRol(ROL_INICIAL);
      renderizarAviso();
      var cargaBanco = conectadoBanco ? leerBancoMoodle() : Promise.resolve(PREGUNTAS_PRUEBA.slice());
      var cargaArmado = conectadoArmado ? leerArmadoMoodle()
        : Promise.resolve(conectadoBanco
          ? { inicial: { rid: null, titulo: 'Encuesta inicial', descripcion: '', preguntas: [] }, cuatrimestral: { rid: null, titulo: 'Encuesta cuatrimestral', descripcion: '', preguntas: [] } }
          : JSON.parse(JSON.stringify(ARMADO_PRUEBA)));
      Promise.all([cargaBanco, cargaArmado]).then(function(r) {
        banco = r[0];
        armado = r[1];
        guardado = JSON.parse(JSON.stringify(armado));
        renderizarTodo();
      }).catch(function(err) {
        document.getElementById('lista-banco').innerHTML = '<div style="color: #910808 !important;">No se pudieron leer los datos: ' + escapar(err.message) + '</div>';
      });

      // AVISAR SI SE SALE CON CAMBIOS SIN GUARDAR
      window.addEventListener('beforeunload', function(e) {
        if (Object.keys(ENCUESTAS).some(hayCambios)) { e.preventDefault(); e.returnValue = ''; }
      });
    })();
  </script>
  </nolink>
</div>
