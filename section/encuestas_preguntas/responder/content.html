    <span
      style="color: #0b0e14 !important; font-weight: 600 !important; letter-spacing: 1.5px !important; text-transform: uppercase !important;">
      Zhakyz &amp; Asociados</span>
    <span>Proyecto Travesía · SBIRE · Dpto. de Ingeniería Industrial — FI-UNMdP</span>
  </div>

  <!-- SCRIPT DE MANEJO DE EVENTOS -->
  <script>
    (function() {
      // ---------------------------------------------------------
      // INYECCIÓN DINÁMICA DE ESTILOS CSS EN EL HEAD
      // ---------------------------------------------------------
      if (!document.getElementById('zhakyz-responder-style')) {
        var styleEl = document.createElement('style');
        styleEl.id = 'zhakyz-responder-style';
        styleEl.innerHTML =
          '#responder-encuesta > nolink { display: block; }' +
          '#responder-encuesta [role="button"]:focus-visible, #responder-encuesta input:focus-visible, #responder-encuesta textarea:focus-visible { outline: 3px solid rgba(2, 107, 212, 0.5); outline-offset: 2px; }' +
          '#responder-encuesta label[data-opcion]:has(input:checked) { border-color: #027af2 !important; background-color: #e5f2ff !important; }';
        document.head.appendChild(styleEl);
      }

      // ---------------------------------------------------------
      // CONFIGURACIÓN
      // ---------------------------------------------------------
      var ES_VISTA_LOCAL = window.location.protocol === 'file:' ||
        /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
      var PERIODO_ACTUAL = '2026-2';
      // Bases de Zhakyz: null hasta que se creen (data/moodle/BASE_*.json)
      // Las líneas "// @config" se copian de moodle.config.json con sincronizar_config.js: no editarlas a mano
      var CMID_PREGUNTAS = 59498; // @config bases.preguntas.cmid
      var CMID_ARMADO = null; // @config bases.armado.cmid
      var CMID_RESPUESTAS = null; // @config bases.respuestas.cmid
      var DATAID_RESPUESTAS = null; // @config bases.respuestas.dataid

      var ENCUESTAS = {
        inicial: { etiqueta: 'Encuesta inicial', frecuencia: 'Una sola vez. Podés actualizarla cuando cambie tu situación.', porPeriodo: false },
        cuatrimestral: { etiqueta: 'Encuesta cuatrimestral', frecuencia: 'Una por cuatrimestre. Período actual: ' + PERIODO_ACTUAL + '.', porPeriodo: true }
      };

      // ---------------------------------------------------------
      // ÍCONOS (Material Icons Outlined — Apache 2.0, skill diseno-ui)
      // ---------------------------------------------------------
      var ICONOS = {
        alerta: '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>',
        info: '<path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>',
        ok: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm4.59-12.42L10 14.17l-2.59-2.58L6 13l4 4 8-8z"/>',
        editar: '<path d="m14.06 9.02.92.92L5.92 19H5v-.92l9.06-9.06M17.66 3c-.25 0-.51.1-.7.29l-1.83 1.83 3.75 3.75 1.83-1.83a.996.996 0 0 0 0-1.41l-2.34-2.34c-.2-.2-.45-.29-.71-.29zm-3.6 3.19L3 17.25V21h3.75L17.81 9.94l-3.75-3.75z"/>',
        horario: '<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>',
        guardar: '<path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM6 6h9v4H6z"/>',
        flecha: '<path d="m12 4-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/>',
        volver: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>',
        estudiante: '<path d="M12 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 10c2.7 0 5.8 1.29 6 2H6c.23-.72 3.31-2 6-2m0-12C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 10c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>',
        encuestas: '<path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zm-6.49-5.84c.41-.73 1.18-1.16 1.63-1.8.48-.68.21-1.94-1.14-1.94-.88 0-1.32.67-1.5 1.23l-1.37-.57C11.51 5.96 12.52 5 13.99 5c1.23 0 2.08.56 2.51 1.26.37.6.58 1.73.01 2.57-.63.93-1.23 1.21-1.56 1.81-.13.24-.18.4-.18 1.18h-1.52c.01-.41-.06-1.08.26-1.66zm-.56 3.79c0-.59.47-1.04 1.05-1.04.59 0 1.04.45 1.04 1.04 0 .58-.44 1.05-1.04 1.05-.58 0-1.05-.47-1.05-1.05z"/>'
      };

      function icono(nombre, tamano) {
        var t = tamano || 20;
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' + t + '" height="' + t +
          '" fill="currentColor" aria-hidden="true" focusable="false" style="display: block !important; flex: 0 0 auto !important;">' +
          ICONOS[nombre] + '<\/svg>';
      }

      // ---------------------------------------------------------
      // DATOS DE PRUEBA: UNA PREGUNTA DE CADA TIPO (SOLO EN VISTA LOCAL)
      // ---------------------------------------------------------
      var USUARIO_PRUEBA = { id: 3773, nombre: 'Nicolás Gabriel Zuviria', dni: '00000000' }; // integrante de Zhakyz, DNI ficticio
      var PREGUNTAS_PRUEBA = [
        { id: 1, pregunta: '¿Trabajás actualmente?', tipo: 'seleccion unica',
          opciones: [{ texto: 'No', criticidad: 0 }, { texto: 'Sí, hasta 20 horas semanales', criticidad: 4 }, { texto: 'Sí, más de 20 horas semanales', criticidad: 8 }] },
        { id: 2, pregunta: '¿Cuántas materias estás cursando este cuatrimestre?', tipo: 'numero',
          opciones: [{ texto: '0-0', criticidad: 10 }, { texto: '1-2', criticidad: 5 }, { texto: '3-', criticidad: 0 }] }, // rangos ocultos al estudiante
        { id: 3, pregunta: '¿Qué dificultades tuviste este cuatrimestre?', tipo: 'seleccion multiple',
          opciones: [{ texto: 'Horarios', criticidad: 3 }, { texto: 'Contenidos de las materias', criticidad: 5 }, { texto: 'Económicas', criticidad: 6 }, { texto: 'Personales o familiares', criticidad: 6 }, { texto: 'Ninguna', criticidad: 0 }] },
        { id: 4, pregunta: '¿Querés contarnos algo más?', tipo: 'texto', opciones: [] }
      ];
      var ARMADO_PRUEBA = {
        inicial: { titulo: 'Encuesta inicial', descripcion: 'Contanos un poco sobre vos.', preguntas: [1, 4] },
        cuatrimestral: { titulo: 'Encuesta cuatrimestral', descripcion: '¿Cómo te fue este cuatrimestre? Te lleva menos de 5 minutos.', preguntas: [1, 2, 3, 4] }
      };
      // La encuesta inicial ya fue respondida una vez, para ver el historial
      var RESPUESTAS_PRUEBA = [
        { id_usuario: 3773, dni: '00000000', encuesta: 'inicial', periodo: '', created_at: '2026-08-12T10:05:00-03:00',
          json_pregunta_respuesta: [
            { id: 1, pregunta: '¿Trabajás actualmente?', respuesta: 'No', criticidad: 0 },
            { id: 4, pregunta: '¿Querés contarnos algo más?', respuesta: '', criticidad: null }
          ] }
      ];

      // ---------------------------------------------------------
      // CRITICIDAD (LA MISMA FORMA QUE LA RESPUESTA)
      // ---------------------------------------------------------
      // ¿El número n entra en el rango? Formato "desde-hasta" ("3-" = 3 o más); también acepta "0", "3 o más", "más de 5", "menos de 2"
      function enRango(texto, n) {
        var t = texto.trim().toLowerCase();
        var m;
        if ((m = t.match(/^(\d+(?:[.,]\d+)?)$/))) return n === parseFloat(m[1].replace(',', '.'));
        if ((m = t.match(/^(\d+(?:[.,]\d+)?)\s*(?:-|a)\s*(\d+(?:[.,]\d+)?)$/))) return n >= parseFloat(m[1].replace(',', '.')) && n <= parseFloat(m[2].replace(',', '.'));
        if ((m = t.match(/^(\d+(?:[.,]\d+)?)\s*-$/))) return n >= parseFloat(m[1].replace(',', '.'));
        if ((m = t.match(/^(\d+(?:[.,]\d+)?)\s*o\s*m[aá]s$/))) return n >= parseFloat(m[1].replace(',', '.'));
        if ((m = t.match(/^m[aá]s\s*de\s*(\d+(?:[.,]\d+)?)$/))) return n > parseFloat(m[1].replace(',', '.'));
        if ((m = t.match(/^menos\s*de\s*(\d+(?:[.,]\d+)?)$/))) return n < parseFloat(m[1].replace(',', '.'));
        return false;
      }

      function criticidadDe(p, respuesta) {
        var valor = function(texto) {
          var o = p.opciones.filter(function(x) { return x.texto === texto; })[0];
          return o ? o.criticidad : null;
        };
        if (p.tipo === 'texto') return null;
        if (p.tipo === 'seleccion multiple') return respuesta.map(valor);
        if (p.tipo === 'numero') {
          var o = p.opciones.filter(function(x) { return enRango(x.texto, respuesta); })[0];
          return o ? o.criticidad : null;
        }
        return valor(respuesta);
      }

      // ---------------------------------------------------------
      // ACCESO A DATOS
      // ---------------------------------------------------------
      // En vista local todo vive en memoria. En Moodle: preguntas y armado se leen como en los otros ítems,
      // y cada respuesta se AGREGA a la base Respuestas (rid=0 siempre: nunca se edita ni se borra una entrada).
      function guardarRespuestaMoodle(registro) {
        var url = M.cfg.wwwroot + '/mod/data/edit.php?d=' + DATAID_RESPUESTAS;
        return fetch(url, { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var form = Array.prototype.filter.call(doc.querySelectorAll('form'), function(f) { return f.querySelector('[name^="field_"]'); })[0];
            if (!form) throw new Error('No se encontró el formulario de la base Respuestas.');
            var porCampo = {};
            form.querySelectorAll('label[for]').forEach(function(l) {
              var ctrl = form.querySelector('#' + CSS.escape(l.getAttribute('for')));
              if (ctrl && /^field_/.test(ctrl.name)) porCampo[l.textContent.replace(/\s+/g, ' ').trim().toLowerCase()] = ctrl.name;
            });
            var fd = new FormData(form);
            fd.set('d', String(DATAID_RESPUESTAS));
            fd.set('rid', '0');
            ['id_usuario', 'dni', 'encuesta', 'periodo', 'json_pregunta_respuesta', 'created_at'].forEach(function(k) {
              if (!porCampo[k]) throw new Error('Falta el campo "' + k + '" en la base Respuestas.');
              var v = registro[k];
              fd.set(porCampo[k], typeof v === 'string' || typeof v === 'number' ? String(v) : JSON.stringify(v));
            });
            fd.delete('saveandadd');
            fd.set('saveandview', 'Guardar');
            return fetch(M.cfg.wwwroot + '/mod/data/edit.php', { method: 'POST', body: fd, credentials: 'same-origin' });
          })
          .then(function(r) { if (!r.ok) throw new Error('Moodle respondió ' + r.status); });
      }

      // ---------------------------------------------------------
      // ESTADO EN MEMORIA
      // ---------------------------------------------------------
      var conectado = !ES_VISTA_LOCAL && !!window.M && !!CMID_RESPUESTAS && !!DATAID_RESPUESTAS && !!CMID_ARMADO;
      var usuario = USUARIO_PRUEBA;
      var preguntas = PREGUNTAS_PRUEBA;
      var armado = ARMADO_PRUEBA;
      var respuestas = RESPUESTAS_PRUEBA.slice(); // solo se agregan
      var abierta = null; // clave de la encuesta en edición
      var avisoExito = '';

      // ---------------------------------------------------------
      // UTILIDADES
      // ---------------------------------------------------------
      function escapar(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
          return { '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;', '"': '\x26quot;', "'": '\x26#39;' }[c];
        });
      }

      function mostrar(el, visible, modo) {
        el.style.setProperty('display', visible ? (modo || 'block') : 'none', 'important');
      }

      function pregunta(id) {
        return preguntas.filter(function(p) { return p.id === id; })[0];
      }

      function fecha(iso) {
        var d = new Date(iso);
        return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      // ISO 8601 CON LA ZONA HORARIA LOCAL (POR EJEMPLO 2026-12-05T18:42:10-03:00)
      function ahoraIso() {
        var d = new Date();
        var off = -d.getTimezoneOffset();
        var dos = function(n) { return String(Math.floor(Math.abs(n))).padStart(2, '0'); };
        return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()) + 'T' + dos(d.getHours()) + ':' + dos(d.getMinutes()) + ':' + dos(d.getSeconds()) +
          (off >= 0 ? '+' : '-') + dos(off / 60) + ':' + dos(off % 60);
      }

      // RESPUESTAS DE UNA ENCUESTA (DEL PERÍODO ACTUAL SI CORRESPONDE), DE LA MÁS NUEVA A LA MÁS VIEJA
      function historial(clave) {
        return respuestas.filter(function(r) {
          return r.id_usuario === usuario.id && r.encuesta === clave && (!ENCUESTAS[clave].porPeriodo || r.periodo === PERIODO_ACTUAL);
        }).sort(function(a, b) { return a.created_at < b.created_at ? 1 : -1; });
      }

      var BTN_PRINCIPAL = 'height: 40px !important; padding: 0 16px !important; border-radius: 8px !important; border: 1px solid #333c4d !important; background-image: linear-gradient(to bottom, #333c4d, #0b0e14) !important; color: #ffffff !important; font-size: 14px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; gap: 8px !important; cursor: pointer !important; box-sizing: border-box !important;';
      var BTN_SECUNDARIO = 'height: 40px !important; padding: 0 16px !important; border-radius: 8px !important; border: 1px solid #dadee7 !important; background-color: rgba(245, 246, 250, 0.3) !important; color: #0b0e14 !important; font-size: 14px !important; font-weight: 500 !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; gap: 8px !important; cursor: pointer !important; box-sizing: border-box !important;';

      function chipEstado(texto, tono) {
        var t = tono === 'ok' ? { f: '#f6fef6', b: '#c5f7c5', c: '#1f7a1f', p: '#52bc52' } : { f: '#fffbf0', b: '#fce49c', c: '#7a5d06', p: '#c2940a' };
        return '<span style="display: inline-flex !important; align-items: center !important; gap: 6px !important; height: 24px !important; padding: 0 8px !important; border-radius: 999px !important; border: 1px solid ' + t.b + ' !important; background-color: ' + t.f + ' !important; color: ' + t.c + ' !important; font-size: 12px !important; font-weight: 600 !important; white-space: nowrap !important;">' +
          '<span style="width: 8px !important; height: 8px !important; border-radius: 50% !important; background-color: ' + t.p + ' !important;"></span>' + texto + '</span>';
      }

      // ---------------------------------------------------------
      // VISTA: LISTA DE ENCUESTAS
      // ---------------------------------------------------------
      function renderizarLista() {
        document.getElementById('vista-lista-encuestas').innerHTML = Object.keys(ENCUESTAS).map(function(k) {
          var h = historial(k);
          var respondida = h.length > 0;
          return '<div style="flex: 1 1 320px !important; background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; padding: 16px !important; display: flex !important; flex-direction: column !important; gap: 12px !important; box-sizing: border-box !important;">' +
            '<div style="display: flex !important; justify-content: space-between !important; align-items: flex-start !important; gap: 8px !important;">' +
            '<span style="width: 36px !important; height: 36px !important; border-radius: 8px !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;">' + icono('encuestas', 20) + '</span>' +
            (respondida ? chipEstado('Respondida', 'ok') : chipEstado('Pendiente', 'pendiente')) + '</div>' +
            '<div><div style="font-size: 16px !important; font-weight: 600 !important;">' + escapar(armado[k].titulo) + '</div>' +
            '<div style="color: #47536b !important;">' + escapar(ENCUESTAS[k].frecuencia) + '</div>' +
            (respondida ? '<div style="font-size: 12px !important; color: #47536b !important; margin-top: 4px !important;">Última respuesta: ' + fecha(h[0].created_at) + (h.length > 1 ? ' · ' + h.length + ' versiones' : '') + '</div>' : '') + '</div>' +
            '<div style="display: flex !important; gap: 8px !important; flex-wrap: wrap !important;">' +
            '<div role="button" tabindex="0" data-accion="abrir" data-clave="' + k + '" style="' + BTN_PRINCIPAL + '">' + (respondida ? icono('editar', 18) + 'Editar respuesta' : 'Responder' + icono('flecha', 18)) + '</div>' +
            (respondida ? '<div role="button" tabindex="0" data-accion="historial" data-clave="' + k + '" style="' + BTN_SECUNDARIO + '">' + icono('horario', 18) + 'Historial</div>' : '') +
            '</div></div>';
        }).join('');
      }

      // ---------------------------------------------------------
      // VISTA: FORMULARIO
      // ---------------------------------------------------------
      var CAMPO = 'padding: 8px 12px !important; border-radius: 8px !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; background-color: #ffffff !important; color: #0b0e14 !important; font-family: inherit !important; font-size: 14px !important; box-sizing: border-box !important;';

      // CONTROL DE UNA PREGUNTA, PRECARGADO CON LA ÚLTIMA RESPUESTA SI EXISTE
      function controlPregunta(p, previa) {
        var nombre = 'pregunta-' + p.id;
        if (p.tipo === 'texto') {
          return '<textarea name="' + nombre + '" rows="3" placeholder="Opcional" style="width: 100% !important; resize: vertical !important; ' + CAMPO + '">' + escapar(previa || '') + '</textarea>';
        }
        if (p.tipo === 'numero') {
          return '<input name="' + nombre + '" type="number" min="0" step="1" inputmode="numeric" value="' + (previa === undefined || previa === null ? '' : previa) + '" style="width: 140px !important; height: 40px !important; ' + CAMPO + '">';
        }
        var multiple = p.tipo === 'seleccion multiple';
        var marcadas = multiple ? (previa || []) : [previa];
        return '<div style="display: flex !important; flex-direction: column !important; gap: 8px !important;">' + p.opciones.map(function(o, i) {
          var id = nombre + '-' + i;
          return '<label data-opcion for="' + id + '" style="display: flex !important; align-items: center !important; gap: 10px !important; padding: 10px 12px !important; border: 1px solid #dadee7 !important; border-radius: 8px !important; background-color: #ffffff !important; cursor: pointer !important;">' +
            '<input id="' + id + '" name="' + nombre + '" type="' + (multiple ? 'checkbox' : 'radio') + '" value="' + escapar(o.texto) + '"' + (marcadas.indexOf(o.texto) !== -1 ? ' checked' : '') + ' style="width: 18px !important; height: 18px !important; margin: 0 !important; accent-color: #026bd4 !important;">' +
            escapar(o.texto) + '</label>';
        }).join('') + '</div>';
      }

      function abrirFormulario(clave) {
        abierta = clave;
        avisoExito = '';
        var e = armado[clave];
        var h = historial(clave);
        var previas = {};
        if (h.length) h[0].json_pregunta_respuesta.forEach(function(x) { previas[x.id] = x.respuesta; });
        var html = '<div style="display: flex !important; align-items: center !important; gap: 8px !important; color: #026bd4 !important; font-weight: 500 !important; cursor: pointer !important; margin-bottom: 12px !important;" role="button" tabindex="0" data-accion="volver">' + icono('volver', 18) + 'Volver a mis encuestas</div>' +
          '<div style="background-color: #ffffff !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 8px !important; padding: 20px !important;">' +
          '<div style="font-size: 20px !important; font-weight: 600 !important;">' + escapar(e.titulo) + '</div>' +
          (e.descripcion ? '<p style="margin: 4px 0 0 0 !important; color: #47536b !important;">' + escapar(e.descripcion) + '</p>' : '') +
          (h.length ? '<div style="margin-top: 12px !important; padding: 8px 12px !important; border-radius: 8px !important; background-color: #e5f2ff !important; border: 1px solid rgba(77, 166, 255, 0.4) !important; display: flex !important; gap: 8px !important; align-items: center !important;"><span style="color: #026bd4 !important;">' + icono('info', 18) + '</span>Ya respondiste el ' + fecha(h[0].created_at) + '. Si cambiás algo se guarda una versión nueva; la anterior se conserva.</div>' : '') +
          '<form id="form-respuestas" novalidate style="margin: 8px 0 0 0 !important;">' +
          e.preguntas.map(function(id, i) {
            var p = pregunta(id);
            if (!p) return '';
            var obligatoria = p.tipo !== 'texto';
            var ayuda = p.tipo === 'seleccion multiple' ? 'Podés marcar varias.' : p.tipo === 'numero' ? 'Ingresá un número.' : p.tipo === 'texto' ? 'Opcional.' : '';
            return '<fieldset data-pregunta="' + p.id + '" style="border: 0 !important; margin: 0 !important; padding: 16px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important; min-width: 0 !important;">' +
              '<legend style="font-size: 15px !important; font-weight: 600 !important; padding: 0 !important; margin-bottom: 8px !important; float: left !important; width: 100% !important;">' + (i + 1) + '. ' + escapar(p.pregunta) + (obligatoria ? ' <span style="color: #910808 !important;" aria-label="obligatoria">*</span>' : '') + '</legend>' +
              (ayuda ? '<div style="clear: both !important; font-size: 12px !important; color: #47536b !important; margin-bottom: 8px !important;">' + ayuda + '</div>' : '<div style="clear: both !important;"></div>') +
              controlPregunta(p, previas[p.id]) +
              '<div data-error-pregunta="' + p.id + '" style="display: none; color: #910808 !important; font-size: 13px !important; margin-top: 6px !important;"></div></fieldset>';
          }).join('') +
          '</form>' +
          '<div style="display: flex !important; justify-content: flex-end !important; gap: 8px !important; margin-top: 8px !important; flex-wrap: wrap !important;">' +
          '<div role="button" tabindex="0" data-accion="volver" style="' + BTN_SECUNDARIO + '">Cancelar</div>' +
          '<div id="btn-enviar-respuestas" role="button" tabindex="0" data-accion="enviar" style="' + BTN_PRINCIPAL + '">' + icono('guardar', 18) + (h.length ? 'Guardar nueva versión' : 'Enviar respuestas') + '</div></div>' +
          '<div id="txt-error-envio" style="display: none; color: #910808 !important; text-align: right !important; margin-top: 8px !important;"></div>' +
          '</div>';
        var vista = document.getElementById('vista-formulario-encuesta');
        vista.innerHTML = html;
        document.getElementById('vista-historial').innerHTML = ''; // una sola vista en el DOM: sin ids duplicados
        mostrar(document.getElementById('vista-lista-encuestas'), false);
        mostrar(document.getElementById('vista-historial'), false);
        mostrar(vista, true);
      }

      // LEER EL FORMULARIO, VALIDAR Y ARMAR LA LISTA { id, pregunta, respuesta, criticidad }
      function leerRespuestas() {
        var form = document.getElementById('form-respuestas');
        var errores = 0;
        var lista = armado[abierta].preguntas.map(pregunta).filter(Boolean).map(function(p) {
          var nombre = 'pregunta-' + p.id;
          var respuesta, error = '';
          if (p.tipo === 'texto') {
            respuesta = form.elements[nombre].value.trim();
          } else if (p.tipo === 'numero') {
            var v = form.elements[nombre].value.trim();
            respuesta = v === '' ? null : Number(v);
            if (respuesta === null || isNaN(respuesta) || respuesta < 0) error = 'Ingresá un número válido.';
          } else if (p.tipo === 'seleccion multiple') {
            respuesta = Array.prototype.filter.call(form.querySelectorAll('[name="' + nombre + '"]'), function(c) { return c.checked; }).map(function(c) { return c.value; });
            if (!respuesta.length) error = 'Marcá al menos una opción.';
          } else {
            var marcada = form.querySelector('[name="' + nombre + '"]:checked');
            respuesta = marcada ? marcada.value : null;
            if (!marcada) error = 'Elegí una opción.';
          }
          var caja = document.querySelector('[data-error-pregunta="' + p.id + '"]');
          caja.textContent = error;
          mostrar(caja, !!error);
          if (error) errores++;
          return { id: p.id, pregunta: p.pregunta, respuesta: respuesta, criticidad: error ? null : criticidadDe(p, respuesta) };
        });
        return errores ? null : lista;
      }

      function enviar() {
        var lista = leerRespuestas();
        var error = document.getElementById('txt-error-envio');
        if (!lista) {
          error.textContent = 'Revisá las preguntas marcadas.';
          mostrar(error, true);
          var primera = document.querySelector('[data-error-pregunta]:not([style*="display: none"])');
          if (primera) primera.closest('fieldset').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        var h = historial(abierta);
        if (h.length && JSON.stringify(h[0].json_pregunta_respuesta) === JSON.stringify(lista)) {
          error.textContent = 'No cambiaste ninguna respuesta.';
          return mostrar(error, true);
        }
        var registro = {
          id_usuario: usuario.id,
          dni: usuario.dni,
          encuesta: abierta,
          periodo: ENCUESTAS[abierta].porPeriodo ? PERIODO_ACTUAL : '',
          json_pregunta_respuesta: lista,
          created_at: ahoraIso()
        };
        var btn = document.getElementById('btn-enviar-respuestas');
        btn.textContent = 'Guardando…';
        (conectado ? guardarRespuestaMoodle(registro) : Promise.resolve()).then(function() {
          respuestas.push(registro); // solo se agrega
          avisoExito = h.length ? 'Guardamos una nueva versión de tus respuestas. La anterior quedó en el historial.' : '¡Gracias! Guardamos tus respuestas.';
          mostrarHistorial(abierta);
        }).catch(function(e) {
          btn.textContent = 'Reintentar';
          error.textContent = 'No se pudo guardar: ' + e.message;
          mostrar(error, true);
        });
      }

      // ---------------------------------------------------------
      // VISTA: HISTORIAL (CON EL REGISTRO TAL COMO SE GUARDA)
      // ---------------------------------------------------------
      function mostrarHistorial(clave) {
        abierta = clave;
        var h = historial(clave);
        var html = '<div style="display: flex !important; align-items: center !important; gap: 8px !important; color: #026bd4 !important; font-weight: 500 !important; cursor: pointer !important; margin-bottom: 12px !important;" role="button" tabindex="0" data-accion="volver">' + icono('volver', 18) + 'Volver a mis encuestas</div>';
        if (avisoExito) {
          html += '<div style="display: flex !important; gap: 10px !important; align-items: flex-start !important; padding: 10px 14px !important; border-radius: 10px !important; background-color: #f6fef6 !important; border: 1px solid #c5f7c5 !important; margin-bottom: 16px !important;"><span style="color: #1f7a1f !important;">' + icono('ok', 20) + '</span><span>' + escapar(avisoExito) + '</span></div>';
        }
        html += '<div style="font-size: 18px !important; font-weight: 600 !important; margin-bottom: 4px !important;">Historial · ' + escapar(armado[clave].titulo) + '</div>' +
          '<div style="color: #47536b !important; margin-bottom: 12px !important;">Las respuestas nunca se borran: cada edición agrega una versión. La vigente es la más reciente.</div>';
        html += h.map(function(r, i) {
          return '<details style="background-color: #ffffff !important; border: 1px solid ' + (i === 0 ? '#c5f7c5' : 'rgba(194, 201, 214, 0.4)') + ' !important; border-radius: 8px !important; padding: 12px 14px !important; margin-bottom: 8px !important;"' + (i === 0 ? ' open' : '') + '>' +
            '<summary style="cursor: pointer !important; display: flex !important; align-items: center !important; gap: 8px !important; flex-wrap: wrap !important; font-weight: 500 !important;">' +
            'Versión ' + (h.length - i) + ' · ' + fecha(r.created_at) + (i === 0 ? ' ' + chipEstado('Vigente', 'ok') : '') + '</summary>' +
            '<div style="margin-top: 10px !important;">' + r.json_pregunta_respuesta.map(function(x) {
              var resp = Array.isArray(x.respuesta) ? x.respuesta.join(', ') : (x.respuesta === '' || x.respuesta === null ? '—' : x.respuesta);
              var crit = Array.isArray(x.criticidad) ? '[' + x.criticidad.join(', ') + ']' : (x.criticidad === null ? 'no aplica' : x.criticidad);
              return '<div style="display: flex !important; justify-content: space-between !important; gap: 12px !important; padding: 6px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important;">' +
                '<div><div style="color: #47536b !important; font-size: 12px !important;">' + escapar(x.pregunta) + '</div><div style="font-weight: 500 !important;">' + escapar(resp) + '</div></div>' +
                '<div style="flex: 0 0 auto !important; font-size: 12px !important; color: #47536b !important; text-align: right !important;">criticidad<br><b style="color: #0b0e14 !important; font-size: 14px !important;">' + escapar(crit) + '</b></div></div>';
            }).join('') + '</div>' +
            '<details style="margin-top: 8px !important;"><summary style="cursor: pointer !important; font-size: 12px !important; color: #026bd4 !important;">Ver el registro tal como se guarda</summary>' +
            '<pre style="margin: 8px 0 0 0 !important; padding: 10px 12px !important; background-color: #0b0e14 !important; color: #ebeef4 !important; border-radius: 8px !important; font-size: 12px !important; line-height: 1.45 !important; overflow-x: auto !important; white-space: pre !important;">' +
            escapar(JSON.stringify(r, null, 2)) + '</pre></details></details>';
        }).join('');
        var vista = document.getElementById('vista-historial');
        vista.innerHTML = html;
        document.getElementById('vista-formulario-encuesta').innerHTML = '';
        mostrar(document.getElementById('vista-lista-encuestas'), false);
        mostrar(document.getElementById('vista-formulario-encuesta'), false);
        mostrar(vista, true);
      }

      function volver() {
        abierta = null;
        avisoExito = '';
        renderizarLista();
        document.getElementById('vista-formulario-encuesta').innerHTML = '';
        document.getElementById('vista-historial').innerHTML = '';
        mostrar(document.getElementById('vista-formulario-encuesta'), false);
        mostrar(document.getElementById('vista-historial'), false);
        mostrar(document.getElementById('vista-lista-encuestas'), true, 'flex');
      }

      // ---------------------------------------------------------
      // DELEGACIÓN DE EVENTOS
      // ---------------------------------------------------------
      document.addEventListener('click', function(e) {
        var t = e.target;
        if (!t.closest || !t.closest('#responder-encuesta')) return;
        var el = t.closest('[data-accion]');
        if (!el) return;
        var a = el.getAttribute('data-accion');
        if (a === 'abrir') abrirFormulario(el.getAttribute('data-clave'));
        else if (a === 'historial') { avisoExito = ''; mostrarHistorial(el.getAttribute('data-clave')); }
        else if (a === 'volver') volver();
        else if (a === 'enviar') enviar();
      });

      document.addEventListener('keydown', function(e) {
        if (!e.target.closest || !e.target.closest('#responder-encuesta')) return;
        if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute('role') === 'button') {
          e.preventDefault();
          e.target.click();
        }
      });

      // ---------------------------------------------------------
      // INICIO
      // ---------------------------------------------------------
      var aviso = document.getElementById('aviso-datos-responder');
      aviso.innerHTML = '<span style="color: #aa8109 !important; padding-top: 1px !important;">' + icono('alerta', 20) + '</span><span>' +
        (conectado ? 'Conectado a las bases de Zhakyz.' : '<b style="font-weight: 600 !important;">Datos de prueba.</b> Usuario de prueba: ' + escapar(USUARIO_PRUEBA.nombre) + ' (DNI ficticio). Una pregunta de cada tipo; las respuestas se guardan solo en memoria.') + '</span>';
      document.getElementById('badge-usuario-responder').innerHTML =
        '<span style="width: 24px !important; height: 24px !important; border-radius: 50% !important; background-color: #f5f6fa !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;">' +
        icono('estudiante', 16) + '</span>' + escapar(usuario.nombre) +
        '<span style="font-size: 11px !important; font-weight: 600 !important; color: #47536b !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 1px 8px !important;">EST</span>';
      renderizarLista();
    })();
  </script>
  </nolink>
</div>
