<!-- SECCIÓN: __TITULO__ (ROLES __ROLES__) -->
<!-- DISEÑO: SKILL diseno-ui (PLANTILLA DASHBOARD DE MATERIAL UI) -->
<!-- CONTENEDOR PRINCIPAL -->
<div id="__ID_SECCION__"
  style="position: relative !important; background-color: #fcfcfc !important; border: 1px solid rgba(194, 201, 214, 0.4) !important; border-radius: 10px !important; padding: 24px !important; max-width: 850px !important; margin: 20px auto !important; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important; font-size: 14px !important; line-height: 1.5 !important; color: #0b0e14 !important; box-sizing: border-box !important; text-align: left !important;">

  <!-- ENCABEZADO -->
  <div
    style="display: flex !important; align-items: flex-start !important; justify-content: space-between !important; gap: 16px !important; flex-wrap: wrap !important; margin-bottom: 18px !important;">
    <div>
      <div
        style="font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0.5px !important; text-transform: uppercase !important; color: #47536b !important; margin-bottom: 4px !important;">
        Proyecto Travesía · SBIRE</div>
      <h3
        style="margin: 0 0 4px 0 !important; color: #0b0e14 !important; font-size: 24px !important; font-weight: 600 !important; line-height: 1.5 !important;">
        __TITULO__</h3>
      <p
        style="margin: 0 !important; color: #47536b !important; font-size: 14px !important; line-height: 1.5 !important;">
        __SUBTITULO__</p>
    </div>
    <div id="badge-rol-__SECCION__"
      style="display: flex !important; align-items: center !important; gap: 8px !important; background-color: #ffffff !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 4px 12px 4px 6px !important; font-size: 13px !important; font-weight: 500 !important; color: #0b0e14 !important;">
    </div>
  </div>

  <!-- AVISO: DATOS DE PRUEBA -->
  <div id="aviso-datos-prueba-__SECCION__"
    style="display: none; align-items: flex-start !important; gap: 10px !important; background-color: #fdf1ce !important; border: 1px solid rgba(246, 206, 85, 0.5) !important; color: #0b0e14 !important; border-radius: 10px !important; padding: 10px 14px !important; margin-bottom: 20px !important;">
    <span data-icono="alerta" style="color: #aa8109 !important; padding-top: 1px !important;"></span>
    <span><b style="font-weight: 600 !important;">Datos de prueba.</b> Integrantes de Zhakyz con datos ficticios. Las bases de la sección Zhakyz todavía no están creadas.</span>
  </div>

  <!-- CONTENIDO -->
  <div id="contenido-__SECCION__"></div>

  <!-- PIE DE PÁGINA ZHAKYZ -->
  <div id="footer-zhakyz"
    style="display: flex !important; flex-wrap: wrap !important; align-items: center !important; justify-content: space-between !important; gap: 6px 16px !important; margin: 24px 0 0 0 !important; padding: 14px 0 0 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important; font-size: 12px !important; color: #47536b !important; text-align: left !important;">
    <span
      style="color: #0b0e14 !important; font-weight: 600 !important; letter-spacing: 1.5px !important; text-transform: uppercase !important;">
      Zhakyz &amp; Asociados</span>
    <span>Proyecto Travesía · SBIRE · Dpto. de Ingeniería Industrial — FI-UNMdP</span>
  </div>

  <!-- SCRIPT DE MANEJO DE EVENTOS -->
  <script>
    (function() {
      // ---------------------------------------------------------
      // INYECCIÓN DINÁMICA DE ESTILOS CSS EN EL HEAD
      // ---------------------------------------------------------
      if (!document.getElementById('zhakyz-__SECCION__-style')) {
        var styleEl = document.createElement('style');
        styleEl.id = 'zhakyz-__SECCION__-style';
        styleEl.innerHTML =
          '@keyframes zk-aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }';
        document.head.appendChild(styleEl);
      }

      // ---------------------------------------------------------
      // CONFIGURACIÓN
      // ---------------------------------------------------------
      // En Moodle el rol saldrá del grupo del usuario; acá arranca en ADM.
      var ROL_INICIAL = 'ADM';
      var ES_VISTA_LOCAL = window.location.protocol === 'file:' ||
        /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
      // Bases de la sección Zhakyz (null hasta que se creen). Solo se usan bases propias.
      var CMID_DATOS = null;

      var ROLES = {
        ADM: { nombre: 'Administrador' },
        GES: { nombre: 'Gestor Dpto. Industrial' },
        TUT: { nombre: 'Tutor / Entrevistador' },
        PAR: { nombre: 'Asesor Par' }
      };

      // ---------------------------------------------------------
      // ÍCONOS (copiar los necesarios de .skills/diseno-ui/iconos.js)
      // ---------------------------------------------------------
      var ICONOS = {
        alerta: '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>',
        ver: '<path d="M12 6a9.77 9.77 0 0 1 8.82 5.5C19.17 14.87 15.79 17 12 17s-7.17-2.13-8.82-5.5A9.77 9.77 0 0 1 12 6m0-2C7 4 2.73 7.11 1 11.5 2.73 15.89 7 19 12 19s9.27-3.11 11-7.5C21.27 7.11 17 4 12 4zm0 5a2.5 2.5 0 0 1 0 5 2.5 2.5 0 0 1 0-5m0-2c-2.48 0-4.5 2.02-4.5 4.5S9.52 16 12 16s4.5-2.02 4.5-4.5S14.48 7 12 7z"/>',
        estudiante: '<path d="M12 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 10c2.7 0 5.8 1.29 6 2H6c.23-.72 3.31-2 6-2m0-12C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 10c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>'
      };

      // SVG DE UN ÍCONO: HEREDA EL COLOR DEL TEXTO
      function icono(nombre, tamano) {
        var t = tamano || 20;
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' + t + '" height="' + t +
          '" fill="currentColor" aria-hidden="true" focusable="false" style="display: block !important; flex: 0 0 auto !important;">' +
          ICONOS[nombre] + '<\/svg>';
      }

      // ---------------------------------------------------------
      // DATOS DE PRUEBA: INTEGRANTES DE ZHAKYZ (DATOS FICTICIOS)
      // ---------------------------------------------------------
      var DATOS_PRUEBA = [
        { usuario: '3770', nombre: 'Luca Zuanetti' },
        { usuario: '2806', nombre: 'Gian Luca Distefano' },
        { usuario: '3751', nombre: 'Santiago Nicolás Yanosky' },
        { usuario: '3773', nombre: 'Nicolás Gabriel Zuviria' },
        { usuario: '3623', nombre: 'Nahuel Spikerman' },
        { usuario: '2048', nombre: 'Valentino Hernández Pascual' }
      ];

      // ---------------------------------------------------------
      // ACCESO A DATOS
      // ---------------------------------------------------------
      // LEER UNA BASE DE ZHAKYZ: LA PLANTILLA DE LISTA EXPONE CADA CAMPO COMO data-* EN .zk-registro
      function leerBaseMoodle(cmid) {
        return fetch(M.cfg.wwwroot + '/mod/data/view.php?id=' + cmid + '&perpage=1000', { credentials: 'same-origin' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            return Array.prototype.map.call(doc.querySelectorAll('.zk-registro'), function(el) {
              return Object.assign({}, el.dataset);
            });
          });
      }

      // CARGAR DATOS (BASE PROPIA O DATOS DE PRUEBA)
      function cargarDatos() {
        if (ES_VISTA_LOCAL || !CMID_DATOS || !window.M) {
          document.getElementById('aviso-datos-prueba-__SECCION__').style.setProperty('display', 'flex', 'important');
          return Promise.resolve(DATOS_PRUEBA);
        }
        return leerBaseMoodle(CMID_DATOS);
      }

      // ---------------------------------------------------------
      // UTILIDADES DE PRESENTACIÓN
      // ---------------------------------------------------------
      function escapar(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function chipRol(rol) {
        return '<span style="font-size: 11px !important; font-weight: 600 !important; color: #47536b !important; background-color: #f5f6fa !important; border: 1px solid #dadee7 !important; border-radius: 999px !important; padding: 1px 8px !important; line-height: 18px !important;">' + rol + '</span>';
      }

      // ---------------------------------------------------------
      // RENDERIZADO
      // ---------------------------------------------------------
      function renderizar(datos) {
        document.getElementById('contenido-__SECCION__').innerHTML = datos.map(function(d) {
          return '<div style="padding: 10px 0 !important; border-top: 1px solid rgba(194, 201, 214, 0.4) !important; animation: zk-aparecer 0.25s ease both !important;">' +
            escapar(d.nombre) + '</div>';
        }).join('');
      }

      // ---------------------------------------------------------
      // ROL Y VISTA PREVIA LOCAL
      // ---------------------------------------------------------
      function aplicarRol(rol) {
        document.getElementById('badge-rol-__SECCION__').innerHTML =
          '<span style="width: 24px !important; height: 24px !important; border-radius: 50% !important; background-color: #f5f6fa !important; color: #47536b !important; display: inline-flex !important; align-items: center !important; justify-content: center !important;">' +
          icono('estudiante', 16) + '</span>' + ROLES[rol].nombre + chipRol(rol);
        var botones = document.querySelectorAll('[data-preview-rol]');
        for (var i = 0; i < botones.length; i++) {
          var activo = botones[i].getAttribute('data-preview-rol') === rol;
          botones[i].style.backgroundColor = activo ? '#ffffff' : 'transparent';
          botones[i].style.color = activo ? '#0b0e14' : '#c2c9d6';
        }
      }

      // BARRA PARA CAMBIAR DE ROL: SOLO EXISTE AL ABRIR EL ARCHIVO EN LOCAL
      function crearBarraPreview() {
        var barra = document.createElement('div');
        barra.setAttribute('style', 'display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 8px !important; padding: 8px 12px !important; margin: 0 0 20px 0 !important; background-color: #0b0e14 !important; color: #ffffff !important; border-radius: 8px !important; font-size: 13px !important;');
        barra.innerHTML = '<span style="display: inline-flex !important; align-items: center !important; gap: 8px !important; font-weight: 500 !important; margin-right: 4px !important;">' +
          icono('ver', 18) + 'Vista previa local · ver como</span>' + Object.keys(ROLES).map(function(rol) {
          return '<button data-preview-rol="' + rol + '" style="cursor: pointer; border: 1px solid #333c4d; border-radius: 6px; padding: 3px 10px; font-family: inherit; font-weight: 600; font-size: 12px;">' + rol + '</button>';
        }).join('');
        var cont = document.getElementById('__ID_SECCION__');
        cont.insertBefore(barra, cont.firstChild);
      }

      // ---------------------------------------------------------
      // DELEGACIÓN DE EVENTOS
      // ---------------------------------------------------------
      document.addEventListener('click', function(e) {
        var t = e.target;
        if (!t.closest || !t.closest('#__ID_SECCION__')) return;
        var btnRol = t.closest('[data-preview-rol]');
        if (btnRol) return aplicarRol(btnRol.getAttribute('data-preview-rol'));
      });

      // ---------------------------------------------------------
      // INICIO
      // ---------------------------------------------------------
      // Íconos declarados en el HTML con data-icono
      var huecos = document.querySelectorAll('#__ID_SECCION__ [data-icono]');
      for (var h = 0; h < huecos.length; h++) {
        huecos[h].innerHTML = icono(huecos[h].getAttribute('data-icono'), 20);
      }
      if (ES_VISTA_LOCAL) crearBarraPreview();
      aplicarRol(ROL_INICIAL);
      cargarDatos().then(renderizar);
    })();
  </script>
</div>
