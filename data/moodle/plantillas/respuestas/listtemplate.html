<tr class="zk-registro" data-tipo="entrada_respuesta" data-rid="##id##" data-alta="##timeadded##" data-modificada="##timemodified##">
        <td data-campo="id_usuario">[[id_usuario]]</td>
        <td data-campo="dni">[[dni]]</td>
        <td data-campo="encuesta">[[encuesta]]</td>
        <td data-campo="version_encuesta">[[version_encuesta]]</td>
        <td data-campo="periodo">[[periodo]]</td>
        <td class="small" style="max-width: 420px !important;">
          <details class="zk-json">
            <summary title="Ver las respuestas completas" style="display: block !important; overflow: hidden !important; white-space: nowrap !important; text-overflow: ellipsis !important; max-width: 420px !important; cursor: pointer !important; color: #026bd4 !important;">[[json_pregunta_respuesta]]</summary>
            <pre class="zk-json-completo" data-campo="json_pregunta_respuesta" style="margin: 8px 0 0 0 !important; padding: 10px 12px !important; max-height: 420px !important; overflow: auto !important; white-space: pre-wrap !important; word-break: break-word !important; background-color: #0b0e14 !important; color: #ebeef4 !important; border-radius: 8px !important; font-size: 12px !important; line-height: 1.45 !important;">[[json_pregunta_respuesta]]</pre>
          </details>
        </td>
        <td class="text-nowrap" data-campo="created_at">[[created_at]]</td>
      </tr>
