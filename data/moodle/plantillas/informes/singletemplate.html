<div class="my-4">
  <p class="text-muted small mb-3">Conclusiones de un informe de Reportes. No se edita: un cambio agrega una entrada nueva.</p>
  <dl class="row">
    <dt class="col-sm-3">Informe</dt><dd class="col-sm-9">[[titulo]] ([[informe]])</dd>
    <dt class="col-sm-3">Período</dt><dd class="col-sm-9">[[periodo]]</dd>
    <dt class="col-sm-3">Cohorte</dt><dd class="col-sm-9">[[cohorte]]</dd>
    <dt class="col-sm-3">Año de la carrera</dt><dd class="col-sm-9">[[tramo]]</dd>
    <dt class="col-sm-3">Conclusiones</dt><dd class="col-sm-9" style="white-space: pre-wrap;">[[conclusiones]]</dd>
    <dt class="col-sm-3">Autor</dt><dd class="col-sm-9">##user##</dd>
    <dt class="col-sm-3">Fecha</dt><dd class="col-sm-9">[[created_at]] (alta: ##timeadded##)</dd>
  </dl>
</div>
