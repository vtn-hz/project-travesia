<tr class="zk-registro" data-tipo="entrada_encuesta" data-rid="##id##">
        <td data-campo="codigo_encuesta">[[codigo_encuesta]]</td>
        <td data-campo="version">[[version]]</td>
        <td class="small" style="max-width: 420px !important;">
          <details class="zk-json">
            <summary title="Ver las preguntas completas" style="display: block !important; overflow: hidden !important; white-space: nowrap !important; text-overflow: ellipsis !important; max-width: 420px !important; cursor: pointer !important; color: #026bd4 !important;">[[json_preguntas]]</summary>
            <pre class="zk-json-completo" data-campo="json_preguntas" style="margin: 8px 0 0 0 !important; padding: 10px 12px !important; max-height: 420px !important; overflow: auto !important; white-space: pre-wrap !important; word-break: break-word !important; background-color: #0b0e14 !important; color: #ebeef4 !important; border-radius: 8px !important; font-size: 12px !important; line-height: 1.45 !important;">[[json_preguntas]]</pre>
          </details>
        </td>
        <td data-campo="por_periodo">[[por_periodo]]</td>
        <td data-campo="puntaje_maximo">[[puntaje_maximo]]</td>
        <td class="text-nowrap" data-campo="created_at">[[created_at]]</td>
      </tr>
