<div id="defaulttemplate-single" class="my-5">
    <div class="defaulttemplate-single-body my-5">
        <div class="row my-6">
            <div class="col-auto">##userpicture##</div>
            <div class="col">
                <div class="row h-100">
                    <div class="col-3 align-self-center">
                        ##user##<br/><span class="data-timeinfo">##timeadded##</span>
                    </div>
                    <div class="col-4 col-md-6 text-end align-self-center data-timeinfo">
                        <span class="fw-bold ">Editado por última vez:&nbsp;</span>##timemodified##
                    </div>
                    <div class="col-4 col-md-3 ms-auto align-self-center d-flex flex-row-reverse">
                        <div>##actionsmenu##</div>
                        <div class="ms-auto my-auto ##approvalstatusclass##">##approvalstatus##</div>
                    </div>
                </div>
            </div>
        </div>
        <hr/>

        <div class="my-6">
            <div class="mt-4">
                <span class="fw-bold">DNI</span>
                <p class="mt-2">[[DNI]]</p>
            </div>
            <div class="mt-4">
                <span class="fw-bold">Estudiante</span>
                <p class="mt-2">[[Estudiante]]</p>
            </div>
            <div class="mt-4">
                <span class="fw-bold">Materia</span>
                <p class="mt-2">[[Materia]]</p>
            </div>
            <div class="mt-4">
                <span class="fw-bold">Instancia</span>
                <p class="mt-2">[[Instancia]]</p>
            </div>
            <div class="mt-4">
                <span class="fw-bold">Fecha</span>
                <p class="mt-2">[[Fecha]]</p>
            </div>
            <div class="mt-4">
                <span class="fw-bold">Nota</span>
                <p class="mt-2">[[Nota]]</p>
            </div>
            <div class="mt-4">
                <span class="fw-bold">Estado</span>
                <p class="mt-2">[[Estado]]</p>
            </div>
        ##otherfields##
            <div class="mt-4">
                <span class="fw-bold">Marcas</span>
                <p class="mt-2">##tags##</p>
            </div>
        </div>
    </div>
</div>
